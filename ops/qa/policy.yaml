schema_version: 1

prod:
  capture_enabled: true
  maintenance_schedule_utc: "*:15"

  # QA S3 archive retired 2026-11-08 (user decision). Local data stays 24h; host
  # timer tokenkey-qa-archive (ops/qa/node1_archive.py) copies to node1 every 4h.
  # COS holds database backups only. Design: docs/approved/design-tencent-cos-backup-node1-qa.md
  local_lifecycle:
    provision_owner: tokenkey-qa-provision
    cleanup_owner: tokenkey-qa-cleanup
    retention_hours: 24
    delete_unarchived: true
    archive_uploads: retired

  lifecycle:
    owner: tokenkey-qa-maintenance
    future_horizon_hours: 72
    drop_requires_raw_commit: true
    drop_requires_restore_verified: true
    drop_requires_capture_seal: true
    provision_lock_retry_sqlstate: "55P03"
    provision_lock_retry_backoff_ms: [250, 500, 1000, 2000, 4000, 8000]

  archive:
    enabled: false
    scope: all_users_all_api_keys
    shard_minutes: 60
    seal_delay_minutes: 15
    max_catchup_windows_per_run: 1
    catchup_gap_policy: accepted_terminal
    s3_retention_days: 7
    raw_user_access: false
    runner_uid: 1000
    runner_gid: 1000
    host_scratch_dir: /var/lib/tokenkey/app/qa_archive_tmp
    container_scratch_dir: /app/data/qa_archive_tmp
    host_receipt_path: /var/lib/tokenkey/qa-maintenance-last-run.json

  disk_monitor:
    used_percent: 80
    free_gib: 10
    automatic_cleanup: false
    pause_capture: false
