schema_version: 1
# Deploy-time env injection defaults for Stage0 SSM deploy scripts.
# Target runtime policy values: ops/qa/policy.yaml (SSOT).
# Rollout gates keep repository readiness separate from observed production state;
# document approval alone does not prove deployment or activate the single owner.
# observed_* fields are reconciled by live probes.

prod:
  QA_ARCHIVE_ENABLED:
    deploy_inject_default: true
    policy_target: prod.archive.enabled
    target_deploy_inject_default: true
    enable_after: docs/approved/design-qa-phase2-archive-closeout.md#production-rollout
    repository_closeout_state: production_recloseout_verified
    observed_live_state: production_recloseout_verified
  tokenkey_qa_maintenance_timer:
    repository_closeout_state: single_owner_ready
    observed_live_state: single_owner_not_activated
    policy_target_state: sole_lifecycle_owner_after_activation
    host_artifact_sync_on_prod_deploy: required
    host_artifact_source: target_release_tag
    sync_active_service_policy: bounded_drain_then_replace
    sync_failure_restore_policy: pre_sync_timer_state
    min_consecutive_scheduled_runs: 2
    host_runner: /usr/local/bin/tokenkey-qa-maintenance.sh
    health_evaluator: ops/qa/qa_phase2_health.py
    live_health_probe: ops/observability/probe-qa-phase2-live-health.sh
    live_health_evaluator: ops/qa/prod_phase2_live_health.py
    catchup_gap_policy: accepted_terminal
    health_evidence:
      - systemd
      - host_receipt
      - database_heartbeat
      - archive_control_rows
  tokenkey_qa_boundary:
    repository_closeout_state: pre_activation_fixed_age_transition
    observed_live_state: single_owner_not_activated
    policy_target_state: disabled_after_single_owner_activate
    host_artifact_sync_on_prod_deploy: required
    host_artifact_source: target_release_tag
    sync_active_service_policy: bounded_drain_then_replace
    sync_failure_restore_policy: activation_receipt_forces_disabled
    deploy_owner_restore_mode: durable_single_owner_activation_receipt
    schedule_utc: "*:00"
    randomized_delay_minutes: 0
    host_runner: /usr/local/bin/tokenkey-qa-boundary.sh
    host_receipt: /var/lib/tokenkey/qa-boundary-last-run.json
    database_heartbeat_job: qa-boundary
    pre_activation_role: provision_and_fixed_age_whole_partition_cleanup
    pre_activation_retention_hours: 24
    pre_activation_terminal_gap_policy: persist_before_drop
    activation_receipt_phase: single_owner_activate
    health_evidence:
      - boundary_systemd
      - boundary_host_receipt
      - boundary_database_heartbeat
      - qa_records_catalog
  qa_records:
    partition_owner_repository: tokenkey-qa-maintenance
    partition_owner_observed: qa_lifecycle_boundary
  user_export:
    phase3_worker_repository_state: s3_bundle_ready
    phase3_worker_observed_state: transitional_in_prod
    job_registry: immutable_s3_spec
    database_job_registry: retired
    bundle_infra_repository_state: ready
    bundle_infra_observed_state: not_verified
    bundle_worker_desired_count: 1
    bundle_readiness_verifier: ops/qa/verify_qa_bundle_infra.sh
    bundle_canary: ops/stage0/run-qa-bundle-canary-via-ssm.sh
  QA_CAPTURE_ENABLED:
    deploy_inject: edge_only_false
    policy_target: prod.capture_enabled
  raw_archive_recovery:
    repository_state: ready
    repository_iam_state: contract_ready
    observed_iam_state: applied
    iam_contract_verifier: ops/qa/verify_raw_archive_iam_contract.py
    iam_contract_reconciler: ops/qa/reconcile_raw_archive_iam_contract.sh
    independent_evidence_state: production_workstation_recovery_verified
    recovery_cli: backend/cmd/qa-archive
    retirement_gate: ops/qa/qa_archive_recovery_gate.py
    break_glass_state: retired
    shared_role_boundary: shared_ec2_instance_role_no_process_isolation

edge:
  QA_CAPTURE_ENABLED:
    deploy_inject_default: false
    policy_target: edge.capture_enabled
  QA_ARCHIVE_ENABLED:
    deploy_inject_default: false
    policy_target: edge.archive_enabled
