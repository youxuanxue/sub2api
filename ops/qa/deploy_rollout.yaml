schema_version: 1
# Deploy-time env injection defaults for Stage0 SSM deploy scripts.
# Target runtime policy values: ops/qa/policy.yaml (SSOT).
# Rollout gates keep repository readiness separate from observed production state;
# document approval alone does not prove deployment or activate the single owner.
# observed_* fields are reconciled by live probes.

prod:
  component_release:
    # QA S3 retired 2026-11-08: a gateway release plans no QA component step.
    # The planner still accepts raw_archive_v1 for rollback targets <= 1.8.353.
    runtime_contract: gateway_only_v1
    repository_state: ready
    observed_live_state: not_deployed
    planner: ops/stage0/prod_release_plan.py
    verified_state: /var/lib/tokenkey/qa-release/verified.json
  QA_ARCHIVE_ENABLED:
    # Retired: deploy scripts never inject QA_ARCHIVE_*; absent key = gateway default off.
    # Local 24h + node1 copy every 4h (host timer tokenkey-qa-archive, ops/qa/node1_archive.py);
    # COS holds database backups only. Design: docs/approved/design-tencent-cos-backup-node1-qa.md
    state: retired
    retired_on: "2026-11-08"
    decided_by: user
    deploy_inject_default: false
    policy_target: prod.archive.enabled
    target_deploy_inject_default: false
  qa_records:
    # QA S3 retired 2026-11-08: hourly partitions are owned by the local
    # tokenkey-qa-provision / tokenkey-qa-cleanup timers (policy.yaml local_lifecycle).
    partition_owner_repository: tokenkey-qa-provision
  QA_CAPTURE_ENABLED:
    policy_target: prod.capture_enabled
  QA_CAPTURE_BODY_MAX_BYTES:
    policy_target: prod.capture_body_max_bytes
    default_bytes: 1153434
  # QA S3 retired 2026-11-08: verifier/reconciler/recovery gate scripts removed.
  raw_archive_recovery:
    repository_state: ready
    repository_iam_state: contract_ready
    observed_iam_state: applied
    independent_evidence_state: production_workstation_recovery_verified
    recovery_cli: removed_2026-11-08
    break_glass_state: retired
    shared_role_boundary: shared_ec2_instance_role_no_process_isolation
