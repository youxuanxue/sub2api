schema_version: 1
# Repo-evidence pipeline state for generic usage/ops data-layer archive (not live prod).
# Refresh ledgers/receipts under .testing/user-stories/attachments/ after each operator batch.
# Live probes: ops/observability/probe-data-layer-*.sh (read-only; do not treat this file as runtime truth).

design_anchors:
  phase1_closeout: docs/approved/design-data-layer-phase1-closeout.md
  archive_bucket: docs/approved/design-prod-archive-bucket.md
  export_canary: docs/approved/design-data-layer-prod-export-canary.md

retention_hot_layer_days:
  usage: 90
  ops: 30

legacy_export_upper_exclusive: "2026-07-01T00:00:00.000000Z"

stories:
  rehearsal: US-037
  prod_canary: US-039
  legacy_export_promote: US-040
  phase1_closeout: US-042

evidence_attachments:
  cleanup_hold_glob: "US-039-prod-cleanup-hold-*.json"
  cleanup_release_receipt_glob: "US-039-prod-cleanup-hold-release-*.json"
  export_ledger_template: "US-040-{table_slug}-export-ledger.json"
  promote_ledger_template: "US-040-{table_slug}-promote-ledger.json"
  tail_export_ledger_template: "US-040-{table_slug}-tail-export-ledger.json"
  tail_promote_ledger_template: "US-040-{table_slug}-tail-promote-ledger.json"
  closeout_receipt_template: "US-040-{table_slug}-archive-closeout.json"
  table_slugs:
    ops_system_logs: ops-system-logs
    ops_error_logs: ops-error-logs

closeout_required_before_cleanup_release: true
# Release gate only: first cleanup-hold release requires both ops closeout receipts
# in repo evidence. Ongoing age-based cleanup does not re-check this flag.
