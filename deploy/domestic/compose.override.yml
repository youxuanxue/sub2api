# Merge with ../stage0/docker-compose.yml. Supply immutable local image tags
# only after verifying the source manifest and archive checksums.
services:
  tokenkey:
    pull_policy: never
    # Hard container memory cap for the gateway only. App hosts target ≥4C8G
    # (existing 4C16G may remain until replaced; Lighthouse cannot in-place
    # downgrade memory). Caddy / data-plane PG+Redis stay outside this limit.
    #
    # Why a cap at all: GOMEMLIMIT only bounds the Go heap. goroutine stacks,
    # socket buffers, page cache and non-Go allocations live outside it, so an
    # unbounded container can still drive the *host* into the OOM killer (that
    # is what killed tokenkey-green on 2026-11-14). A cgroup cap converts "host
    # dies" into "this container is killed and restarts".
    #
    # Why 3G with GOMEMLIMIT=2GiB: leave ~1 GiB of non-heap headroom (stacks,
    # buffers, allocator fragmentation) inside the cap, and the rest of the
    # 8–16 GiB host for page cache, Caddy, sshd and the docker daemon. Docker's
    # OOM killer acts inside the cgroup, so the Go GC reaches its soft limit
    # (2GiB) first and the process is collected long before the hard cap is hit.
    #
    # memswap_limit == mem_limit disables additional swap for this cgroup: with
    # swap enabled an overloaded gateway thrashes instead of failing fast, and
    # the crash becomes latency for every admitted request.
    #
    # Bump both values together. Raising only the cap moves the OOM boundary
    # without giving the Go heap more room, which makes GC fight the cgroup.
    mem_limit: ${TOKENKEY_APP_MEMORY_LIMIT:-3g}
    memswap_limit: ${TOKENKEY_APP_MEMORY_LIMIT:-3g}
    environment:
      # Match prod capture. Bundle stays retired. Do not upload QA to S3.
      QA_CAPTURE_ENABLED: "true"
      # China-first proxy exit probe chain (ipip → ip9 → qq-ip2city → ipify).
      # Avoids overseas ip-api RTT on cn-prod admin proxy latency. Explicit
      # security.proxy_probe.urls in config.yaml still wins over this preset.
      SECURITY_PROXY_PROBE_PRESET: "domestic"
      # Pool sized for cn-prod dual-app layout (≥4C8G floor as of 2026-11-18).
      # Raise the pool only together with DATABASE_*/REDIS_* limits and
      # data-machine max_connections; GOMEMLIMIT is a Go-heap soft limit, not a
      # cgroup cap — mem_limit above owns the hard boundary.
      GOMEMLIMIT: "2GiB"
      # Process-wide relay concurrency cap (gateway.max_in_flight_requests).
      # Overflow returns 503 + Retry-After instead of queueing, so a traffic
      # spike sheds new work while admitted streams finish. 480 aligns the
      # per-node hard gate with the Recipe-1 soft CPU top (~800 fleet / 1:1),
      # and 0/negative would disable the gate for rollback.
      # Rolling single-container reads this compose as SSOT (M6). A key added
      # here must show up in `docker compose config` / node_compose renders
      # (see SECURITY_PROXY_PROBE_PRESET, 2026-10-23).
      GATEWAY_MAX_IN_FLIGHT_REQUESTS: "480"
      # 2026-11-17 capacity: 400-concurrency pool perf already pinned ~81
      # live PG connections against 40×2 app pools. Raise per-app open to 80
      # before the 800-concurrency run; pair with data-machine max_connections
      # headroom (see docs/ops/reports/cn-prod-deepseek-flash-pool-perf-20261117.md).
      DATABASE_MAX_OPEN_CONNS: "80"
      DATABASE_MAX_IDLE_CONNS: "20"
      REDIS_POOL_SIZE: "96"
      REDIS_MIN_IDLE_CONNS: "8"
      # Data plane endpoints. The default is the same-host name. After the
      # cutover, /opt/tokenkey/.env sets the data machine private IP
      # (design-data-plane-split.md). The password stays on the live container
      # and is inherited, so it is not declared here.
      DATABASE_HOST: "${DATABASE_HOST:-postgres}"
      DATABASE_PORT: "${DATABASE_PORT:-5432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    # Local postgres/redis are on the local-data profile below. depends_on has
    # to be cleared with them: a profiled dependency is undefined in the default
    # project, so `docker compose config` fails. With the dependency gone, a
    # plain `up` starts the gateway only (app-edge Caddy retired; TLS on entry).
    depends_on: !reset {}
  caddy:
    # Retired app-edge: entry terminates TLS. Profile blocks plain `compose up`
    # from resurrecting tokenkey-caddy on application hosts.
    profiles: ["legacy-edge"]
    image: ${CADDY_IMAGE:?Pinned CADDY_IMAGE is required}
    pull_policy: never
    logging:
      options:
        max-size: "20m"
        max-file: "3"
  # Retired local servers. A plain `docker compose up` must not start them:
  # the old primary would archive into the same COS repo as the data machine.
  # Blue/green prepare uses `up --no-deps` and does not enable this profile.
  postgres:
    profiles: ["local-data"]
    image: ${POSTGRES_IMAGE:?Pinned POSTGRES_IMAGE is required}
    pull_policy: never
  redis:
    profiles: ["local-data"]
    image: ${REDIS_IMAGE:?Pinned REDIS_IMAGE is required}
    pull_policy: never
