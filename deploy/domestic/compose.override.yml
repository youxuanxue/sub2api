# Merge with ../aws/stage0/docker-compose.yml. Supply immutable local image tags
# only after verifying the source manifest and archive checksums.
services:
  tokenkey:
    pull_policy: never
    environment:
      QA_CAPTURE_ENABLED: "false"
      TELEMETRY_ARCHIVE_ENABLED: "false"
      # China-first proxy exit probe chain (ipip → ip9 → qq-ip2city → ipify).
      # Avoids overseas ip-api RTT on cn-prod admin proxy latency. Explicit
      # security.proxy_probe.urls in config.yaml still wins over this preset.
      SECURITY_PROXY_PROBE_PRESET: "domestic"
      # Pool sized for cn-prod O 8C/8G (mem unchanged from 4C/8G era).
      GOMEMLIMIT: "2GiB"
      DATABASE_MAX_OPEN_CONNS: "40"
      DATABASE_MAX_IDLE_CONNS: "10"
      REDIS_POOL_SIZE: "96"
      REDIS_MIN_IDLE_CONNS: "8"
    logging:
      options:
        max-size: "20m"
        max-file: "3"
  caddy:
    image: ${CADDY_IMAGE:?Pinned CADDY_IMAGE is required}
    pull_policy: never
    logging:
      options:
        max-size: "20m"
        max-file: "3"
  postgres:
    image: ${POSTGRES_IMAGE:?Pinned POSTGRES_IMAGE is required}
    pull_policy: never
  redis:
    image: ${REDIS_IMAGE:?Pinned REDIS_IMAGE is required}
    pull_policy: never
