# Configuration snapshot for the QA commands. This container is never started;
# it pins the image against pruning and holds an independently deployed config.
services:
  runtime:
    image: ${QA_MAINTENANCE_IMAGE:?QA_MAINTENANCE_IMAGE is required}
    container_name: tokenkey-qa-runtime
    entrypoint: /bin/true
    labels:
      dev.tokenkey.qa-runtime: independent-v1
      dev.tokenkey.release-tag: ${QA_MAINTENANCE_TAG:?QA_MAINTENANCE_TAG is required}
    volumes:
      - /var/lib/tokenkey/app:/app/data
    environment:
      DATA_DIR: /app/data
      TZ: ${TZ:-UTC}
      DATABASE_HOST: tokenkey-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-tokenkey}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: ${POSTGRES_DB:-tokenkey}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: "2"
      DATABASE_MAX_IDLE_CONNS: "1"
      # This template is shared by the HCloud QA maintenance timer despite its
      # historical deploy/aws path. All storage coordinates are mandatory so a
      # missing migration configuration cannot fall back to AWS.
      QA_ARCHIVE_ENABLED: ${QA_ARCHIVE_ENABLED:-true}
      QA_ARCHIVE_STORAGE_DRIVER: ${QA_ARCHIVE_STORAGE_DRIVER:?QA_ARCHIVE_STORAGE_DRIVER is required}
      QA_ARCHIVE_STORAGE_REGION: ${QA_ARCHIVE_STORAGE_REGION:?QA_ARCHIVE_STORAGE_REGION is required}
      QA_ARCHIVE_STORAGE_BUCKET: ${QA_ARCHIVE_STORAGE_BUCKET:?QA_ARCHIVE_STORAGE_BUCKET is required}
      QA_ARCHIVE_STORAGE_ENDPOINT: ${QA_ARCHIVE_STORAGE_ENDPOINT:?QA_ARCHIVE_STORAGE_ENDPOINT is required}
      QA_ARCHIVE_STORAGE_FORCE_PATH_STYLE: ${QA_ARCHIVE_STORAGE_FORCE_PATH_STYLE:-}
      QA_ARCHIVE_STORAGE_CREDENTIALS_FILE: ${QA_ARCHIVE_STORAGE_CREDENTIALS_FILE:?QA_ARCHIVE_STORAGE_CREDENTIALS_FILE is required}
      QA_ARCHIVE_STORAGE_PREFIX: ${QA_ARCHIVE_STORAGE_PREFIX:?QA_ARCHIVE_STORAGE_PREFIX is required}
      QA_ARCHIVE_SEAL_DELAY_MINUTES: ${QA_ARCHIVE_SEAL_DELAY_MINUTES:-15}
    networks:
      - data
networks:
  data:
    external: true
    name: ${QA_RUNTIME_NETWORK:?QA_RUNTIME_NETWORK is required}
