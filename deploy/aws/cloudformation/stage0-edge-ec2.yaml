AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  TokenKey Stage0 EC2 Edge: AL2023 ARM64 t4g.small Unlimited, external EIP,
  retained gp3 data volume, SSM operations, shared bootstrap, and cost/capacity alarms.

# Embedded SSM values and UserData are generated from deploy/aws/stage0 sources.
# Run deploy/aws/stage0/build-cfn.sh after changing a shared source.

Parameters:
  ProjectName:
    Type: String
    Default: tokenkey
    AllowedPattern: '^[a-z0-9-]+$'
  Environment:
    Type: String
    Default: edge
    AllowedPattern: '^[a-z0-9-]+$'
  EdgeId:
    Type: String
    AllowedPattern: '^us[0-9]+$'
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  ApiDomain:
    Type: String
    AllowedPattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
  AcmeEmail:
    Type: String
    AllowedPattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
  AdminEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
  Timezone:
    Type: String
    Default: UTC
    AllowedPattern: '^[A-Za-z0-9_+./-]+$'
  MainGatewayAllowedCidr:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/(3[0-2]|[12]?[0-9])$'
    Description: Main gateway CIDR allowed to use restricted relay paths.

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large]
  RootVolumeSizeGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 200
  DataVolumeSizeGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 500
  DataVolumeIops:
    Type: Number
    Default: 3000
    MinValue: 3000
    MaxValue: 16000
  DataVolumeThroughput:
    Type: Number
    Default: 125
    MinValue: 125
    MaxValue: 1000
  SwapSizeGiB:
    Type: Number
    Default: 2
    AllowedValues: [2]
  AmazonLinux2023Arm64Ami:
    Type: AWS::EC2::Image::Id
    Description: >-
      Required pinned AL2023 ARM64 AMI. The deployment workflow resolves this
      on provision and reuses the stack value on updates to avoid surprise replacement.

  GhcrOwner:
    Type: String
    AllowedPattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38}[A-Za-z0-9])?$'
  GhcrImageName:
    Type: String
    Default: sub2api
    AllowedPattern: '^[a-z0-9]+([._-][a-z0-9]+)*$'
  ImageTag:
    Type: String
    AllowedPattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  GhcrPullUser:
    Type: String
    AllowedPattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38}[A-Za-z0-9])?$'
  GhcrPatSsmName:
    Type: String
    Default: /tokenkey/ghcr/pat
    AllowedPattern: '^/[A-Za-z0-9_./-]+$'
  QaStaleRetentionDays:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 5
  SnapshotSchedule:
    Type: String
    Default: daily
    AllowedValues: [daily, hourly]
  MonthlyBudgetUsd:
    Type: Number
    MinValue: 1
    MaxValue: 500
  AlarmSnsTopicArn:
    Type: String
    Default: ''

  EipAllocationId:
    Type: String
    AllowedPattern: '^eipalloc-[0-9a-f]{8,17}$'
    Description: Externally allocated EIP; the stack only owns its association.
  PublicIpv4:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
    Description: Public address resolved from EipAllocationId by the provisioning workflow.

Conditions:
  IsHourlySnapshots: !Equals [!Ref SnapshotSchedule, hourly]
  AlarmTopicProvided: !Not [!Equals [!Ref AlarmSnsTopicArn, '']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-${EdgeId}-vpc'}
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: EdgeId, Value: !Ref EdgeId}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-${EdgeId}-igw'}
        - {Key: EdgeId, Value: !Ref EdgeId}

  IGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetCidr
      # UserData starts before the separate EIP association resource completes.
      # The transient auto-assigned address provides first-boot egress and is
      # released automatically when the retained external EIP is associated.
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-${EdgeId}-public'}
        - {Key: EdgeId, Value: !Ref EdgeId}
        - {Key: Tier, Value: public}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-${EdgeId}-public-rt'}

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttach
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TokenKey Edge public TLS ports; management uses SSM.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS and ACME TLS-ALPN-01
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: 0.0.0.0/0
          Description: Edge admin API TLS
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-${EdgeId}-sg'}
        - {Key: EdgeId, Value: !Ref EdgeId}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: EdgeBootstrapAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GhcrPatSsmName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/edge/${EdgeId}/stage0/*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
              - Effect: Allow
                Action: ec2:DescribeVolumes
                Resource: '*'
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    'ec2:ResourceTag/Project': !Ref ProjectName
                    'ec2:ResourceTag/EdgeId': !Ref EdgeId
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: EdgeId, Value: !Ref EdgeId}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  TokenkeyStage0ComposeGzipB64Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/docker-compose.gzip.b64'
      Type: String
      Tier: Standard
      # >>> COMPOSE_GZB64_SSM START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> COMPOSE_GZB64_SSM END <<<

  TokenkeyStage0CaddyGzipB64Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/caddyfile.template.gzip.b64'
      Type: String
      Tier: Standard
      # >>> CADDY_GZB64_SSM START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> CADDY_GZB64_SSM END <<<

  TokenkeyQaStaleCleanupScriptB64Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/qa-stale-cleanup.b64'
      Type: String
      Tier: Standard
      # >>> QA_CLEANUP_B64_PARAM START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> QA_CLEANUP_B64_PARAM END <<<

  TokenkeyPgdumpScriptB64Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/pgdump.gzip.b64'
      Type: String
      Tier: Standard
      # >>> PGDUMP_B64_PARAM START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> PGDUMP_B64_PARAM END <<<

  TokenkeyGhcrPruneScriptB64Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/ghcr-prune.b64'
      Type: String
      Tier: Standard
      # >>> GHCR_PRUNE_B64_PARAM START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> GHCR_PRUNE_B64_PARAM END <<<

  TokenkeyGhcrPruneDailyScriptB64Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/ghcr-prune-daily.b64'
      Type: String
      Tier: Standard
      # >>> GHCR_PRUNE_DAILY_B64_PARAM START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> GHCR_PRUNE_DAILY_B64_PARAM END <<<

  TokenkeyStage0BootstrapGzipB64Part1Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/bootstrap.sh.gzip.b64.part1'
      Type: String
      Tier: Standard
      # >>> BOOTSTRAP_GZB64_SSM_PART1 START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> BOOTSTRAP_GZB64_SSM_PART1 END <<<

  TokenkeyStage0BootstrapGzipB64Part2Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/bootstrap.sh.gzip.b64.part2'
      Type: String
      Tier: Standard
      # >>> BOOTSTRAP_GZB64_SSM_PART2 START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> BOOTSTRAP_GZB64_SSM_PART2 END <<<

  TokenkeyStage0BootstrapGzipB64Part3Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/edge/${EdgeId}/stage0/bootstrap.sh.gzip.b64.part3'
      Type: String
      Tier: Standard
      # >>> BOOTSTRAP_GZB64_SSM_PART3 START (regenerated by build-cfn.sh) <<<
      Value: ''
      # >>> BOOTSTRAP_GZB64_SSM_PART3 END <<<

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: !Ref DataVolumeSizeGiB
      VolumeType: gp3
      Iops: !Ref DataVolumeIops
      Throughput: !Ref DataVolumeThroughput
      Encrypted: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-${EdgeId}-data'}
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: EdgeId, Value: !Ref EdgeId}
        - {Key: Backup, Value: !Sub 'stage0-edge-${EdgeId}'}

  Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - IGWAttach
      - DataVolume
      - TokenkeyStage0ComposeGzipB64Parameter
      - TokenkeyStage0CaddyGzipB64Parameter
      - TokenkeyQaStaleCleanupScriptB64Parameter
      - TokenkeyPgdumpScriptB64Parameter
      - TokenkeyGhcrPruneScriptB64Parameter
      - TokenkeyGhcrPruneDailyScriptB64Parameter
      - TokenkeyStage0BootstrapGzipB64Part1Parameter
      - TokenkeyStage0BootstrapGzipB64Part2Parameter
      - TokenkeyStage0BootstrapGzipB64Part3Parameter
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmazonLinux2023Arm64Ami
      CreditSpecification:
        CPUCredits: unlimited
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref AppSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSizeGiB
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-${EdgeId}-app'}
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: EdgeId, Value: !Ref EdgeId}
        - {Key: Backup, Value: !Sub 'stage0-edge-${EdgeId}'}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # >>> USERDATA_LAUNCHER START (regenerated by build-cfn.sh) <<<
          # Thin EC2 UserData launcher — embedded in stage0-single-ec2.yaml via build-cfn.sh.
          # Fn::Sub replaces ${ApiDomain} etc; bash uses ${!TK_*} for runtime expansion.
          set -euxo pipefail
          exec > >(tee -a /var/log/tokenkey-bootstrap.log) 2>&1
          
          export TK_API_DOMAIN='${ApiDomain}'
          export TK_ACME_EMAIL='${AcmeEmail}'
          export TK_ADMIN_EMAIL='${AdminEmail}'
          export TK_TZ='${Timezone}'
          export TK_AWS_REGION='${AWS::Region}'
          export TK_GHCR_OWNER='${GhcrOwner}'
          export TK_GHCR_IMAGE_NAME='${GhcrImageName}'
          export TK_IMAGE_TAG='${ImageTag}'
          export TK_GHCR_PULL_USER='${GhcrPullUser}'
          export TK_GHCR_PAT_SSM_NAME='${GhcrPatSsmName}'
          export TK_DATA_VOLUME_ID='${DataVolume}'
          export TK_PROJECT_NAME='${ProjectName}'
          export TK_ENVIRONMENT='${Environment}'
          export TK_QA_STALE_RETENTION_DAYS='${QaStaleRetentionDays}'
          export TK_TOKENKEY_IMAGE="ghcr.io/${GhcrOwner}/${GhcrImageName}:${ImageTag}"
          export TK_STAGE0_PREFIX='/${ProjectName}/${Environment}/stage0'
          export TK_STAGE0_PREFIX='/${ProjectName}/edge/${EdgeId}/stage0'
          export TK_SWAP_SIZE_GIB='${SwapSizeGiB}'
          export TK_CADDY_PROFILE='edge'
          export TK_MAIN_GATEWAY_ALLOWED_CIDR='${MainGatewayAllowedCidr}'
          
          B64=""
          B64+="$(aws ssm get-parameter --name "${!TK_STAGE0_PREFIX}/bootstrap.sh.gzip.b64.part1" --region "${!TK_AWS_REGION}" --query Parameter.Value --output text)"
          B64+="$(aws ssm get-parameter --name "${!TK_STAGE0_PREFIX}/bootstrap.sh.gzip.b64.part2" --region "${!TK_AWS_REGION}" --query Parameter.Value --output text)"
          B64+="$(aws ssm get-parameter --name "${!TK_STAGE0_PREFIX}/bootstrap.sh.gzip.b64.part3" --region "${!TK_AWS_REGION}" --query Parameter.Value --output text)"
          TMP="$(mktemp)"
          cleanup() { rm -f "${!TMP}"; }
          trap cleanup EXIT
          printf '%s' "${!B64}" | base64 -d | gunzip > "${!TMP}"
          chmod +x "${!TMP}"
          exec bash "${!TMP}"
          # >>> USERDATA_LAUNCHER END <<<

  EIPAssoc:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !Ref EipAllocationId
      InstanceId: !Ref Instance

  DLMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: dlm.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: !Sub '${ProjectName} ${EdgeId} Stage0 EBS snapshot policy'
      State: ENABLED
      ExecutionRoleArn: !GetAtt DLMRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [INSTANCE]
        TargetTags:
          - {Key: Backup, Value: !Sub 'stage0-edge-${EdgeId}'}
        Schedules:
          - Name: !If [IsHourlySnapshots, hourly-7d, daily-7d]
            CopyTags: true
            CreateRule:
              Interval: !If [IsHourlySnapshots, 1, 24]
              IntervalUnit: HOURS
              Times: !If [IsHourlySnapshots, !Ref 'AWS::NoValue', ['03:00']]
            RetainRule:
              Count: !If [IsHourlySnapshots, 168, 7]

  InstanceCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EdgeId}-cpu-24h-above-baseline'
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 86400
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - {Name: InstanceId, Value: !Ref Instance}
      AlarmActions: !If [AlarmTopicProvided, [!Ref AlarmSnsTopicArn], !Ref 'AWS::NoValue']

  CpuSurplusCreditBalanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EdgeId}-cpu-surplus-borrowing'
      Namespace: AWS/EC2
      MetricName: CPUSurplusCreditBalance
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - {Name: InstanceId, Value: !Ref Instance}
      AlarmActions: !If [AlarmTopicProvided, [!Ref AlarmSnsTopicArn], !Ref 'AWS::NoValue']

  CpuSurplusCreditsChargedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EdgeId}-cpu-surplus-charged'
      Namespace: AWS/EC2
      MetricName: CPUSurplusCreditsCharged
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - {Name: InstanceId, Value: !Ref Instance}
      AlarmActions: !If [AlarmTopicProvided, [!Ref AlarmSnsTopicArn], !Ref 'AWS::NoValue']

  RootVolumeDiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EdgeId}-root-volume-used'
      Namespace: tokenkey/EC2
      MetricName: RootVolumeUsedPercent
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - {Name: InstanceId, Value: !Ref Instance}
      AlarmActions: !If [AlarmTopicProvided, [!Ref AlarmSnsTopicArn], !Ref 'AWS::NoValue']

  DataVolumeDiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EdgeId}-data-volume-used'
      Namespace: tokenkey/EC2
      MetricName: DataVolumeUsedPercent
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - {Name: InstanceId, Value: !Ref Instance}
      AlarmActions: !If [AlarmTopicProvided, [!Ref AlarmSnsTopicArn], !Ref 'AWS::NoValue']

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIP:
    Value: !Ref PublicIpv4
  EipAllocationId:
    Value: !Ref EipAllocationId
  ApiUrl:
    Value: !Sub 'https://${ApiDomain}'
  DataVolumeId:
    Value: !Ref DataVolume
  CpuCreditMode:
    Value: unlimited
  InstanceCpuAlarmName:
    Value: !Ref InstanceCpuAlarm
  CpuSurplusCreditBalanceAlarmName:
    Value: !Ref CpuSurplusCreditBalanceAlarm
  CpuSurplusCreditsChargedAlarmName:
    Value: !Ref CpuSurplusCreditsChargedAlarm
  RootVolumeDiskAlarmName:
    Value: !Ref RootVolumeDiskAlarm
  DataVolumeDiskAlarmName:
    Value: !Ref DataVolumeDiskAlarm
  SnapshotPolicyId:
    Value: !Ref SnapshotPolicy
