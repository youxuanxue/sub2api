AWSTemplateFormatVersion: '2010-09-09'
Description: TokenKey physical backup repository; pgBackRest exclusively owns chain expiration.
Parameters:
  BackupRoleArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:role/.+'
    Description: Current production instance role; resolved from the live target before deployment.
Resources:
  Repository:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'tokenkey-prod-physical-backup-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  RestoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadBackupRepository
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: [!Sub '${Repository.Arn}/prod/*', !Sub '${Repository.Arn}/artifacts/*']
  RestoreInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref RestoreRole]
  RepositoryPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Repository
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Repository.Arn, !Sub '${Repository.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: BackupRepositoryObjects
            Effect: Allow
            Principal:
              AWS: !Ref BackupRoleArn
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
            Resource: !Sub '${Repository.Arn}/prod/*'
          - Sid: BackupRuntimeRead
            Effect: Allow
            Principal:
              AWS: !Ref BackupRoleArn
            Action: s3:GetObject
            Resource: !Sub '${Repository.Arn}/artifacts/*'
          - Sid: BackupRepositoryListing
            Effect: Allow
            Principal:
              AWS: !Ref BackupRoleArn
            Action: [s3:ListBucket, s3:GetBucketLocation, s3:ListBucketMultipartUploads]
            Resource: !GetAtt Repository.Arn
Outputs:
  BucketName:
    Value: !Ref Repository
  RestoreInstanceProfile:
    Value: !Ref RestoreInstanceProfile
  RestoreRoleArn:
    Value: !GetAtt RestoreRole.Arn
