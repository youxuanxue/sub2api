AWSTemplateFormatVersion: '2010-09-09'
Description: >
  tokenkey Stage 0 long-term ops archive bucket — standalone stack (does not
  modify the live prod instance stack). Historically held promoted export
  batches under prod/ops-archive/{batch_id}/ and raw telemetry. Live DB backup
  is on Tencent COS (pgBackRest); this AWS bucket is wind-down only with a
  short whole-bucket expiry. Staging remains on tokenkey-stage0-backups.

Parameters:
  ProjectName:
    Type: String
    Default: tokenkey
  Environment:
    Type: String
    Default: prod
  ArchiveExpireDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: >
      Days after upload when ALL objects in this bucket expire permanently
      (wind-down; live archive/backup paths use COS).
  AppInstanceRoleArn:
    Type: String
    Description: >
      IAM role ARN allowed to read/write prod/ops-archive/* and write-only
      prod/raw-telemetry/* (same direct-principal pattern as stage0-backups.yaml).

Resources:
  OpsArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-archive-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: expire-all-30d
            Status: Enabled
            ExpirationInDays: !Ref ArchiveExpireDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  OpsArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OpsArchiveBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt OpsArchiveBucket.Arn
              - !Sub '${OpsArchiveBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          # Wind-down: instance role may read historical objects only. New archive
          # writes go to Tencent COS (design-cos-object-archive); no PutObject here.
          - Sid: DenyAppInstanceRoleReadRawTelemetry
            Effect: Deny
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
            Resource: !Sub '${OpsArchiveBucket.Arn}/${Environment}/raw-telemetry/*'
          - Sid: AllowAppInstanceRoleGetOpsArchive
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
            Resource: !Sub '${OpsArchiveBucket.Arn}/${Environment}/ops-archive/*'
          - Sid: AllowAppInstanceRoleListArchive
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action: 's3:ListBucket'
            Resource: !GetAtt OpsArchiveBucket.Arn
            Condition:
              StringLike:
                's3:prefix':
                  - !Sub '${Environment}/ops-archive/*'

Outputs:
  BucketName:
    Description: Ops archive bucket name
    Value: !Ref OpsArchiveBucket
  ArchiveS3Uri:
    Description: Base S3 URI for promoted ops-archive batches
    Value: !Sub 's3://${OpsArchiveBucket}/${Environment}/ops-archive'
