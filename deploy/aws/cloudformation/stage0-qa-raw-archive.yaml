AWSTemplateFormatVersion: '2010-09-09'
Description: >
  tokenkey Stage 0 standalone QA raw archive bucket (Phase 2). Separate from
  the retained legacy QaExportsBucket and generic data-layer archive. Active
  user list, detail, and ZIP surfaces use QaBundleBucket in this stack.
  Lifecycle owner: docs/approved/design-prod-qa-24h-s3-lifecycle.md section 8.1.

Parameters:
  ProjectName:
    Type: String
    Default: tokenkey
  Environment:
    Type: String
    Default: prod
  RawRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30
    Description: Days to keep committed raw/v1/ shard objects.
  PartialRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 7
    Description: Days to keep incomplete raw/partial/ shard objects.
  AppInstanceRoleArn:
    Type: String
    Description: >
      Prod app instance role allowed to write raw archive shards (PutObject/HeadObject
      on raw/ prefixes). Same direct-role-ARN pattern as stage0-backups.yaml.
  OpsRecoveryPrincipalArn:
    Type: String
    MinLength: 20
    AllowedPattern: '^arn:[a-z0-9-]+:iam::[0-9]{12}:(user|role)/.+$'
    Description: IAM principal allowed to assume the dedicated read-only QA recovery role.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Prod Stage0 VPC that receives the S3 Gateway endpoint.
  RouteTableIds:
    Type: CommaDelimitedList
    Description: Prod route table IDs attached to the S3 Gateway endpoint.
  AuditLogPrefix:
    Type: String
    Default: qa-raw-archive
    AllowedPattern: '^[A-Za-z0-9!_.*()/=-]+$'
    Description: Prefix in the dedicated audit bucket for this trail.
  BundleRetentionDays:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 7
    Description: Days to retain short-lived user QA Bundle job surfaces.
  BundleBrowserAllowedOrigin:
    Type: String
    AllowedPattern: '^https://[A-Za-z0-9][A-Za-z0-9.-]*(?::[0-9]{1,5})?$'
    Description: Exact HTTPS browser origin allowed to GET/HEAD presigned QA Bundle objects.
  BundleWorkerImage:
    Type: String
    Description: Immutable public GHCR release tag or sha256 digest containing the worker command.
  BundleWorkerPublicSubnetIds:
    Type: CommaDelimitedList
    Description: Public subnet IDs in the supplied Stage0 VPC for the outbound-only Fargate worker.
  BundleWorkerDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Active worker count required before the prod Bundle user path is enabled.

Resources:
  QaRawArchiveRecoveryRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Audited read-only recovery access to the prod QA raw archive.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref OpsRecoveryPrincipalArn
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: qa-raw-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListRawPrefix
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}'
                Condition:
                  StringLike:
                    's3:prefix':
                      - raw
                      - raw/*
              - Sid: ReadRawObjects
                Effect: Allow
                Action: 's3:GetObject'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}/raw/*'
  QaRawArchiveKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: SSE-KMS key for tokenkey prod QA raw archive bucket
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowAppInstanceRoleUseViaS3
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
              StringLike:
                kms:EncryptionContext:aws:s3:arn:
                  # Bucket Key uses the bucket ARN; object writes may use object ARNs.
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}/raw/v1/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}/raw/partial/*'
          - Sid: AllowOpsRecoveryRoleReadViaS3
            Effect: Allow
            Principal:
              AWS: !GetAtt QaRawArchiveRecoveryRole.Arn
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
              StringLike:
                kms:EncryptionContext:aws:s3:arn:
                  # S3 Bucket Key may use the bucket ARN instead of the object ARN.
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}/raw/*'

  QaRawArchiveKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Environment}-qa-raw-archive'
      TargetKeyId: !Ref QaRawArchiveKey

  QaRawArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-qa-raw-archive-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt QaRawArchiveKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-v1-shards
            Status: Enabled
            Prefix: raw/v1/
            ExpirationInDays: !Ref RawRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: expire-raw-partial-shards
            Status: Enabled
            Prefix: raw/partial/
            ExpirationInDays: !Ref PartialRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  QaRawArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref QaRawArchiveBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt QaRawArchiveBucket.Arn
              - !Sub '${QaRawArchiveBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: DenyLightsailEdgeRole
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt QaRawArchiveBucket.Arn
              - !Sub '${QaRawArchiveBucket.Arn}/*'
            Condition:
              ArnLike:
                'aws:PrincipalArn':
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tokenkey-lightsail-ssm-hybrid'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tokenkey-lightsail-ssm-hybrid-*'
          - Sid: AllowAppInstanceRoleWriteRaw
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action:
              - 's3:PutObject'
              - 's3:AbortMultipartUpload'
              - 's3:ListMultipartUploadParts'
            Resource:
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/commit.json'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/manifest.json'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/records.parquet'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/evidence.pack'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/evidence-index.jsonl.zst'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/orphan-evidence-index.jsonl.zst'
          - Sid: AllowAppInstanceRoleVerifyRaw
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action: 's3:GetObject'
            Resource:
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/commit.json'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/manifest.json'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/records.parquet'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/evidence.pack'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/evidence-index.jsonl.zst'
              - !Sub '${QaRawArchiveBucket.Arn}/raw/v1/date=*/hour=*/segments/*/orphan-evidence-index.jsonl.zst'
          - Sid: AllowOpsRecoveryRoleReadRaw
            Effect: Allow
            Principal:
              AWS: !GetAtt QaRawArchiveRecoveryRole.Arn
            Action: 's3:GetObject'
            Resource: !Sub '${QaRawArchiveBucket.Arn}/raw/*'
          - Sid: AllowOpsRecoveryRoleListRawPrefix
            Effect: Allow
            Principal:
              AWS: !GetAtt QaRawArchiveRecoveryRole.Arn
            Action: 's3:ListBucket'
            Resource: !GetAtt QaRawArchiveBucket.Arn
            Condition:
              StringLike:
                's3:prefix':
                  - raw
                  - raw/*

  QaRawArchiveAuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-qa-raw-audit-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: expire-qa-raw-audit
            Status: Enabled
            ExpirationInDays: 400
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  QaRawArchiveAuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref QaRawArchiveAuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt QaRawArchiveAuditBucket.Arn
              - !Sub '${QaRawArchiveAuditBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: AllowCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:GetBucketAcl'
            Resource: !GetAtt QaRawArchiveAuditBucket.Arn
            Condition:
              StringEquals:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${Environment}-qa-raw-data-events'
          - Sid: AllowCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${QaRawArchiveAuditBucket.Arn}/${AuditLogPrefix}/${AWS::AccountId}/${AWS::Region}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${Environment}-qa-raw-data-events'

  QaRawArchiveS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      RouteTableIds: !Ref RouteTableIds
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      # This route table is shared by backup/media/telemetry. Dataset-specific
      # least privilege remains at each bucket/KMS policy boundary.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PreserveSharedStage0S3Access
            Effect: Allow
            Principal: '*'
            Action: 's3:*'
            Resource: '*'

  QaRawArchiveDataTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - QaRawArchiveBucketPolicy
      - QaRawArchiveAuditBucketPolicy
    Properties:
      TrailName: !Sub '${ProjectName}-${Environment}-qa-raw-data-events'
      S3BucketName: !Ref QaRawArchiveAuditBucket
      S3KeyPrefix: !Sub '${AuditLogPrefix}/${AWS::AccountId}/${AWS::Region}'
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: false
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: false
          DataResources:
            - Type: AWS::S3::Object
              Values:
                - !Sub '${QaRawArchiveBucket.Arn}/raw/'

  QaBundleBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-qa-bundles-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref BundleBrowserAllowedOrigin
            ExposedHeaders:
              - ETag
              - Content-Encoding
              - Content-Length
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: expire-qa-bundle-job-surfaces
            Status: Enabled
            Prefix: user-qa/qa-bundles/v1/jobs/
            ExpirationInDays: !Ref BundleRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  QaBundleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref QaBundleBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt QaBundleBucket.Arn
              - !Sub '${QaBundleBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: DenyLightsailEdgeRole
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt QaBundleBucket.Arn
              - !Sub '${QaBundleBucket.Arn}/*'
            Condition:
              ArnLike:
                'aws:PrincipalArn':
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tokenkey-lightsail-ssm-hybrid'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tokenkey-lightsail-ssm-hybrid-*'
          - Sid: AllowAppInstanceRoleCreateScopedBundleJobs
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action: 's3:PutObject'
            Resource: !Sub '${QaBundleBucket.Arn}/user-qa/qa-bundles/v1/jobs/*/spec.json'
          - Sid: AllowAppInstanceRoleReadScopedBundleArtifacts
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action: 's3:GetObject'
            Resource:
              - !Sub '${QaBundleBucket.Arn}/user-qa/qa-bundles/v1/jobs/*/spec.json'
              - !Sub '${QaBundleBucket.Arn}/user-qa/qa-bundles/v1/jobs/*/receipt.json'
              - !Sub '${QaBundleBucket.Arn}/user-qa/qa-bundles/v1/jobs/*/failure.json'
              - !Sub '${QaBundleBucket.Arn}/user-qa/qa-bundles/v1/jobs/*/generation/manifest.json'
              - !Sub '${QaBundleBucket.Arn}/user-qa/qa-bundles/v1/jobs/*/generation/pages/*.json.gz'
              - !Sub '${QaBundleBucket.Arn}/user-qa/qa-bundles/v1/jobs/*/export.zip'
          - Sid: AllowAppInstanceRoleListScopedBundleJobs
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action: 's3:ListBucket'
            Resource: !GetAtt QaBundleBucket.Arn
            Condition:
              StringLike:
                's3:prefix':
                  - user-qa/qa-bundles/v1/jobs/*

  QaBundleDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-qa-bundle-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  QaBundleQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-qa-bundle'
      VisibilityTimeout: 3600
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt QaBundleDeadLetterQueue.Arn
        maxReceiveCount: 3

  QaBundleQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref QaBundleQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAppInstanceRoleSendBundleJobs
            Effect: Allow
            Principal:
              AWS: !Ref AppInstanceRoleArn
            Action: 'sqs:SendMessage'
            Resource: !GetAtt QaBundleQueue.Arn

  QaBundleWorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  QaBundleWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: qa-bundle-worker-surfaces
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawArchive
                Effect: Allow
                Action: 's3:GetObject'
                Resource: !Sub '${QaRawArchiveBucket.Arn}/raw/v1/*'
              - Sid: DecryptRawArchive
                Effect: Allow
                Action: 'kms:Decrypt'
                Resource: !GetAtt QaRawArchiveKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
              - Sid: WriteBundleJobSurface
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource: !Sub '${QaBundleBucket.Arn}/user-qa/qa-bundles/v1/jobs/*'
              - Sid: ListBundleJobSurface
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !GetAtt QaBundleBucket.Arn
                Condition:
                  StringLike:
                    's3:prefix':
                      - user-qa/qa-bundles/v1/jobs/*
              - Sid: ConsumeBundleQueue
                Effect: Allow
                Action:
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                  - 'sqs:ReceiveMessage'
                Resource: !GetAtt QaBundleQueue.Arn

  QaBundleWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/tokenkey/${ProjectName}-${Environment}/qa-bundle-worker'
      RetentionInDays: 14

  QaBundleWorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only network boundary for the QA Bundle Fargate worker.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  QaBundleWorkerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${Environment}-qa-bundle'

  QaBundleWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-qa-bundle-worker'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt QaBundleWorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt QaBundleWorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: qa-bundle-worker
          Image: !Ref BundleWorkerImage
          Command:
            - --qa-bundle-worker
          Essential: true
          Environment:
            - Name: QA_BUNDLE_ENABLED
              Value: 'true'
            - Name: QA_BUNDLE_QUEUE_URL
              Value: !Ref QaBundleQueue
            - Name: QA_BUNDLE_STORAGE_DRIVER
              Value: s3
            - Name: QA_BUNDLE_STORAGE_REGION
              Value: !Ref AWS::Region
            - Name: QA_BUNDLE_STORAGE_BUCKET
              Value: !Ref QaBundleBucket
            - Name: QA_BUNDLE_STORAGE_PREFIX
              Value: user-qa
            - Name: QA_ARCHIVE_ENABLED
              Value: 'true'
            - Name: QA_ARCHIVE_STORAGE_DRIVER
              Value: s3
            - Name: QA_ARCHIVE_STORAGE_REGION
              Value: !Ref AWS::Region
            - Name: QA_ARCHIVE_STORAGE_BUCKET
              Value: !Ref QaRawArchiveBucket
            - Name: QA_ARCHIVE_STORAGE_PREFIX
              Value: raw/v1
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref QaBundleWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  QaBundleWorkerService:
    Type: AWS::ECS::Service
    DependsOn: QaBundleQueuePolicy
    Properties:
      ServiceName: !Sub '${ProjectName}-${Environment}-qa-bundle-worker'
      Cluster: !Ref QaBundleWorkerCluster
      TaskDefinition: !Ref QaBundleWorkerTaskDefinition
      DesiredCount: !Ref BundleWorkerDesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: false
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref BundleWorkerPublicSubnetIds
          SecurityGroups:
            - !GetAtt QaBundleWorkerSecurityGroup.GroupId

Outputs:
  QaRawArchiveBucketName:
    Description: Prod QA raw archive bucket (7d committed / 1d partial lifecycle)
    Value: !Ref QaRawArchiveBucket
  QaRawArchiveBucketArn:
    Value: !GetAtt QaRawArchiveBucket.Arn
  QaRawArchiveKmsKeyArn:
    Value: !GetAtt QaRawArchiveKey.Arn
  QaRawArchiveS3Uri:
    Value: !Sub 's3://${QaRawArchiveBucket}/raw/v1/'
  QaRawArchiveRecoveryRoleArn:
    Value: !GetAtt QaRawArchiveRecoveryRole.Arn
  QaRawArchiveAuditBucketName:
    Value: !Ref QaRawArchiveAuditBucket
  QaRawArchiveS3EndpointId:
    Value: !Ref QaRawArchiveS3Endpoint
  QaRawArchiveDataTrailArn:
    Value: !GetAtt QaRawArchiveDataTrail.Arn
  QaBundleBucketName:
    Description: Private short-lifecycle user QA Bundle bucket.
    Value: !Ref QaBundleBucket
  QaBundleQueueUrl:
    Description: QA Bundle worker SQS queue URL.
    Value: !Ref QaBundleQueue
  QaBundleDeadLetterQueueUrl:
    Description: QA Bundle worker dead-letter queue URL.
    Value: !Ref QaBundleDeadLetterQueue
  QaBundleWorkerClusterName:
    Description: QA Bundle worker ECS cluster name.
    Value: !Ref QaBundleWorkerCluster
  QaBundleWorkerServiceName:
    Description: Active QA Bundle Fargate worker service.
    Value: !GetAtt QaBundleWorkerService.Name
  QaBundleWorkerTaskDefinitionArn:
    Description: QA Bundle worker task definition selected by the service.
    Value: !Ref QaBundleWorkerTaskDefinition
