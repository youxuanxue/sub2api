AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Optional addon for TokenKey Edge Lightsail automation. Owns the GitHub Actions
  OIDC policy, a transition-only shared SSM Hybrid role, and one least-privilege
  SSM Hybrid role per deployable Edge. Deploy once per account; does not modify
  prod EC2 Edge stacks.

Parameters:
  GitHubOidcRoleNames:
    Type: CommaDelimitedList
    Default: "tokenkey-gha-us-east-1-error-clustering,tokenkey-gha-eu-west-2-error-clustering"
    Description: >-
      Comma-delimited list of existing GHA OIDC role names from
      tokenkey-cicd-oidc stack. The Lightsail addon policy is attached to
      ALL listed roles (AWS::IAM::Policy.Roles accepts a list). Default
      covers both region-scoped OIDC roles currently in use; extend the
      list when adding new region-scoped OIDC roles in the future.

Resources:
  # Transition-only role for already-registered managed instances. Data access
  # deliberately lives only on the per-Edge roles below.
  LightsailSsmHybridRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tokenkey-lightsail-ssm-hybrid
      Description: >-
        Assumed by SSM Hybrid managed instances created from Lightsail Edge
        provisioning. Trust policy is the canonical ssm.amazonaws.com form.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  LightsailSsmHybridRoleUs3:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tokenkey-lightsail-ssm-hybrid-us3
      Description: SSM Hybrid role isolated to TokenKey Edge us3 recovery data.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EdgeRecoveryData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadWriteOwnEnvSecrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/tokenkey/edge/us3/stage0/env-secrets-backup"
              - Sid: ReadWriteOwnPgdumpObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::tokenkey-prod-pgdump-${AWS::AccountId}/edge/us3/pgdump/*"
              - Sid: ListOwnPgdumpPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::tokenkey-prod-pgdump-${AWS::AccountId}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - edge/us3/pgdump
                      - edge/us3/pgdump/*

  LightsailSsmHybridRoleUs4:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tokenkey-lightsail-ssm-hybrid-us4
      Description: SSM Hybrid role isolated to TokenKey Edge us4 recovery data.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EdgeRecoveryData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadWriteOwnEnvSecrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/tokenkey/edge/us4/stage0/env-secrets-backup"
              - Sid: ReadWriteOwnPgdumpObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::tokenkey-prod-pgdump-${AWS::AccountId}/edge/us4/pgdump/*"
              - Sid: ListOwnPgdumpPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::tokenkey-prod-pgdump-${AWS::AccountId}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - edge/us4/pgdump
                      - edge/us4/pgdump/*

  LightsailSsmHybridRoleUs5:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tokenkey-lightsail-ssm-hybrid-us5
      Description: SSM Hybrid role isolated to TokenKey Edge us5 recovery data.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EdgeRecoveryData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadWriteOwnEnvSecrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/tokenkey/edge/us5/stage0/env-secrets-backup"
              - Sid: ReadWriteOwnPgdumpObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::tokenkey-prod-pgdump-${AWS::AccountId}/edge/us5/pgdump/*"
              - Sid: ListOwnPgdumpPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::tokenkey-prod-pgdump-${AWS::AccountId}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - edge/us5/pgdump
                      - edge/us5/pgdump/*

  LightsailSsmHybridRoleUs6:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tokenkey-lightsail-ssm-hybrid-us6
      Description: SSM Hybrid role isolated to TokenKey Edge us6 recovery data.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EdgeRecoveryData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadWriteOwnEnvSecrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/tokenkey/edge/us6/stage0/env-secrets-backup"
              - Sid: ReadWriteOwnPgdumpObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::tokenkey-prod-pgdump-${AWS::AccountId}/edge/us6/pgdump/*"
              - Sid: ListOwnPgdumpPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::tokenkey-prod-pgdump-${AWS::AccountId}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - edge/us6/pgdump
                      - edge/us6/pgdump/*

  LightsailEdgeAddonPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: tokenkey-lightsail-edge-addon
      Roles: !Ref GitHubOidcRoleNames
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LightsailEdgeProvision
            Effect: Allow
            Action:
              - lightsail:GetInstance
              - lightsail:GetInstances
              - lightsail:CreateInstances
              - lightsail:DeleteInstance
              - lightsail:StopInstance
              - lightsail:StartInstance
              - lightsail:GetStaticIp
              - lightsail:GetStaticIps
              - lightsail:AllocateStaticIp
              - lightsail:ReleaseStaticIp
              - lightsail:AttachStaticIp
              - lightsail:DetachStaticIp
              - lightsail:GetBlueprints
              - lightsail:GetBundles
              - lightsail:GetRegions
              # Caddy/Let's Encrypt inbound; omitting firewall rules yields public HTTPS timeouts (DNS resolves, TCP never completes).
              # PutInstancePublicPorts declares the COMPLETE firewall set (replace semantics) to
              # enforce the hardened 443-only baseline — opens 443 and closes the Lightsail-default
              # public SSH 22 and 80 in one call. GetInstancePortStates is the read-back check.
              - lightsail:GetInstancePortStates
              - lightsail:PutInstancePublicPorts
            Resource: "*"
          - Sid: SsmHybridActivation
            Effect: Allow
            Action:
              - ssm:CreateActivation
              - ssm:DeleteActivation
              - ssm:DescribeActivations
              # AddTagsToResource / RemoveTagsFromResource / ListTagsForResource
              # are required because `aws ssm create-activation --tags ...` does
              # an inline AddTagsToResource call on the activation (and AWS's
              # reverse-mapping reports the IAM role as the resource). Without
              # these, create-activation fails with AccessDeniedException on
              # ssm:AddTagsToResource even though the rest is permitted.
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
              - ssm:ListTagsForResource
            Resource: "*"
          - Sid: PassSsmHybridRoleToActivation
            # create-activation embeds the IAM role into the activation; AWS
            # requires the caller to have iam:PassRole on that role.
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tokenkey-lightsail-ssm-hybrid-*"
            Condition:
              StringEquals:
                iam:PassedToService: ssm.amazonaws.com
          - Sid: SsmManagedInstanceCommand
            Effect: Allow
            Action:
              - ssm:SendCommand
              - ssm:UpdateManagedInstanceRole
              # DeregisterManagedInstance: recreate provisioning deletes the old
              # Lightsail instance but its SSM managed-instance (mi-*) registration
              # lingers Online and stays tagged EdgeId=<id>; the next provision's
              # mi-* resolution can then pick the stale zombie. Allow the workflow
              # to deregister stale mi-* on recreate so resolution is unambiguous.
              - ssm:DeregisterManagedInstance
            Resource:
              - !Sub "arn:aws:ssm:*:${AWS::AccountId}:managed-instance/*"
              - !Sub "arn:aws:ssm:*::document/AWS-RunShellScript"
          - Sid: SsmLightsailStateParams
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:PutParameter
              - ssm:DeleteParameter
            Resource:
              - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/tokenkey/lightsail/*"
              - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/tokenkey/edge/*/ghcr/pat"
          - Sid: SsmDescribeManagedInstances
            Effect: Allow
            Action:
              - ssm:DescribeInstanceInformation
            Resource: "*"

Outputs:
  SsmHybridRoleName:
    Description: Transition-only shared role name; new activations use the per-Edge role prefix.
    Value: !Ref LightsailSsmHybridRole
  SsmHybridRolePrefix:
    Description: Prefix for per-Edge SSM Hybrid managed-instance roles.
    Value: tokenkey-lightsail-ssm-hybrid-
