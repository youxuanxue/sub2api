[high_risk_paths]
^migrations?/
^db/migrations?/
^backend/migrations?/
^schema/
^ops/observability/(probe-data-layer-capacity(-prototype)?\.sh|data_layer_capacity_(projection|verdict_prototype)\.py)$
^ops/stage0/(cfn_datavolume_changeset_guard\.py|cfn_datavolume_parameter_plan\.py|reconcile-cfn-datavolume-no-replace\.sh)$

[anchor_paths]
^docs/approved/.*\.md$

[anchor_tokens]
high[-_ ]risk[-_ ]anchor
approved[-_ ]anchor
upstream[-_ ]merge

# Paths dev-rules' auto-merge-low-risk must never merge on its own: a push to
# main that touches them publishes (gemini-web-worker.yml: image to ghcr.io;
# pricing-registry-publish.yml: pricing to prod). The preflight gate
# scripts/checks/auto-merge-protected-paths.py fails when a publishing
# workflow's push.paths is not covered here.
[auto_merge_protected_paths]
^ops/gemini-web/
^ops/stage0/[^/]*probe_account_model
^backend/internal/service/tk_pricing_overlay\.json$
