# GitHub Actions runs golangci-lint ./... in its own job, so preflight there
# must not repeat it. Locally the wrapper starts make lint-changed before this
# template and joins it at the end (PREFLIGHT_LINT_DEFERRED=1). A direct
# template run, with that flag unset, still lints changed packages itself.
# ./scripts/preflight.sh --full sets PREFLIGHT_FULL_LINT=1 and lints the module.
if [ "${GITHUB_ACTIONS:-}" = "true" ] || [ "${PREFLIGHT_BACKEND_LINT:-1}" = "0" ] || [ "${PREFLIGHT_LINT_DEFERRED:-}" = "1" ]; then :; else cd backend && make lint-changed; fi
