name: Stage0 Container Log Policy Sync

# Transport: Tencent TAT via run-probe (2026-11-18 closeout).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        type: choice
        options: [prod]
      confirm:
        description: "Type recreate-caddy-for-bounded-logs"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ops-stage0-container-log-policy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  prod:
    runs-on: ubuntu-latest
    environment: tencent-ops
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tccli
        run: python3 -m pip install 'tccli==3.1.198.1'
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "recreate-caddy-for-bounded-logs" ] || {
            echo "::error::confirmation mismatch"
            exit 1
          }
      - name: Require Tencent TAT credentials
        run: |
          for key in TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured"
              exit 1
            fi
          done
      - name: Sync bounded log policy and recreate Caddy (TAT)
        run: |
          set -euo pipefail
          chmod +x ops/stage0/probe-sync-container-log-policy.sh
          bash ops/observability/run-probe.sh \
            --target prod \
            --node app-old \
            --via tat \
            --script ops/stage0/probe-sync-container-log-policy.sh \
            --with deploy/stage0/docker-compose.yml \
            --comment "bounded Docker logs; Caddy-only recreate" \
            --timeout-seconds 300
      - name: Verify external health
        run: bash ops/stage0/external_health.sh https://api.tokenkey.dev
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Stage0 container log policy"
            echo "- target: prod"
            echo "- channel: tat (tencent-ops)"
            echo "- mutation: canonical compose sync + Caddy-only recreate"
            echo "- untouched: active app, PostgreSQL, Redis"
          } >> "$GITHUB_STEP_SUMMARY"
