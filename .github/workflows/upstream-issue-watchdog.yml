name: Upstream Issue Watchdog

on:
  schedule:
    - cron: '20 21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/upstream/*watchdog*.py'
      - 'scripts/upstream/issue-triage-generate.py'
      - 'scripts/anthropic/cc-issue-triage-generate.py'
      - '.cache/upstream/fact-checks.json'
      - '.cache/anthropic/cc-fact-checks.json'
      - '.github/workflows/upstream-issue-watchdog.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Scan both sources, or scan and fix one selected source
        default: scan
        type: choice
        options: [scan, fix]
      source:
        description: Source for the optional explicit issue and fix
        default: upstream
        type: choice
        options: [upstream, anthropic]
      upstream_issue:
        description: Optional issue number to investigate, including closed upstream issues
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: upstream-issue-watchdog
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [upstream, anthropic]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Check token
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
        run: test -n "$GH_TOKEN"

      - uses: actions/cache/restore@v6
        with:
          path: .cache/watchdog-state
          key: issue-watchdog-v1-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: issue-watchdog-v1-${{ matrix.source }}-

      - name: Scan and update changed tracking issues
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
          WATCHDOG_SOURCE: ${{ matrix.source }}
          FORCE_ISSUE: ${{ inputs.source == matrix.source && inputs.upstream_issue || '' }}
        run: |
          python3 scripts/upstream/watchdog-run.py scan \
            --source "$WATCHDOG_SOURCE" --upstream-issue "$FORCE_ISSUE" \
            --sync-repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue-watchdog-${{ matrix.source }}-${{ github.run_attempt }}
          path: .cache/issue-watchdog/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      # A failed scan or GitHub update must not advance the persisted cursor.
      - uses: actions/cache/save@v6
        with:
          path: .cache/watchdog-state
          key: issue-watchdog-v1-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}

  fix:
    needs: scan
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fix'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      WATCHDOG_SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: issue-watchdog-${{ inputs.source }}-${{ github.run_attempt }}
          path: .cache/issue-watchdog

      - name: Prepare selected fix
        run: python3 scripts/upstream/watchdog-run.py prepare-fix --source "$WATCHDOG_SOURCE"

      - name: Check agent credentials
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
        run: |
          test -n "$ANTHROPIC_AUTH_TOKEN"
          test -n "$GH_TOKEN"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "tk-issue-fix-agent[bot]"
          git config user.email "issue-fix-agent@tokenkey.dev"

      - uses: ./.github/actions/cache-and-checkout-new-api
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - uses: ./.github/actions/run-headless-agent
        with:
          prompt_file: .cache/issue-watchdog/fix-prompt.txt
          model: "claude-sonnet-4-6"
          max_budget_usd: "20.00"
          allowed_tools: "Bash Read Write Edit Grep Glob"
          auth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          gh_token: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
          output_file: /tmp/issue-fix-agent-output.txt

      - name: Verify fix PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
        run: |
          python3 scripts/upstream/watchdog-run.py verify-fix \
            --source "$WATCHDOG_SOURCE" --sync-repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue-fix-output-${{ inputs.source }}-${{ github.run_attempt }}
          path: /tmp/issue-fix-agent-output.txt
          if-no-files-found: warn
