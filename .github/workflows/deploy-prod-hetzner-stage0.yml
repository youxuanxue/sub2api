name: Prod Hetzner Stage0 (retired)

# Hetzner Cloud prod was decommissioned. Live prod is Tencent USW.
# This workflow only asserts the retired matrix / bootstrap contracts stay
# fail-closed. Provision / paid ignition paths are hard-disabled.

run-name: "prod-hz RETIRED op=${{ inputs.operation || 'validate' }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "validate = retired-contract tests only; provision is rejected"
        required: true
        type: choice
        options: [validate, provision]
      confirm_instance:
        description: "Ignored — Hetzner prod is retired"
        required: false
        type: string
        default: "tokenkey-prod-hz-cax21"
  pull_request:
    paths:
      - "deploy/hetzner/**"
      - ".github/workflows/deploy-prod-hetzner-stage0.yml"
      - "docs/approved/hetzner-cloud-full-migration.md"

concurrency:
  group: deploy-prod-hetzner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-retired:
    if: github.event_name == 'pull_request' || inputs.operation == 'validate' || inputs.operation == 'provision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retired matrix + bootstrap contracts
        run: |
          set -euo pipefail
          python3 -m unittest deploy/hetzner/test_resolve_prod_hetzner_target.py -v
          python3 -m unittest deploy/hetzner/test_render_prod_bootstrap.py -v
          bash deploy/hetzner/render-prod-bootstrap.sh --check
          # Resolver must refuse retired identity even with --allow-planned.
          if python3 deploy/hetzner/resolve-prod-hetzner-target.py \
              --confirm-instance tokenkey-prod-hz-cax21 --allow-planned; then
            echo "::error::retired Hetzner resolver must fail closed"
            exit 1
          fi

  reject-provision:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'provision'
    needs: validate-retired
    runs-on: ubuntu-latest
    steps:
      - name: Hetzner Cloud prod is retired
        run: |
          echo "::error::Hetzner Cloud prod is retired. Live prod is Tencent USW — see deploy/hetzner/README.md (fleet SSOT; historical path name)."
          exit 1
