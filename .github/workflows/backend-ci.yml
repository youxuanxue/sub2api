name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/cmd/server/VERSION'
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Which CI suite to run
        required: false
        default: ci
        type: choice
        options:
          - all
          - ci
          - security
          - weekly-smoke
      ssot_base:
        description: Optional git ref/SHA for manual SSOT delta offline gate
        required: false
        type: string
  schedule:
    - cron: '0 3 * * 1'
    - cron: '17 9 * * TUE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      deploy: ${{ steps.classify.outputs.deploy }}
      ops: ${{ steps.classify.outputs.ops }}
      contracts: ${{ steps.classify.outputs.contracts }}
      preflight_go: ${{ steps.classify.outputs.preflight_go }}
      all: ${{ steps.classify.outputs.all }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 64
      - name: Classify changed surfaces
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/ci/changed-surfaces.py --all --github-output "$GITHUB_OUTPUT" </dev/null
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              python3 scripts/ci/changed-surfaces.py --all --github-output "$GITHUB_OUTPUT" </dev/null
            else
              git fetch --no-tags origin "$BEFORE_SHA" --depth=64
              git diff --name-only -z "$BEFORE_SHA" HEAD |
                python3 scripts/ci/changed-surfaces.py --null --github-output "$GITHUB_OUTPUT"
            fi
          else
            git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" --depth=64
            git diff --name-only -z "origin/${BASE_REF}...HEAD" |
              python3 scripts/ci/changed-surfaces.py --null --github-output "$GITHUB_OUTPUT"
          fi

  shell:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  preflight:
    needs: changes
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'ci')))
    # Mechanical gate for process / quality rules from dev-rules submodule.
    # See CLAUDE.md § 10 and dev-rules/rules/dev-rules-convention.mdc.
    runs-on: ubuntu-latest
    env:
      # Preflight only executes generators, contracts, and tests; failure stacks
      # retain file:line data without storing DWARF in the rolling Go cache.
      GOFLAGS: -gcflags=all=-dwarf=false
    steps:
      - name: Require changed-surface classification
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v6
        with:
          fetch-depth: 64
          submodules: recursive
      - name: CI orchestration contract tests
        run: |
          python3 -m unittest \
            scripts.test_preflight_ci_lint_skip \
            scripts.checks.test_cache_action_runtime \
            scripts.checks.test_docker_action_runtime \
            scripts.checks.test_release_cache_key_parity \
            scripts.checks.test_go_rolling_cache_policy \
            scripts.checks.test_model_surface_bundle_check \
            scripts.test_preflight_ci_handoffs \
            scripts.test_preflight_background_output \
            scripts.test_ci_gate_handoffs \
            scripts.ci.test_changed_surfaces \
            scripts.test_backend_ci_routing
      # Go-backed preflight contracts use backend/go.mod and its ../../new-api
      # replacement. Neutral changes skip this whole bootstrap path.
      - uses: ./.github/actions/cache-and-checkout-new-api
        if: needs.changes.outputs.preflight_go == 'true'
      - name: Fetch base ref for diff gates
        # fetch-depth alone does not guarantee origin/main on PR checkouts; preflight
        # deleted-file / merge-base gates need origin/main...HEAD.
        run: git fetch --no-tags origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}" --depth=64
      - uses: actions/setup-go@v6
        if: needs.changes.outputs.preflight_go == 'true'
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - uses: ./.github/actions/go-rolling-cache
        if: needs.changes.outputs.preflight_go == 'true'
        with:
          prefix: preflight-nodwarf-v1
      - name: Unit runner contract tests
        if: needs.changes.outputs.preflight_go == 'true'
        run: python3 -m unittest scripts.ci.test_unit_test_runner
      - name: Integration package discovery contract tests
        if: needs.changes.outputs.preflight_go == 'true'
        run: python3 -m unittest scripts.ci.test_integration_packages
      - name: Run preflight
        env:
          PREFLIGHT_FAST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          # The CI test-unit job runs the same prompt-surface fixture gateway.
          # Keep local/full preflight strict, but avoid re-running that slow Go
          # fixture inside the CI preflight job on main pushes.
          PREFLIGHT_SKIP_PROMPT_FIXTURE_GATEWAY: "1"
          # Keep the required preflight check authoritative: skip slow contracts
          # only when the changed-surface classifier proves they are unrelated.
          PREFLIGHT_SKIP_SLOW_OPS_CONTRACTS: ${{ needs.changes.outputs.all != 'true' && needs.changes.outputs.ops != 'true' && '1' || '0' }}
          PREFLIGHT_SKIP_MAIN_ANCESTRY: "1"
          PREFLIGHT_SKIP_AGENT_CONTRACT: ${{ needs.changes.outputs.all != 'true' && needs.changes.outputs.contracts != 'true' && '1' || '0' }}
          PREFLIGHT_SKIP_GO_CONTRACTS: ${{ needs.changes.outputs.preflight_go != 'true' && '1' || '0' }}
          # Backend/all runs already compile the service-backed Go owners in
          # test-unit. Move both generated-artifact drift checks together so
          # their shared cold compile cannot simply fall through to the next
          # preflight check. Artifact-only changes keep the strict fallback.
          PREFLIGHT_DEFER_GO_ARTIFACT_DRIFT: ${{ (needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true') && '1' || '0' }}
        run: |
          if [ -x scripts/preflight.sh ]; then
            ./scripts/preflight.sh
          else
            ./dev-rules/templates/preflight.sh
          fi

  ssot-delta-gate:
    # Offline SSOT delta guard for catalog diffs. It intentionally does not hit
    # prod: new catalog/model_mapping changes can only become live after deploy,
    # so prod HTTP proof belongs to the post-deploy canary/closeout gate.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ssot_base != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 64
      - name: Resolve base ref for catalog diff
        id: catalog_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          MANUAL_BASE: ${{ inputs.ssot_base || '' }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_BASE:-}" ]; then
            git fetch --no-tags origin "$MANUAL_BASE" --depth=64
            BASE="$(git rev-parse 'FETCH_HEAD^{commit}')"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin "$BEFORE_SHA" --depth=64
            BASE="$BEFORE_SHA"
          else
            git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" --depth=64
            BASE="origin/${BASE_REF}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Skip when catalog surface unchanged
        id: touch
        run: |
          set -euo pipefail
          changed=$(python3 scripts/checks/ssot-delta-gate.py paths-changed --base "${{ steps.catalog_base.outputs.base }}")
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - name: SSOT delta gate (offline, post-deploy live gate owns prod proof)
        if: steps.touch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/checks/ssot-delta-gate.py check --base "${{ steps.catalog_base.outputs.base }}" --skip-live
      - name: SSOT gate skip (catalog surface unchanged)
        if: steps.touch.outputs.changed != 'true'
        run: |
          echo "ssot-delta-gate: ok (no catalog-surface paths changed)"

  test-unit:
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'ci'))) && (needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    env:
      # Test failures retain file:line stacks without DWARF. Apply the flag to
      # every Go command in this job so the fixture gateway reuses unit objects.
      GOFLAGS: -gcflags=all=-dwarf=false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cache-and-checkout-new-api
      # cache:false + ./.github/actions/go-rolling-cache — setup-go's built-in
      # cache is immutable and was shared across the three Go jobs despite their
      # differing build tags, so the test-result cache never persisted (every run
      # cold-compiled + re-ran all packages). See that composite for the full why.
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - uses: ./.github/actions/go-rolling-cache
        with:
          # Unit test archives omit DWARF below, so keep them out of the old
          # 2.6GB namespace whose objects were built with different gcflags.
          prefix: unit-nodwarf-v1
      - name: Verify Go version
        run: |
          expected=$(awk '/^go /{print $2; exit}' backend/go.mod)
          go version | grep -Fq "go${expected}"
      - name: Unit tests
        working-directory: backend
        env:
          # Service tests inspect tracked source/fixture files at runtime, so
          # checkout mtimes prevent cross-run result-cache hits even when the
          # weekly Go build cache restores exactly. Always use the compile-once
          # runner instead of gambling the critical path on test-result cache.
          UNIT_TEST_SERVICE_SHARD: "1"
        run: make test-unit
      - name: Anthropic prompt surface fixture gateway
        run: python3 ops/anthropic/probe_prompt_surfaces.py --check-fixture-gateway
      - name: Model surface bundle drift
        run: bash scripts/checks/check-model-surface-bundle.sh
      - name: Model family alert artifact drift
        run: bash scripts/sentinels/check-model-family-rules.sh

  test-integration:
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'ci'))) && (needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    env:
      # Integration failures retain file:line stacks without DWARF while the
      # package/test cache stays materially smaller to restore and refresh.
      GOFLAGS: -gcflags=all=-dwarf=false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cache-and-checkout-new-api
      # cache:false + ./.github/actions/go-rolling-cache — see test-unit above.
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - uses: ./.github/actions/go-rolling-cache
        with:
          prefix: integration-nodwarf-v1
          refresh_on_backend_change: "true"
      - name: Verify Go version
        run: |
          expected=$(awk '/^go /{print $2; exit}' backend/go.mod)
          go version | grep -Fq "go${expected}"
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'ci'))) && (needs.changes.outputs.all == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Major must match Dockerfile ARG NODE_IMAGE — the release image's
          # frontend builder. Gate: scripts/checks/node-version-align.py.
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'ci'))) && (needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true')
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      # golangci-lint consumes export/type data, not DWARF. Omitting it targets
      # the measured 2.25GB lint build cache and its 41s restore bottleneck.
      GOFLAGS: -gcflags=all=-dwarf=false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cache-and-checkout-new-api
      # cache:false + ./.github/actions/go-rolling-cache — see test-unit above.
      # The composite also rolls ~/.cache/golangci-lint from main. The action's
      # built-in interval cache is immutable after its first save, so it cannot
      # persist changed-package analysis again until the interval key changes.
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - uses: ./.github/actions/go-rolling-cache
        with:
          prefix: lint-nodwarf-v1
          golangci_cache: "true"
      - name: Verify Go version
        run: |
          expected=$(awk '/^go /{print $2; exit}' backend/go.mod)
          go version | grep -Fq "go${expected}"
      # Full lint on PR and push. `only-new-issues` masked base/main lint debt:
      # PRs stayed green while push-to-main full lint failed after merge.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --concurrency=4 --timeout=30m
          working-directory: backend
          only-new-issues: false
          skip-cache: "true"

  backend-security:
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'security'))) && (needs.changes.outputs.all == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cache-and-checkout-new-api
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected=$(awk '/^go /{print $2; exit}' backend/go.mod)
          go version | grep -Fq "go${expected}"
      - name: Run gosec lint
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --enable-only gosec --concurrency=4 --timeout=30m
          working-directory: backend
      - name: Note gosec scope (push/PR runs)
        # Honesty signal: on push/PR this job runs ONLY govulncheck — gosec static
        # analysis is gated to schedule/dispatch above. Without this note a green
        # `backend-security` check on a PR reads as "gosec passed" when it never
        # ran. Zero-cost; surfaces the gap in the log + step summary.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          echo "::notice title=gosec scope::gosec static analysis runs weekly (Mon 03:00 UTC) and on manual dispatch — NOT on push/PR. This run executed govulncheck only."
          echo "ℹ️ \`backend-security\` on push/PR runs **govulncheck only**. gosec static analysis runs weekly (Mon 03:00 UTC) + manual dispatch (\`suite: security\`)." >> "$GITHUB_STEP_SUMMARY"
      - name: Run govulncheck
        working-directory: backend
        run: |
          # Pin govulncheck (was @latest). An unpinned @latest is non-reproducible
          # and a supply-chain surface — a bad upstream release would silently
          # break or poison this gate. Contrast golangci-lint (pinned v2.9) and
          # new-api (pinned by SHA). Bump deliberately.
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  frontend-security:
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'security'))) && (needs.changes.outputs.all == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Major must match Dockerfile ARG NODE_IMAGE — the release image's
          # frontend builder. Gate: scripts/checks/node-version-align.py.
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        uses: ./.github/actions/pnpm-audit

  new-api-bump-smoke:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 9 * * TUE') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'weekly-smoke'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/cache-and-checkout-new-api
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected=$(awk '/^go /{print $2; exit}' backend/go.mod)
          go version | grep -Fq "go${expected}"
      - name: Run pinned new-api smoke via bump helper
        run: |
          CURRENT_PIN="$(tr -d '[:space:]' < .new-api-ref)"
          bash scripts/upstream/bump-new-api.sh "$CURRENT_PIN"

  compile-smoke:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 9 * * TUE') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'weekly-smoke'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/cache-and-checkout-new-api
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected=$(awk '/^go /{print $2; exit}' backend/go.mod)
          go version | grep -Fq "go${expected}"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Major must match Dockerfile ARG NODE_IMAGE — the release image's
          # frontend builder. Gate: scripts/checks/node-version-align.py.
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Run preflight
        run: ./scripts/preflight.sh
      - name: Build backend and frontend
        run: make build
