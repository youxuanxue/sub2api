name: Stage0 Warm Image

# Pre-warms a released image tag on every prod app node BEFORE a rolling deploy.
# It writes the per-node image-distribution receipt that rolling.py requires.
#
# Read-only with respect to the running service: it only pulls, tags, and writes
# the local image receipt. It never edits .env, restarts, drains, or swaps the
# running container.
#
# Default remote channel is TAT on tencent-ops (mirrors cn-prod warm-ghcr).
# SSM remains an emergency path outside this workflow (see deploy/hetzner/README.md).
#
# Driven by tokenkey-stage0-release-rollout: dispatch before prod rolling deploy.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released image tag without leading v (e.g. 1.8.0). Must already exist on GHCR."
        required: true
        type: string
      revision:
        description: "Full 40-hex commit sha of the release."
        required: true
        type: string
      simple_release_override:
        description: "Pass-through to the GHCR multi-arch manifest gate. Default false; matches deploy-stage0.yml."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

# Warm is idempotent and read-only, but serialize per host so two concurrent
# warms don't fight over the docker pull lock. Separate group from the deploy
# lock so a warm never blocks (or is blocked by) an in-flight deploy.
concurrency:
  group: warm-image-stage0-prod
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    # Two app nodes warmed sequentially via warm_fanout (default remote timeout
    # 1200s each). Keep the job budget above one cold multi-node pass, and far
    # below the 6h default so a hung poll cannot hold the concurrency lock.
    timeout-minutes: 30
    # Execution uses Tencent TAT credentials (same shape as distribute-cn warm).
    # Approval for the subsequent rolling deploy stays on the prod Environment.
    environment: tencent-ops
    env:
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_REVISION: ${{ inputs.revision }}
      INPUT_OVERRIDE: ${{ inputs.simple_release_override }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate inputs
        run: |
          set -euo pipefail
          # Tag-format gate: single source of truth shared with the deploy
          # workflows (prevents regex/message drift).
          bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"
          if [[ ! "$INPUT_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be the full 40-hex commit sha" >&2
            exit 1
          fi

      - name: Verify GHCR multi-arch manifest
        # Shared gate with deploy-stage0.yml: never warm a tag the deploy would
        # refuse (e.g. a single-arch manifest missing the live host's arch).
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/stage0/verify_ghcr_manifest.sh "$INPUT_TAG" "$INPUT_OVERRIDE"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tccli
        run: python3 -m pip install 'tccli==3.1.198.1'

      - name: Warm every prod app node
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 deploy/domestic/warm_fanout.py warm-all \
            --manifest deploy/tencent/candidate-usw-20261022.json \
            --tag "$INPUT_TAG" \
            --revision "$INPUT_REVISION" \
            --transport ghcr \
            --channel tat \
            --repository "ghcr.io/${GITHUB_REPOSITORY,,}" \
            --receipt-out prod-warm-receipt.json

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Stage0 Warm Image"
            echo "- tag: \`$INPUT_TAG\`"
            echo "- revision: \`$INPUT_REVISION\`"
            echo "- channel: tat (tencent-ops)"
            echo "- effect: image pre-pulled on every prod app node (read-only; no deploy)"
            echo "- receipt: \`prod-warm-receipt.json\`"
            echo "- next: dispatch prod rolling deploy with the same tag and revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prod-warm-receipt
          path: prod-warm-receipt.json
          if-no-files-found: warn
          retention-days: 30
