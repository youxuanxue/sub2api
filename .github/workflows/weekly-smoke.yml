name: Weekly Smoke

# Kept off the CI workflow so push/PR runs do not register these jobs.
# Skipped job records were materialized minutes after the required checks
# finished and stretched the CI run duration (2026-10-22).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * TUE'

permissions:
  contents: read

concurrency:
  group: weekly-smoke
  cancel-in-progress: false

jobs:
  new-api-bump-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/cache-and-checkout-new-api
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected=$(awk '/^go /{print $2; exit}' backend/go.mod)
          go version | grep -Fq "go${expected}"
      - name: Run pinned new-api smoke via bump helper
        run: |
          CURRENT_PIN="$(tr -d '[:space:]' < .new-api-ref)"
          bash scripts/upstream/bump-new-api.sh "$CURRENT_PIN"

  compile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/cache-and-checkout-new-api
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected=$(awk '/^go /{print $2; exit}' backend/go.mod)
          go version | grep -Fq "go${expected}"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Major must match Dockerfile ARG NODE_IMAGE — the release image's
          # frontend builder. Gate: scripts/checks/node-version-align.py.
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Run preflight
        run: ./scripts/preflight.sh
      - name: Build backend and frontend
        run: make build
