name: Publish Pricing Registry

on:
  push:
    branches: [main]
    paths:
      - backend/internal/service/tk_pricing_overlay.json
      - .github/workflows/pricing-registry-publish.yml

permissions:
  contents: read

concurrency:
  group: pricing-registry-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tencent-ops
    env:
      # Pricing registry CAS + redis PUBLISH run on the data machine (PG/Redis),
      # not an app node. Multi-app fleets refuse a silent single-app default.
      PROD_SSM_NODE: data
      TOKENKEY_REMOTE_VIA: tat
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tccli
        run: python3 -m pip install 'tccli==3.1.198.1'

      - name: Resolve latest protected main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --detach origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Validate exact registry artifact
        run: |
          set -euo pipefail
          python3 scripts/checks/pricing-overlay.py
          python3 ops/pricing/manage-overlay-runtime.py sync-runtime --dry-run

      - name: Require Tencent ops credentials
        run: |
          set -euo pipefail
          for key in TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is required for pricing publication via TAT"
              exit 1
            fi
          done

      - name: Publish and verify protected-main snapshot
        run: python3 ops/pricing/manage-overlay-runtime.py sync-runtime
