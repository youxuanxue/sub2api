name: Stage0 GHCR Prune Timer Refresh

# One-shot ops workflow that pushes tokenkey-ghcr-prune-daily.{sh,service,timer}
# onto running Stage0 hosts via SSM, WITHOUT rebuilding instances.
# New prod boots inherit the timer from stage0-ec2-bootstrap.sh.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-stage0-ghcr-prune-timer-prod
  cancel-in-progress: false

jobs:
  prod:
    runs-on: ubuntu-latest
    environment: prod
    env:
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: ${{ vars.PROD_STACK_NAME || 'tokenkey-prod-stage0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate OIDC role
        run: |
          set -euo pipefail
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "::error::AWS_OIDC_ROLE_ARN repo variable not set"
            exit 1
          fi
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve prod instance id
        id: instance
        env:
          PROD_SSM_TARGET: ${{ vars.PROD_SSM_TARGET || 'auto' }}
        run: |
          set -euo pipefail
          RESOLVED_JSON="$(python3 ops/stage0/resolve_prod_ssm_target.py \
            --target "${PROD_SSM_TARGET}" \
            --stack "$STACK_NAME" \
            --format json \
            --github-output "$GITHUB_OUTPUT")"
          python3 -c '
          import json, sys
          d = json.loads(sys.argv[1])
          for key in ("id", "ssm_region", "target"):
            if not d.get(key):
              raise SystemExit(f"::error::missing {key} in resolve_prod_ssm_target output")
          print(
              "ghcr-prune timer instance=%s target=%s ssm_region=%s"
              % (d["id"], d["target"], d["ssm_region"])
          )
          ' "$RESOLVED_JSON"
      - name: Sync GHCR prune timer via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          AWS_REGION: ${{ steps.instance.outputs.ssm_region }}
          STAGE0_SSM_OUTPUT_DIR: .
        run: bash ops/stage0/sync-ghcr-prune-timer-via-ssm.sh "$INSTANCE_ID" "ops-ghcr-prune-timer target=prod"
      - name: Job summary
        if: always()
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STACK_NAME: ${{ env.STACK_NAME }}
          CMD_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          {
            echo "## ops ghcr-prune-daily timer refresh"
            echo "- environment: \`prod\`"
            echo "- stack: \`$STACK_NAME\`"
            echo "- instance: \`$INSTANCE_ID\`"
            echo "- ssm command id: \`${CMD_ID:-none}\`"
            echo "- schedule: daily 05:00 UTC (+ up to 30m jitter, after QA 04:15)"
            echo "- template-sync-from: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
