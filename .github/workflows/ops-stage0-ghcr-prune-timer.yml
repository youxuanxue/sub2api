name: Stage0 GHCR Prune Timer Refresh

# One-shot ops workflow that pushes tokenkey-ghcr-prune-daily.{sh,service,timer}
# onto running Stage0 hosts via SSM, WITHOUT rebuilding instances.
# New prod boots inherit the timer from stage0-ec2-bootstrap.sh; edges inherit it
# from sync-edge-host-units-via-ssm.sh on deploy. This backfills live hosts.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target host class"
        required: true
        type: choice
        options:
          - prod
          - all-deployable-edges

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-stage0-ghcr-prune-timer-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  discover-edges:
    if: inputs.target == 'all-deployable-edges'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v6
      - name: Build deployable edge matrix
        id: matrix
        run: |
          set -euo pipefail
          python3 deploy/aws/stage0/resolve-edge-target.py \
            --prod-ops-matrix \
            --target-selector 'edge:*' \
            --github-output "$GITHUB_OUTPUT"

  prod:
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    env:
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: ${{ vars.PROD_STACK_NAME || 'tokenkey-prod-stage0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate OIDC role
        run: |
          set -euo pipefail
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "::error::AWS_OIDC_ROLE_ARN repo variable not set"
            exit 1
          fi
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve prod instance id
        id: instance
        run: |
          set -euo pipefail
          ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`InstanceId`].OutputValue' --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "::error::could not resolve InstanceId from stack $STACK_NAME"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Sync GHCR prune timer via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STAGE0_SSM_OUTPUT_DIR: .
        run: bash ops/stage0/sync-ghcr-prune-timer-via-ssm.sh "$INSTANCE_ID" "ops-ghcr-prune-timer target=prod"
      - name: Job summary
        if: always()
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STACK_NAME: ${{ env.STACK_NAME }}
          CMD_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          {
            echo "## ops ghcr-prune-daily timer refresh"
            echo "- environment: \`prod\`"
            echo "- stack: \`$STACK_NAME\`"
            echo "- instance: \`$INSTANCE_ID\`"
            echo "- ssm command id: \`${CMD_ID:-none}\`"
            echo "- schedule: daily 05:00 UTC (+ up to 30m jitter, after QA 04:15)"
            echo "- template-sync-from: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  all-deployable-edges:
    needs: discover-edges
    if: inputs.target == 'all-deployable-edges' && needs.discover-edges.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-edges.outputs.matrix) }}
    env:
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      EDGE_ID: ${{ matrix.edge_id }}
      AWS_REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate OIDC role
        run: |
          set -euo pipefail
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "::error::AWS_OIDC_ROLE_ARN repo variable not set"
            exit 1
          fi
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve live SSM managed-instance id
        id: instance
        run: |
          set -euo pipefail
          IDENTITY="$(python3 ops/stage0/edge_ssm_execution.py \
            --edge-id "$EDGE_ID" --platform lightsail --format json)"
          INSTANCE_ID="$(jq -r .instance_id <<<"$IDENTITY")"
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "::error::could not resolve SSM managed-instance id for $EDGE_ID"
            exit 1
          fi
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
      - name: Sync edge host units (includes ghcr-prune-daily timer)
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STAGE0_SSM_OUTPUT_DIR: .
        run: bash ops/stage0/sync-edge-host-units-via-ssm.sh "$INSTANCE_ID" "ops-ghcr-prune-timer edge=$EDGE_ID"
