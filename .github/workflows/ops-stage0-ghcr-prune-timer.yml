name: Stage0 GHCR Prune Timer Refresh

# One-shot ops workflow that pushes tokenkey-ghcr-prune-daily.{sh,service,timer}
# onto every prod app node via TAT, WITHOUT rebuilding instances.
# New prod boots inherit the timer from stage0-ec2-bootstrap.sh.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-stage0-ghcr-prune-timer-prod
  cancel-in-progress: false

jobs:
  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tencent-ops
    steps:
      - uses: actions/checkout@v6
        with:
          # Trusted default-branch code only; tencent-ops is limited to main.
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tccli
        run: python3 -m pip install 'tccli==3.1.198.1'

      - name: Sync GHCR prune timer via TAT (all app nodes)
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 ops/stage0/sync_ghcr_prune_timer.py \
            --manifest deploy/tencent/candidate-usw-20261022.json \
            --via tat \
            --template-sha "${GITHUB_SHA}" \
            --receipt-out prod-ghcr-prune-timer-receipt.json

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ops ghcr-prune-daily timer refresh"
            echo "- environment: \`tencent-ops\`"
            echo "- channel: tat"
            echo "- manifest: \`deploy/tencent/candidate-usw-20261022.json\` (all app nodes)"
            echo "- schedule: daily 05:00 UTC (+ up to 30m jitter, after QA 04:15)"
            echo "- template-sync-from: \`${GITHUB_SHA}\`"
            echo "- receipt: \`prod-ghcr-prune-timer-receipt.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prod-ghcr-prune-timer-receipt
          path: prod-ghcr-prune-timer-receipt.json
          if-no-files-found: warn
          retention-days: 30
