name: Stage0 pg_dump Refresh

# One-shot ops workflow that pushes the refreshed pg_dump cadence (every 2h,
# ≤12 rolling files) into running Stage0 instances. The same systemd unit /
# timer / script content already lives in
# deploy/aws/cloudformation/stage0-single-ec2.yaml; this workflow brings the
# LIVE instance in sync without rebuilding EC2 user-data (which would trigger
# a prod restart). Future stack rebuild remains the source of truth.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target: prod (edges are Lightsail-only and not covered by this EC2 SSM cadence)"
        required: true
        type: choice
        options:
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-stage0-pg-dump-refresh-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  prod:
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    env:
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: ${{ vars.PROD_STACK_NAME || 'tokenkey-prod-stage0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate OIDC role
        run: |
          set -euo pipefail
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "::error::AWS_OIDC_ROLE_ARN repo variable not set"
            exit 1
          fi
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve prod instance id
        id: instance
        env:
          STACK_NAME: ${{ env.STACK_NAME }}
          PROD_SSM_TARGET: ${{ vars.PROD_SSM_TARGET || 'auto' }}
        run: |
          set -euo pipefail
          RESOLVED_JSON="$(python3 ops/stage0/resolve_prod_ssm_target.py \
            --target "${PROD_SSM_TARGET}" \
            --stack "$STACK_NAME" \
            --format json \
            --github-output "$GITHUB_OUTPUT")"
          python3 -c '
          import json, sys
          d = json.loads(sys.argv[1])
          for key in ("id", "ssm_region", "target"):
            if not d.get(key):
              raise SystemExit(f"::error::missing {key} in resolve_prod_ssm_target output")
          print(
              "pg_dump refresh instance=%s target=%s ssm_region=%s"
              % (d["id"], d["target"], d["ssm_region"])
          )
          ' "$RESOLVED_JSON"
      - name: Refresh pg_dump via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          AWS_REGION: ${{ steps.instance.outputs.ssm_region }}
          STAGE0_SSM_OUTPUT_DIR: .
        run: bash ops/stage0/pg_dump_refresh_via_ssm.sh "$INSTANCE_ID" "ops-pg-dump-refresh target=prod"
      - name: Job summary
        if: always()
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STACK_NAME: ${{ env.STACK_NAME }}
          CMD_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          {
            echo "## ops pg_dump refresh"
            echo "- environment: \`prod\`"
            echo "- stack: \`$STACK_NAME\`"
            echo "- instance: \`$INSTANCE_ID\`"
            echo "- ssm command id: \`${CMD_ID:-none}\`"
            echo "- cadence: every 2 hours"
            echo "- retention: max 12 rolling files + 24h mtime ceiling"
            echo "- template-sync-from: \`${GITHUB_SHA}\` (deploy/aws/cloudformation/stage0-single-ec2.yaml)"
          } >> "$GITHUB_STEP_SUMMARY"
