name: Prod Feishu Config Watchdog

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-feishu-config-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tencent-ops
    env:
      TK_FEISHU_WEBHOOK_URL: ${{ secrets.TK_FEISHU_WEBHOOK_URL }}
      TK_FEISHU_SIGNING_SECRET: ${{ secrets.TK_FEISHU_SIGNING_SECRET }}
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tccli
        run: python3 -m pip install 'tccli==3.1.198.1'
      - name: Validate watchdog configuration
        run: |
          set -euo pipefail
          for key in TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY TK_FEISHU_WEBHOOK_URL TK_FEISHU_SIGNING_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured"
              exit 1
            fi
          done
      - name: Probe production alert configuration
        id: probe
        run: |
          set +e
          bash ops/observability/run-probe.sh \
            --target prod \
            --via tat \
            --script ops/observability/probe-alert-config.sh \
            --comment "daily Feishu alert configuration watchdog" \
            > probe-alert-config.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report configuration drift
        if: always()
        run: |
          python3 ops/observability/check_feishu_config.py \
            --probe-file probe-alert-config.json \
            --probe-exit-code "${{ steps.probe.outputs.exit_code }}"
      - name: Fail when the production probe failed
        if: always() && steps.probe.outputs.exit_code != '0'
        run: exit 1
