name: sync-docs-to-pages

# Manual sync of docs/public/*.md files to prod pages storage.
# Pages are served by GET /api/v1/pages/:slug and rendered by CustomPageView
# after the slug is registered in Admin → Settings → custom menu items.
#
# CC/tool onboarding uses /quickstart; no public pages auto-sync on push.

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated docs/public/*.md files to sync (required)'
        required: true

permissions:
  contents: read
  id-token: write   # required for OIDC → AWS credentials exchange

concurrency:
  group: sync-docs-to-pages
  cancel-in-progress: true

jobs:
  sync:
    name: sync docs → prod pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve prod instance ID
        id: instance
        env:
          STACK_NAME: ${{ vars.PROD_STACK_NAME || 'tokenkey-prod-stage0' }}
          PROD_SSM_TARGET: ${{ vars.PROD_SSM_TARGET || 'auto' }}
        run: |
          set -euo pipefail
          RESOLVED_JSON="$(python3 ops/stage0/resolve_prod_ssm_target.py \
            --target "${PROD_SSM_TARGET}" \
            --stack "$STACK_NAME" \
            --format json \
            --github-output "$GITHUB_OUTPUT")"
          python3 -c '
          import json, sys
          d = json.loads(sys.argv[1])
          for key in ("id", "ssm_region", "target"):
            if not d.get(key):
              raise SystemExit(f"::error::missing {key} in resolve_prod_ssm_target output")
          print(
              "docs sync instance=%s target=%s ssm_region=%s stack=%s"
              % (d["id"], d["target"], d["ssm_region"], sys.argv[2])
          )
          ' "$RESOLVED_JSON" "$STACK_NAME"

      - name: Sync docs files to prod pages
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          AWS_REGION: ${{ steps.instance.outputs.ssm_region }}
          STAGE0_SSM_OUTPUT_DIR: .
        run: |
          set -euo pipefail
          INPUT_FILES="${{ inputs.files }}"
          if [ -z "${INPUT_FILES// /}" ]; then
            echo "::error::files input is required (space-separated docs/public/*.md paths)" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          bash ops/stage0/sync_docs_pages.sh "$INSTANCE_ID" $INPUT_FILES

      - name: Summary
        if: always()
        run: |
          echo "## Docs → Pages Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f sync-docs-pages-stdout.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat sync-docs-pages-stdout.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Register new slugs in Admin → Settings → custom menu (url: \`md:<slug>\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "Only \`docs/public/*.md\` files are eligible for sync." >> "$GITHUB_STEP_SUMMARY"
