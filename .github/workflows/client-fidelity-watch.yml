name: Client Fidelity Watch

# Umbrella daily watch: client release poll → prompt registry gate → prod aggregate
# → edge OAuth mimic aggregate (schedulable anthropic oauth edges only).
# One schedule, one daily report artifact, unified issue labels (client-fidelity-watch + signal type).
# Prod actionable drift and registry-gate failure fail the workflow (red).

on:
  schedule:
    # GitHub cron is UTC. Sequential: release scan → registry-gate → prod-aggregate → edge-oauth-mimic.
    - cron: "3 23 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "docker logs --since for prod fingerprint probe"
        required: false
        default: "24h"
      dry_run:
        description: "Run checks but do NOT open/update GitHub issues"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: client-fidelity-watch
  cancel-in-progress: false

jobs:
  release-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_drift: ${{ steps.watch.outputs.has_drift }}
      drift_count: ${{ steps.watch.outputs.drift_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Scan upstream client releases
        id: watch
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          python3 scripts/fingerprint/client_release_watch.py \
            --git-sha "$SHA" \
            --run-url "$RUN_URL" \
            --report-json .cache/fingerprint/client-release-watch/report.json \
            --report-md .cache/fingerprint/client-release-watch/report.md \
            --state .cache/fingerprint/client-release-watch.json || WATCH_EXIT=$?
          WATCH_EXIT="${WATCH_EXIT:-0}"
          python3 -m json.tool .cache/fingerprint/client-release-watch/report.json >/dev/null
          HAS_DRIFT="$(python3 -c "import json;print('true' if json.load(open('.cache/fingerprint/client-release-watch/report.json'))['summary']['has_actionable_drift'] else 'false')")"
          DRIFT_COUNT="$(python3 -c "import json;print(json.load(open('.cache/fingerprint/client-release-watch/report.json'))['summary']['drift_count'])")"
          {
            echo "has_drift=$HAS_DRIFT"
            echo "drift_count=$DRIFT_COUNT"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update drift tracking issues
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 ops/fingerprint/open_client_release_watch_issues.py \
            --umbrella \
            --links-json .cache/fingerprint/client-release-watch/links.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-fidelity-release-${{ github.run_id }}
          path: |
            .cache/fingerprint/client-release-watch/report.json
            .cache/fingerprint/client-release-watch/report.md
            .cache/fingerprint/client-release-watch.json
            .cache/fingerprint/client-release-watch/links.json
          if-no-files-found: ignore

  registry-gate:
    needs: release-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/cache-and-checkout-new-api

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Registry + fixture gateway gate
        run: |
          set -euo pipefail
          python3 ops/anthropic/probe_prompt_surfaces.py --check-registry
          python3 ops/anthropic/probe_prompt_surfaces.py --check-fixture-gateway
          (
            cd backend
            go test -tags=unit ./internal/service \
              -run 'TestTkExtractAnthropicPromptFingerprint|TestTkValidateAnthropicToolContext|TestTkRejectInvalidAnthropicToolContext|TestTkProbePromptSurfaceGatewayCoverageJSONL|TestTkNormalizeCCGeo|TestCanonicalIdentityIsSingleSourceOfTruth|TestGetOrCreateFingerprint_CanonicalProfile' \
              -count=1
            go test -tags=unit ./internal/handler \
              -run 'TestClassifyOpsUpstreamClientInducedRejectionOwnedByClient' \
              -count=1
          )
          python3 -m unittest ops.anthropic.test_probe_prompt_surfaces -v
          python3 -m unittest ops.anthropic.test_probe_cc_geo_stego -v
          python3 -m unittest ops.observability.test_probe_prompt_surface_fingerprints -v
          python3 -m unittest ops.observability.test_open_prompt_surface_watch_issues -v
          python3 -m unittest ops.fingerprint.test_open_client_release_watch_issues -v
          python3 scripts/fingerprint/client_fidelity_watch_report.py --selftest

      - name: Close recovered registry-gate tracking issue
        if: success() && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing required secret UPSTREAM_MERGE_GH_TOKEN for issue updates."
            exit 1
          fi
          python3 ops/observability/open_prompt_surface_watch_issues.py registry-recover --run-url "$RUN_URL" --umbrella

  notify-registry-failure:
    needs: registry-gate
    if: always() && needs.registry-gate.result == 'failure' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Open registry-gate failure issue
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing required secret UPSTREAM_MERGE_GH_TOKEN for issue updates."
            exit 1
          fi
          python3 ops/observability/open_prompt_surface_watch_issues.py registry-failure \
            --run-url "$RUN_URL" \
            --umbrella \
            --links-json .cache/prompt-surface-watch/links.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-fidelity-prompt-${{ github.run_id }}
          path: .cache/prompt-surface-watch/
          if-no-files-found: ignore

  prod-aggregate:
    needs: registry-gate
    if: always() && needs.registry-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      observation_status: ${{ steps.observation.outputs.status }}
    env:
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SINCE: ${{ inputs.since || '24h' }}
    steps:
      - uses: actions/checkout@v6

      - name: Precheck OIDC role
        id: precheck
        run: |
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_OIDC_ROLE_ARN empty — skipping prod aggregate"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.precheck.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Probe prod fingerprint logs (read-only SSM)
        id: observer
        if: steps.precheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p .cache/prompt-surface-watch
          bash ops/observability/run-probe.sh \
            --target prod \
            --script ops/observability/probe-prompt-surface-fingerprints.sh \
            --env "SINCE=${SINCE}" \
            --env "LIMIT=40" \
            --comment "client-fidelity-watch prod fingerprint aggregate" \
            --timeout-seconds 120 \
            > .cache/prompt-surface-watch/prod-fingerprints.json || true  # preflight-allow: swallow
          python3 ops/observability/prompt_surface_aggregate.py \
            --input .cache/prompt-surface-watch/prod-fingerprints.json \
            --report-json .cache/prompt-surface-watch/report.json \
            --report-md .cache/prompt-surface-watch/report.md || AGG=$?
          cat .cache/prompt-surface-watch/report.md || true  # preflight-allow: swallow
          exit "${AGG:-0}"

      - name: Sync prod drift tracking issue
        if: always() && steps.precheck.outputs.skip == 'false' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing required secret UPSTREAM_MERGE_GH_TOKEN for issue updates."
            exit 1
          fi
          if [ ! -f .cache/prompt-surface-watch/report.json ]; then
            echo "No aggregate report — skipping issue sync"
            exit 0
          fi
          python3 ops/observability/open_prompt_surface_watch_issues.py prod-sync \
            --report-json .cache/prompt-surface-watch/report.json \
            --report-md .cache/prompt-surface-watch/report.md \
            --run-url "$RUN_URL" \
            --umbrella \
            --links-json .cache/prompt-surface-watch/links.json

      - name: Record prod observation status
        id: observation
        if: always()
        run: |
          if [ "${{ steps.precheck.outputs.skip }}" == "true" ]; then
            status=skipped
          elif [ -f .cache/prompt-surface-watch/report.json ] && python3 -m json.tool .cache/prompt-surface-watch/report.json >/dev/null 2>&1; then
            status=observed
          elif [ "${{ steps.observer.outcome }}" == "failure" ]; then
            status=observer_failed
          else
            status=missing_report
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "prod observation status: $status"

      - uses: actions/upload-artifact@v7
        if: always() && steps.precheck.outputs.skip == 'false'
        with:
          name: client-fidelity-prompt-${{ github.run_id }}
          path: .cache/prompt-surface-watch/
          if-no-files-found: ignore

  edge-oauth-mimic-aggregate:
    needs: registry-gate
    if: always() && needs.registry-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      observation_status: ${{ steps.observation.outputs.status }}
    env:
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SINCE: ${{ inputs.since || '24h' }}
      WINDOW_MINUTES: "1440"
    steps:
      - uses: actions/checkout@v6

      - name: Precheck OIDC role
        id: precheck
        run: |
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_OIDC_ROLE_ARN empty — skipping edge oauth mimic aggregate"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.precheck.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Scan schedulable anthropic oauth edges for mimic chain (read-only SSM)
        id: observer
        if: steps.precheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p .cache/oauth-mimic-watch
          bash ops/observability/scan-oauth-mimic-chain.sh \
            --since "$SINCE" \
            --window-minutes "$WINDOW_MINUTES" \
            > .cache/oauth-mimic-watch/probes.jsonl || true  # preflight-allow: swallow
          python3 ops/observability/oauth_mimic_aggregate.py \
            --input .cache/oauth-mimic-watch/probes.jsonl \
            --since "$SINCE" \
            --window-minutes "$WINDOW_MINUTES" \
            --report-json .cache/oauth-mimic-watch/report.json \
            --report-md .cache/oauth-mimic-watch/report.md || AGG=$?
          cat .cache/oauth-mimic-watch/report.md || true  # preflight-allow: swallow
          exit "${AGG:-0}"

      - name: Sync edge oauth mimic drift tracking issue
        if: always() && steps.precheck.outputs.skip == 'false' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_GH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing required secret UPSTREAM_MERGE_GH_TOKEN for issue updates."
            exit 1
          fi
          if [ ! -f .cache/oauth-mimic-watch/report.json ]; then
            echo "No oauth mimic aggregate report — skipping issue sync"
            exit 0
          fi
          python3 ops/observability/open_oauth_mimic_watch_issues.py edge-sync \
            --report-json .cache/oauth-mimic-watch/report.json \
            --report-md .cache/oauth-mimic-watch/report.md \
            --run-url "$RUN_URL" \
            --umbrella \
            --links-json .cache/oauth-mimic-watch/links.json

      - name: Record edge OAuth mimic observation status
        id: observation
        if: always()
        run: |
          if [ "${{ steps.precheck.outputs.skip }}" == "true" ]; then
            status=skipped
          elif [ -f .cache/oauth-mimic-watch/report.json ] && python3 -m json.tool .cache/oauth-mimic-watch/report.json >/dev/null 2>&1; then
            status=observed
          elif [ "${{ steps.observer.outcome }}" == "failure" ]; then
            status=observer_failed
          else
            status=missing_report
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "edge OAuth mimic observation status: $status"

      - uses: actions/upload-artifact@v7
        if: always() && steps.precheck.outputs.skip == 'false'
        with:
          name: client-fidelity-oauth-mimic-${{ github.run_id }}
          path: .cache/oauth-mimic-watch/
          if-no-files-found: ignore

  kiro-production-configured:
    needs: registry-gate
    if: always() && needs.registry-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      observation_status: ${{ steps.observation.outputs.status }}
    env:
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v6

      - name: Precheck OIDC role
        id: precheck
        run: |
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_OIDC_ROLE_ARN empty — skipping Kiro production-configured parity"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.precheck.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Probe Kiro production DB profile parity (read-only SSM)
        id: observer
        if: steps.precheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p .cache/kiro-profile-parity
          bash ops/observability/run-probe.sh \
            --target prod \
            --script ops/observability/probe-kiro-tls-profile-parity.sh \
            --comment "client-fidelity-watch Kiro production-configured parity" \
            --timeout-seconds 120 \
            > .cache/kiro-profile-parity/snapshot.json
          python3 ops/kiro/check_kiro_tls_profile_parity.py \
            --snapshot .cache/kiro-profile-parity/snapshot.json \
            --report-json .cache/kiro-profile-parity/report.json

      - name: Record Kiro parity observation status
        id: observation
        if: always()
        run: |
          if [ "${{ steps.precheck.outputs.skip }}" == "true" ]; then
            status=skipped
          elif [ -f .cache/kiro-profile-parity/report.json ] && python3 -m json.tool .cache/kiro-profile-parity/report.json >/dev/null 2>&1; then
            status=observed
          elif [ "${{ steps.observer.outcome }}" == "failure" ]; then
            status=observer_failed
          else
            status=missing_report
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Kiro production-configured parity observation status: $status"

      - uses: actions/upload-artifact@v7
        if: always() && steps.precheck.outputs.skip == 'false'
        with:
          name: client-fidelity-kiro-parity-${{ github.run_id }}
          path: .cache/kiro-profile-parity/
          if-no-files-found: ignore

  daily-report:
    needs: [release-scan, registry-gate, notify-registry-failure, prod-aggregate, edge-oauth-mimic-aggregate, kiro-production-configured]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pipeline_health: ${{ steps.merge.outputs.pipeline_health }}
      fidelity_verdict: ${{ steps.merge.outputs.fidelity_verdict }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: client-fidelity-release-${{ github.run_id }}
          path: .cache/fingerprint/client-release-watch
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: client-fidelity-prompt-${{ github.run_id }}
          path: .cache/prompt-surface-watch
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: client-fidelity-oauth-mimic-${{ github.run_id }}
          path: .cache/oauth-mimic-watch
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: client-fidelity-kiro-parity-${{ github.run_id }}
          path: .cache/kiro-profile-parity
        continue-on-error: true

      - name: Merge daily fidelity report
        id: merge
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release-scan.result }}
          REGISTRY_RESULT: ${{ needs.registry-gate.result }}
          PROD_RESULT: ${{ needs.prod-aggregate.result }}
          OAUTH_MIMIC_RESULT: ${{ needs.edge-oauth-mimic-aggregate.result }}
          KIRO_PROFILE_RESULT: ${{ needs.kiro-production-configured.result }}
        run: |
          set -euo pipefail
          mkdir -p .cache/fingerprint/client-fidelity-watch
          RELEASE_JSON="$(find .cache/fingerprint/client-release-watch -path '*/report.json' -print -quit 2>/dev/null || true)"
          RELEASE_MD="$(find .cache/fingerprint/client-release-watch -path '*/report.md' -print -quit 2>/dev/null || true)"
          RELEASE_LINKS=""
          if [ -d .cache/fingerprint/client-release-watch ]; then
            RELEASE_LINKS="$(find .cache/fingerprint/client-release-watch -path '*/links.json' -print -quit)"
          fi
          PROMPT_LINKS=""
          if [ -d .cache/prompt-surface-watch ]; then
            PROMPT_LINKS="$(find .cache/prompt-surface-watch -path '*/links.json' -print -quit)"
          fi
          PROMPT_JSON=".cache/prompt-surface-watch/report.json"
          PROMPT_MD=".cache/prompt-surface-watch/report.md"
          OAUTH_LINKS=""
          if [ -d .cache/oauth-mimic-watch ]; then
            OAUTH_LINKS="$(find .cache/oauth-mimic-watch -path '*/links.json' -print -quit)"
          fi
          OAUTH_JSON=".cache/oauth-mimic-watch/report.json"
          OAUTH_MD=".cache/oauth-mimic-watch/report.md"
          KIRO_PROFILE_JSON=".cache/kiro-profile-parity/report.json"
          ARGS=(
            --release-scan-result "$RELEASE_RESULT"
            --registry-gate-result "$REGISTRY_RESULT"
            --prod-aggregate-result "$PROD_RESULT"
            --edge-oauth-mimic-result "$OAUTH_MIMIC_RESULT"
            --kiro-profile-result "$KIRO_PROFILE_RESULT"
            --prod-observation-status "${{ needs.prod-aggregate.outputs.observation_status || 'unknown' }}"
            --edge-oauth-mimic-observation-status "${{ needs.edge-oauth-mimic-aggregate.outputs.observation_status || 'unknown' }}"
            --kiro-profile-observation-status "${{ needs.kiro-production-configured.outputs.observation_status || 'unknown' }}"
            --run-url "$RUN_URL"
            --report-json .cache/fingerprint/client-fidelity-watch/report.json
            --report-md .cache/fingerprint/client-fidelity-watch/report.md
          )
          if [ -n "$RELEASE_JSON" ] && [ -f "$RELEASE_JSON" ]; then
            ARGS+=(--release-report-json "$RELEASE_JSON")
          fi
          if [ -n "$RELEASE_MD" ] && [ -f "$RELEASE_MD" ]; then
            ARGS+=(--release-report-md "$RELEASE_MD")
          fi
          if [ -n "$RELEASE_LINKS" ] && [ -f "$RELEASE_LINKS" ]; then
            ARGS+=(--release-links-json "$RELEASE_LINKS")
          fi
          if [ -f "$PROMPT_JSON" ]; then
            ARGS+=(--prompt-prod-report-json "$PROMPT_JSON")
          fi
          if [ -f "$PROMPT_MD" ]; then
            ARGS+=(--prompt-prod-report-md "$PROMPT_MD")
          fi
          if [ -n "$PROMPT_LINKS" ] && [ -f "$PROMPT_LINKS" ]; then
            ARGS+=(--prompt-links-json "$PROMPT_LINKS")
          fi
          if [ -f "$OAUTH_JSON" ]; then
            ARGS+=(--oauth-mimic-report-json "$OAUTH_JSON")
          fi
          if [ -f "$OAUTH_MD" ]; then
            ARGS+=(--oauth-mimic-report-md "$OAUTH_MD")
          fi
          if [ -n "$OAUTH_LINKS" ] && [ -f "$OAUTH_LINKS" ]; then
            ARGS+=(--oauth-mimic-links-json "$OAUTH_LINKS")
          fi
          if [ -f "$KIRO_PROFILE_JSON" ]; then
            ARGS+=(--kiro-profile-report-json "$KIRO_PROFILE_JSON")
          fi
          python3 scripts/fingerprint/client_fidelity_watch_report.py "${ARGS[@]}"
          WORKFLOW_SHOULD_FAIL="$(python3 -c "import json; print(str(json.load(open('.cache/fingerprint/client-fidelity-watch/report.json'))['workflow_should_fail']).lower())")"
          PIPELINE_HEALTH="$(python3 -c "import json; print(json.load(open('.cache/fingerprint/client-fidelity-watch/report.json'))['pipeline_health']['status'])")"
          FIDELITY_VERDICT="$(python3 -c "import json; print(json.load(open('.cache/fingerprint/client-fidelity-watch/report.json'))['fidelity_verdict']['status'])")"
          echo "workflow_should_fail=$WORKFLOW_SHOULD_FAIL" >> "$GITHUB_OUTPUT"
          echo "pipeline_health=$PIPELINE_HEALTH" >> "$GITHUB_OUTPUT"
          echo "fidelity_verdict=$FIDELITY_VERDICT" >> "$GITHUB_OUTPUT"
          cat .cache/fingerprint/client-fidelity-watch/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-fidelity-watch-${{ github.run_id }}
          path: .cache/fingerprint/client-fidelity-watch/
          if-no-files-found: ignore

      - name: Enforce daily fidelity verdict
        if: always() && steps.merge.outputs.workflow_should_fail == 'true'
        run: |
          echo "::error::Daily client fidelity report contains an actionable failure."
          exit 1

  contract:
    needs: [release-scan, registry-gate, prod-aggregate, edge-oauth-mimic-aggregate, kiro-production-configured, daily-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize run
        run: |
          echo "release has_drift=${{ needs.release-scan.outputs.has_drift }}"
          echo "release drift_count=${{ needs.release-scan.outputs.drift_count }}"
          echo "registry-gate=${{ needs.registry-gate.result }}"
          echo "prod-aggregate=${{ needs.prod-aggregate.result }} observation=${{ needs.prod-aggregate.outputs.observation_status }}"
          echo "edge-oauth-mimic=${{ needs.edge-oauth-mimic-aggregate.result }} observation=${{ needs.edge-oauth-mimic-aggregate.outputs.observation_status }}"
          echo "kiro-production-configured=${{ needs.kiro-production-configured.result }} observation=${{ needs.kiro-production-configured.outputs.observation_status }}"
          echo "pipeline_health=${{ needs.daily-report.outputs.pipeline_health }}"
