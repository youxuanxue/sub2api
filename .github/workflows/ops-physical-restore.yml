name: Production Physical Restore (manual only)
# Closeout A13: GHA no longer assumes AWS OIDC. Isolated AWS restore stays a
# local operator command (run_physical_restore.py with operator AWS creds).
# Live-host acceptance is TAT: ops/stage0/probe-physical-restore-acceptance.sh
# via run-probe. Materials SSOT: host root-only .env + COS (not SecureString).
on:
  workflow_dispatch:
    inputs:
      target_name:
        description: Optional recorded named recovery point (full + incremental comparison)
        type: string
      target_time:
        description: UTC timestamp recorded with the named recovery point
        type: string
permissions:
  contents: read
concurrency:
  group: physical-production-restore
  cancel-in-progress: false
jobs:
  restore:
    # Manual use requires configured credentials, resources and an approved budget.
    if: vars.PHYSICAL_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TARGET_NAME: ${{ inputs.target_name }}
      TARGET_TIME: ${{ inputs.target_time }}
    steps:
      - uses: actions/checkout@v6
      - name: Refuse GHA OIDC physical restore (closeout A13)
        run: |
          set -euo pipefail
          echo "::error::ops-physical-restore.yml no longer runs AWS OIDC restore."
          echo "Operator path (local AWS creds + approved restore network):"
          echo "  python3 ops/stage0/run_physical_restore.py --region \"\$RESTORE_REGION\" \\"
          echo "    --bucket \"\$BACKUP_BUCKET\" --key artifacts/\$BUNDLE_SHA.tar.gz \\"
          echo "    --sha256 \"\$BUNDLE_SHA\" --image \"\$IMAGE_ID\" --subnet \"\$RESTORE_SUBNET\" \\"
          echo "    --architecture \"\$RESTORE_ARCH\" --profile \"\$RESTORE_PROFILE\" \\"
          echo "    --receipt restore-receipt.json --apply"
          if [ -n "${TARGET_NAME:-}" ]; then
            echo "  # optional: --target-name \"$TARGET_NAME\" --target-time \"$TARGET_TIME\""
          fi
          echo "Live acceptance (TAT, no SecureString):"
          echo "  bash ops/observability/run-probe.sh --target prod --node data --via tat \\"
          echo "    --script ops/stage0/probe-physical-restore-acceptance.sh"
          echo "SSOT: ops/stage0/physical-backup.md + deploy/hetzner/README.md"
          # Tombstone: keep the historical entrypoint name visible for docs/tests.
          echo "historical-entry: ops/stage0/run_physical_restore.py"
          exit 2
