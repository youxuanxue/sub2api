name: Production Physical Restore (manual only)
on:
  workflow_dispatch:
    inputs:
      target_name:
        description: Optional recorded named recovery point (full + incremental comparison)
        type: string
      target_time:
        description: UTC timestamp recorded with the named recovery point
        type: string
permissions:
  contents: read
concurrency:
  group: physical-production-restore
  cancel-in-progress: false
jobs:
  restore:
    # Manual use requires configured credentials, resources and an approved budget.
    if: vars.PHYSICAL_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      id-token: write
    env:
      BACKUP_BUCKET: ${{ vars.PHYSICAL_BACKUP_BUCKET }}
      BUNDLE_SHA: ${{ vars.PHYSICAL_BACKUP_BUNDLE_SHA }}
      IMAGE_ID: ${{ vars.PHYSICAL_BACKUP_IMAGE_ID }}
      RESTORE_PROFILE: ${{ vars.PHYSICAL_BACKUP_RESTORE_PROFILE }}
      # The restore network is an approved, explicit input. It is never derived
      # from the prod instance: Tencent prod is SSM Hybrid mi-* with no EC2 subnet.
      RESTORE_REGION: ${{ vars.PHYSICAL_RESTORE_REGION }}
      RESTORE_SUBNET: ${{ vars.PHYSICAL_RESTORE_SUBNET }}
      RESTORE_ARCH: ${{ vars.PHYSICAL_RESTORE_ARCH }}
      TARGET_NAME: ${{ inputs.target_name }}
      TARGET_TIME: ${{ inputs.target_time }}
    steps:
      - uses: actions/checkout@v6
      - name: Require an approved restore network (fail closed)
        run: |
          set -euo pipefail
          missing=()
          for name in RESTORE_REGION RESTORE_SUBNET RESTORE_ARCH; do
            [ -n "${!name}" ] || missing+=("PHYSICAL_${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::isolated restore network not approved/configured: ${missing[*]}. Prod is a Tencent SSM Hybrid host; see docs/ops/tencent-isolated-restore-plan.md"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.PHYSICAL_RESTORE_REGION }}
      - name: Run disposable recovery in the approved restore network
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TARGET_NAME" ]; then
            args+=(--target-name "$TARGET_NAME" --target-time "$TARGET_TIME")
          fi
          python3 ops/stage0/run_physical_restore.py --region "$RESTORE_REGION" --bucket "$BACKUP_BUCKET" \
            --key "artifacts/$BUNDLE_SHA.tar.gz" --sha256 "$BUNDLE_SHA" --image "$IMAGE_ID" \
            --subnet "$RESTORE_SUBNET" --architecture "$RESTORE_ARCH" --profile "$RESTORE_PROFILE" \
            --receipt restore-receipt.json --apply "${args[@]}"
      - name: Import acceptance into the existing source-host monitor
        run: |
          set -euo pipefail
          cat > /tmp/physical-accept.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          unit=$(systemctl show tokenkey-postgres-backup.service --property=ExecStart --value)
          operator=$(printf '%s' "$unit" | sed -n 's@.*\(/usr/local/lib/tokenkey/postgres-backup/[a-f0-9]*/postgres_backup.py\).*@\1@p')
          if [ -z "$operator" ]; then
            # Tencent prod runs tencent_pgbackrest.py, which has no accept command yet.
            echo "acceptance import unsupported by current backup operator: $unit" >&2
            exit 1
          fi
          python3 "$operator" accept --receipt /tmp/restore-receipt.json
          SH
          bash ops/observability/run-probe.sh --target prod --script /tmp/physical-accept.sh \
            --with restore-receipt.json --timeout-seconds 180 --comment 'import isolated physical restore acceptance'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: physical-restore-receipt
          path: restore-receipt.json
          retention-days: 7
          if-no-files-found: warn
