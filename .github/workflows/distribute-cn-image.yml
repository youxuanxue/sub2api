name: Distribute cn-prod image
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Backfill / retry after a failed publish (e.g. verify_archive bug on 1.8.310).
  # Always runs default-branch code; only the release-run artifact supplies tag/revision.
  # Default transport=prod: export on a prod host → Beijing COS → cn warm (avoids GHA→Beijing).
  # transport=s3: legacy crane publish on the GHA runner (often UserNetworkTooSlow to COS).
  # transport=ghcr: skip COS; cn nodes docker pull GHCR via TAT (emergency only).
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release run id that uploaded cn-image-source
        required: true
        type: string
      transport:
        description: prod = prod docker→COS (standard); s3 = GHA crane→COS; ghcr = pull GHCR
        required: true
        type: choice
        options:
          - prod
          - s3
          - ghcr
        default: prod
permissions:
  contents: read
  actions: read
concurrency:
  group: cn-prod-image-distribution
  cancel-in-progress: false
jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.repo.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      revision: ${{ steps.source.outputs.revision }}
      transport: ${{ steps.transport.outputs.transport }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record trusted default-branch revision
        id: repo
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require referenced Release run succeeded
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "release_run_id must be a numeric Actions run id" >&2
            exit 1
          fi
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          conclusion="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')"
          path="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("path") or "")')"
          if [[ "$conclusion" != "success" ]]; then
            echo "release_run_id=${RELEASE_RUN_ID} conclusion=${conclusion:-none}; want success" >&2
            exit 1
          fi
          if [[ "$path" != ".github/workflows/release.yml" ]]; then
            echo "release_run_id=${RELEASE_RUN_ID} path=${path}; want .github/workflows/release.yml" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: cn-image-source
          path: release-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.release_run_id || github.event.workflow_run.id }}
      - name: Validate release source against the git tag
        id: source
        run: |
          python3 deploy/domestic/image_distribution.py resolve \
            --source-file release-source/cn-image-source.json --github-output "$GITHUB_OUTPUT"
      - name: Resolve transport
        id: transport
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "transport=${{ inputs.transport }}" >> "$GITHUB_OUTPUT"
          else
            # Release-triggered runs use the standard prod→COS path.
            echo "transport=prod" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.transport == 's3'
    runs-on: ubuntu-latest
    # Legacy GHA→COS path; prefer publish-from-prod. Kept for emergency backfill.
    timeout-minutes: 60
    environment: tencent-ops
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image transfer tools
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          python3 -m pip install boto3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified cn-prod image archive (legacy GHA crane)
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          python3 deploy/domestic/image_distribution.py publish \
            --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" \
            --repository "ghcr.io/${GITHUB_REPOSITORY,,}" > cn-image-publish.json
      - name: Render per-node private COS prewarm scripts
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 deploy/domestic/warm_fanout.py render-all \
            --manifest deploy/domestic/prod-target.json \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --transport s3 \
            --channel tat \
            --render-out "cn-image-render.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cn-image-publish-receipts
          path: cn-image-publish.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: cn-image-render
          path: cn-image-render.json
          if-no-files-found: error
          retention-days: 1

  publish-from-prod:
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.transport == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tencent-ops
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tccli
        run: python3 -m pip install 'tccli==3.1.198.1'
      - name: Require Tencent TAT credentials
        run: |
          for key in TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured" >&2
              exit 1
            fi
          done
      - name: Publish from prod host to Beijing COS
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          chmod +x deploy/domestic/probe_publish_cn_from_prod.sh
          bash ops/observability/run-probe.sh --target prod --node app-cand --via tat \
            --script deploy/domestic/probe_publish_cn_from_prod.sh \
            --with deploy/domestic/image_distribution.py \
            --with deploy/domestic/image_archive.py \
            --with deploy/domestic/image-distribution.json \
            --env "RELEASE_TAG=${RELEASE_TAG}" \
            --env "RELEASE_REVISION=${RELEASE_REVISION}" \
            --env "GHCR_REPOSITORY=${REPO}" \
            --env "TENCENTCLOUD_SECRET_ID=${TENCENTCLOUD_SECRET_ID}" \
            --env "TENCENTCLOUD_SECRET_KEY=${TENCENTCLOUD_SECRET_KEY}" \
            --env "GHCR_TOKEN=${GHCR_TOKEN}" \
            --env "GHCR_USER=${GHCR_USER}" \
            --timeout-seconds 2400 \
            --comment "publish ${RELEASE_TAG} from prod to Beijing COS" \
            | tee cn-image-publish.log
          # Last JSON object from publish-docker stdout becomes the receipt.
          python3 - <<'PY'
          import json, pathlib, re
          text = pathlib.Path("cn-image-publish.log").read_text()
          objs = []
          decoder = json.JSONDecoder()
          for match in re.finditer(r"\{", text):
              try:
                  obj, _ = decoder.raw_decode(text[match.start():])
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict) and "archive_sha256" in obj:
                  objs.append(obj)
          if not objs:
              raise SystemExit("publish-from-prod produced no archive receipt JSON")
          pathlib.Path("cn-image-publish.json").write_text(json.dumps(objs[-1], sort_keys=True) + "\n")
          print(json.dumps(objs[-1], sort_keys=True))
          PY
      - name: Render per-node private COS prewarm scripts
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install -q boto3
          python3 deploy/domestic/warm_fanout.py render-all \
            --manifest deploy/domestic/prod-target.json \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --transport s3 \
            --channel tat \
            --render-out "cn-image-render.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cn-image-publish-receipts
          path: |
            cn-image-publish.json
            cn-image-publish.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: cn-image-render
          path: cn-image-render.json
          if-no-files-found: error
          retention-days: 1

  warm:
    needs: [resolve, publish, publish-from-prod]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish-from-prod.result == 'success') &&
      needs.resolve.outputs.transport != 'ghcr'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: tencent-ops
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Tencent remote execution CLI
        run: python3 -m pip install 'tccli==3.1.198.1'
      - uses: actions/download-artifact@v8
        with:
          name: cn-image-render
          path: cn-image-render
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Prewarm every cn-prod app node
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 deploy/domestic/warm_fanout.py dispatch-rendered \
            --manifest deploy/domestic/prod-target.json \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --transport s3 \
            --channel tat \
            --render-file cn-image-render/cn-image-render.json \
            --receipt-out cn-image-warm.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cn-image-warm-receipt
          path: cn-image-warm.json
          if-no-files-found: warn
          retention-days: 7

  warm-ghcr:
    needs: resolve
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.transport == 'ghcr' &&
      needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    # Beijing→GHCR can be slow; app-b 1.8.381 hit the old 20m TAT budget mid-pull.
    timeout-minutes: 90
    environment: tencent-ops
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Tencent remote execution CLI and crane
        run: |
          python3 -m pip install 'tccli==3.1.198.1'
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prewarm every cn-prod app node from GHCR
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          DIGEST="$(crane digest --platform=linux/amd64 "${REPO}:${RELEASE_TAG}")"
          echo "amd64_digest=${DIGEST}"
          python3 deploy/domestic/warm_fanout.py warm-all \
            --manifest deploy/domestic/prod-target.json \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" \
            --transport ghcr \
            --channel tat \
            --repository "$REPO" \
            --digest "$DIGEST" \
            --timeout 3600 \
            --receipt-out cn-image-warm.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cn-image-warm-receipt
          path: cn-image-warm.json
          if-no-files-found: warn
          retention-days: 7
