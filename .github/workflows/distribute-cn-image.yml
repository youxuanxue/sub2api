name: Distribute cn-prod image
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Backfill / retry after a failed publish (e.g. verify_archive bug on 1.8.310).
  # Always runs default-branch code; only the release-run artifact supplies tag/revision.
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release run id that uploaded cn-image-source
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
  id-token: write
concurrency:
  group: cn-prod-image-distribution
  cancel-in-progress: false
jobs:
  prewarm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Trusted default-branch code only; the downloaded artifact is validated data.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Require referenced Release run succeeded
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "release_run_id must be a numeric Actions run id" >&2
            exit 1
          fi
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          conclusion="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')"
          path="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("path") or "")')"
          if [[ "$conclusion" != "success" ]]; then
            echo "release_run_id=${RELEASE_RUN_ID} conclusion=${conclusion:-none}; want success" >&2
            exit 1
          fi
          if [[ "$path" != ".github/workflows/release.yml" ]]; then
            echo "release_run_id=${RELEASE_RUN_ID} path=${path}; want .github/workflows/release.yml" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: cn-image-source
          path: release-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.release_run_id || github.event.workflow_run.id }}
      - name: Validate release source against the git tag
        id: source
        run: |
          python3 deploy/domestic/image_distribution.py resolve \
            --source-file release-source/cn-image-source.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image transfer tools
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          python3 -m pip install boto3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Publish verified cn-prod image archive
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          python3 deploy/domestic/image_distribution.py publish \
            --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" \
            --repository "ghcr.io/${GITHUB_REPOSITORY,,}" > cn-image-publish.json
      - name: Prewarm cn-prod through SSM
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          CN_PROD_SSM_TIMEOUT_SECONDS: '1260'
          CN_PROD_SSM_EXECUTION_TIMEOUT: '1200'
        run: |
          set -euo pipefail
          bash deploy/domestic/deploy_via_ssm.sh pull \
            --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" > cn-image-warm.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cn-image-distribution-receipts
          path: cn-image-*.json
          if-no-files-found: warn
          retention-days: 7
