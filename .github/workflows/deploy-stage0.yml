name: Stage0 Deploy

# Wraps the SSM SOP in deploy/aws/README.md § 生产升级 SOP so cloud agents
# can drive deploy end-to-end. Design + IAM + setup: see
# docs/approved/deploy-stage0-workflow.md.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "deploy changes prod; replay prepares inactive prod color and serially verifies account-supply cases without cutover; smoke-only probes the API."
        required: true
        type: choice
        options:
          - deploy
          - replay
          - smoke-only
        default: deploy
      tag:
        description: "Released image tag without leading v (e.g. 1.6.0). In smoke-only mode this is an audit label; no image is changed."
        required: true
        type: string
      replay_receipt:
        description: "Only after human approval: green replay receipt SHA256 to promote the tested candidate and run the complete deploy checks."
        required: false
        type: string
        default: ""
      replace_receipt:
        description: "Replay only: SHA256 of the existing prepared candidate to replace without cutover."
        required: false
        type: string
        default: ""
      simple_release_override:
        description: "⚠️ Allow deploy of a single-arch (amd64-only) :latest manifest. Default false; flip ONLY if the prod Stage0 host is amd64. Today prod runs AWS Graviton t4g (arm64) — flipping this WILL crash with exec format error."
        required: false
        type: boolean
        default: false
      ssot_models:
        description: "Optional comma/space-separated model IDs. smoke-only runs the focused universal-key SSOT gate for exactly these models; empty keeps the platform canary."
        required: false
        type: string
        default: ""

# Default to read-only. Deploy/replay explicitly opt into AWS OIDC and package
# access; smoke-only cannot obtain either capability.
permissions:
  contents: read

# Queue concurrent prod deploy requests; do not cancel an in-flight run.
concurrency:
  group: deploy-stage0-prod
  cancel-in-progress: false

jobs:
  release-contract:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.contract.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.tag }}
          path: qa-target-release
          fetch-depth: 1
      - name: Classify target runtime contract
        id: contract
        run: python3 ops/stage0/prod_release_plan.py --operation classify --rollout qa-target-release/ops/qa/deploy_rollout.yaml >> "$GITHUB_OUTPUT"

  replay:
    if: inputs.operation == 'replay'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
      packages: read
    timeout-minutes: 120
    env:
      AWS_REGION: us-east-1
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Validate replay release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"
          bash ops/stage0/verify_ghcr_manifest.sh "$INPUT_TAG" false
          python3 scripts/checks/bluegreen-migration-safety.py --release-tag "$INPUT_TAG"
      - name: Configure prod replay credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prepare prod and verify account-supply cases without cutover
        env:
          REPLACE_RECEIPT: ${{ inputs.replace_receipt }}
        run: python3 scripts/stage0/replay-prod-release.py --target prod --tag "$INPUT_TAG" --replace-receipt "$REPLACE_RECEIPT" --out replay-output
      - name: Upload sanitized replay receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prod-replay-receipt
          path: replay-output/replay-*.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: inputs.operation == 'deploy'
    needs: release-contract
    concurrency:
      group: ${{ needs.release-contract.outputs.mode == 'legacy_rollback' && 'prod-qa-lifecycle' || 'prod-gateway-compatible' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    # Bound well above a normal prod SSM upgrade (~5-10 min) but far below the
    # 6h GHA default, so a hung describe-stacks / health-poll can't hold the
    # cancel-in-progress:false prod concurrency lock for hours.
    timeout-minutes: 40
    # GitHub Environment binding for prod only:
    #   1. Adds environment:prod to the OIDC sub claim (IAM trust in cicd-oidc.yaml).
    #   2. Pauses for Required reviewers when configured on the prod Environment.
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_OVERRIDE: ${{ inputs.simple_release_override }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate tag + resolve stack name
        id: stack
        run: |
          set -euo pipefail
          # Tag-format gate: single source of truth shared with the two Edge
          # deploy workflows (prevents the regex/message drift that had already
          # crept into deploy-edge-lightsail-stage0.yml).
          bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "::error::AWS_OIDC_ROLE_ARN repo variable not set; configure per docs/approved/deploy-stage0-workflow.md §5"
            exit 1
          fi
          NAME="${{ vars.PROD_STACK_NAME || 'tokenkey-prod-stage0' }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Validate prod smoke secrets (before touching prod)
        # Fail fast BEFORE the SSM image swap: a missing smoke secret is a config
        # error, not a deploy failure. Validating here (instead of inside the
        # post-deploy smoke step that runs AFTER the SSM image swap means a
        # missing secret never leaves a freshly-swapped image live behind a red
        # "smoke" run that actually means "secret not configured".
        env:
          TK_SMOKE_API_KEY: ${{ secrets.TK_SMOKE_API_KEY }}
          TK_FULLTEST_KEY: ${{ secrets.TK_FULLTEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TK_SMOKE_API_KEY:-}" ]; then
            echo "::error::TK_SMOKE_API_KEY is not set in prod Environment."
            echo "Add one all-capability TokenKey user API key (sk-...) that can see every smoke model list."
            echo "See deploy/aws/README.md (Smoke config) and docs/approved/deploy-stage0-workflow.md §5."
            exit 1
          fi
          if [ -z "${TK_FULLTEST_KEY:-}" ]; then
            echo "::error::TK_FULLTEST_KEY is not set in prod Environment."
            echo "Add the universal key used by SSOT display gate probes (ops/test/gateway_model_ssot_matrix.py gate)."
            exit 1
          fi

      - name: Verify GHCR multi-arch manifest
        # Shared with deploy-edge-lightsail-stage0.yml so prod and Edge never
        # grow divergent image-architecture gates.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/stage0/verify_ghcr_manifest.sh "$INPUT_TAG" "$INPUT_OVERRIDE"

      - name: Blue/green migration safety gate
        # The target app can apply migrations while the old app is still serving
        # existing requests on the same prod DB. Advisory locks serialize
        # migration execution, but they do not make destructive schema changes
        # compatible with old code, so fail closed before touching prod.
        run: python3 scripts/checks/bluegreen-migration-safety.py --release-tag "$INPUT_TAG"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve target instance + api domain
        id: instance
        env:
          STACK_NAME: ${{ steps.stack.outputs.name }}
          CICD_OIDC_STACK_NAME: ${{ vars.CICD_OIDC_STACK_NAME || 'tokenkey-cicd-oidc' }}
        run: |
          set -euo pipefail
          read -r ID API_URL < <(
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query 'Stacks[0].Outputs' --output json |
            python3 -c 'import json, sys; rows=json.load(sys.stdin); m={r.get("OutputKey"): r.get("OutputValue", "") for r in rows}; print(m.get("InstanceId", ""), m.get("ApiUrl", ""))'
          )
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "::error::could not resolve InstanceId from stack $STACK_NAME"
            exit 1
          fi
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "::error::could not resolve ApiUrl from stack $STACK_NAME"
            exit 1
          fi
          API_HOST="${API_URL#https://}"
          if [ "$API_HOST" = "$API_URL" ] || [ -z "$API_HOST" ]; then
            echo "::error::ApiUrl must be one HTTPS origin"
            exit 1
          fi
          browser_origin="$API_URL"
          if [[ "$API_HOST" == api.* ]]; then
            browser_origin="https://${API_HOST#api.}"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "browser_origin=$browser_origin" >> "$GITHUB_OUTPUT"
          echo "deploying ${INPUT_TAG} to instance=$ID api=$API_URL (env=prod stack=$STACK_NAME)"

      - name: Resolve previous prod runtime tag
        id: previous_runtime
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(bash ops/stage0/resolve-prod-running-tag-via-ssm.sh --instance-id "$INSTANCE_ID")"
          test -n "$PREVIOUS_TAG"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "prod runtime baseline: $PREVIOUS_TAG"

      - name: Checkout target-tag host artifacts
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.tag }}
          path: qa-target-release
          fetch-depth: 1

      - name: Validate Gemini Web relay declarations before deployment
        # Older rollback targets do not consume this capability declaration.
        if: hashFiles('qa-target-release/backend/internal/service/gemini_web_request_tk.go') != ''
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          bash ops/observability/run-probe.sh --target prod \
            --expected-instance-id "$INSTANCE_ID" \
            --script ops/observability/probe-gemini-web-relay-declarations.sh

      - name: Read legacy rollback maintenance pin
        if: needs.release-contract.outputs.mode == 'legacy_rollback'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: python3 ops/stage0/prod_release_state.py read --instance-id "$INSTANCE_ID" --output .prod-release-state.json

      - name: Validate legacy QA credentials
        if: needs.release-contract.outputs.mode == 'legacy_rollback'
        env:
          QA_INFRA_OIDC_ROLE_ARN: ${{ vars.QA_INFRA_OIDC_ROLE_ARN }}
        run: test -n "$QA_INFRA_OIDC_ROLE_ARN"

      - name: Configure QA credentials for legacy Worker verification
        if: needs.release-contract.outputs.mode == 'legacy_rollback'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.QA_INFRA_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify preserved legacy Worker
        if: needs.release-contract.outputs.mode == 'legacy_rollback'
        id: legacy_worker
        env:
          QA_RAW_ARCHIVE_STACK: ${{ vars.QA_RAW_ARCHIVE_STACK || 'tokenkey-prod-qa-raw-archive' }}
          QA_BUNDLE_VERIFY_MODE: discovery
        run: bash ops/qa/verify_qa_bundle_infra.sh

      - name: Plan legacy rollback without changing QA pins
        if: needs.release-contract.outputs.mode == 'legacy_rollback'
        env:
          PREVIOUS_GATEWAY_TAG: ${{ steps.previous_runtime.outputs.tag }}
          VERIFIED_WORKER_IMAGE: ${{ steps.legacy_worker.outputs.worker_image }}
        run: |
          python3 ops/stage0/prod_release_plan.py --target "$INPUT_TAG" --gateway "$PREVIOUS_GATEWAY_TAG" \
            --worker "$VERIFIED_WORKER_IMAGE" --state .prod-release-state.json \
            --rollout qa-target-release/ops/qa/deploy_rollout.yaml --output .prod-release-plan.json

      - name: Restore Stage0 credentials for legacy host safety
        if: needs.release-contract.outputs.mode == 'legacy_rollback'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pause DROP before legacy gateway mutation
        id: legacy_pause
        if: needs.release-contract.outputs.mode == 'legacy_rollback'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: python3 ops/stage0/prod_release_state.py pause --instance-id "$INSTANCE_ID" --plan .prod-release-plan.json

      - name: Disable Boundary before legacy gateway mutation
        id: legacy_boundary
        if: needs.release-contract.outputs.mode == 'legacy_rollback'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          QA_BOUNDARY_TIMER_STATE: disabled
          STAGE0_SSM_OUTPUT_DIR: .qa-boundary-legacy-safety
        run: bash ops/stage0/sync-qa-boundary-timer-via-ssm.sh "$INSTANCE_ID" "legacy gateway rollback safety"

      - name: Resolve QA producer coordinates (read-only)
        id: qa_coordinates
        env:
          QA_STACK_NAME: ${{ vars.QA_RAW_ARCHIVE_STACK || 'tokenkey-prod-qa-raw-archive' }}
        run: |
          python3 ops/qa/resolve_qa_bundle_coordinates.py --stack "$QA_STACK_NAME" \
            --region "$AWS_REGION" --github-output "$GITHUB_OUTPUT"

      - name: Validate human-approved replay receipt
        if: inputs.replay_receipt != ''
        id: replay_gate
        env:
          APPROVED_REPLAY: ${{ inputs.replay_receipt }}
        run: |
          set -euo pipefail
          python3 scripts/stage0/replay-prod-release.py --tag "$INPUT_TAG" --approved-replay "$APPROVED_REPLAY"

      - name: Deploy via SSM Run-Command
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STAGE0_SSM_OUTPUT_DIR: .
          QA_BUNDLE_ENABLED: "true"
          QA_BUNDLE_QUEUE_URL: ${{ steps.qa_coordinates.outputs.queue_url }}
          QA_BUNDLE_STORAGE_DRIVER: s3
          QA_BUNDLE_STORAGE_REGION: ${{ env.AWS_REGION }}
          QA_BUNDLE_STORAGE_BUCKET: ${{ steps.qa_coordinates.outputs.bucket }}
          QA_BUNDLE_STORAGE_PREFIX: user-qa
          STAGE0_BLUEGREEN_WAIT_PHASE: cutover
          STAGE0_BLUEGREEN_STAGE: ${{ inputs.replay_receipt != '' && 'promote' || 'deploy' }}
          STAGE0_BLUEGREEN_APPROVED_RECEIPT: ${{ steps.replay_gate.outputs.prepared_receipt }}
          STAGE0_BLUEGREEN_APPROVED_REPLAY: ${{ inputs.replay_receipt }}
        run: bash ops/stage0/deploy_via_ssm_bluegreen.sh "$INPUT_TAG" "$INSTANCE_ID" "deploy-stage0 env=prod bluegreen"

      - name: External health check
        env:
          API_URL: ${{ steps.instance.outputs.api_url }}
        run: bash ops/stage0/external_health.sh "$API_URL"

      - name: Post-deploy gateway smoke (API + Claude paths)
        env:
          TOKENKEY_BASE_URL: ${{ steps.instance.outputs.api_url }}
          TK_SMOKE_API_KEY: ${{ secrets.TK_SMOKE_API_KEY }}
          TK_SMOKE_ANTHROPIC_MODELS: ${{ vars.TK_SMOKE_ANTHROPIC_MODELS || 'claude-sonnet-4-6' }}
          TK_SMOKE_GEMINI_MODELS: ${{ vars.TK_SMOKE_GEMINI_MODELS || '' }}
          TK_SMOKE_OPENAI_OAUTH_MODELS: ${{ vars.TK_SMOKE_OPENAI_OAUTH_MODELS || 'gpt-5.4' }}
        run: bash ops/stage0/post_deploy_smoke.sh

      - name: Post-deploy global candidate contract
        run: python3 ops/observability/probe-global-candidate.py --phase candidate

      - name: Post-deploy SSOT display gate (deploy canary)
        env:
          TOKENKEY_BASE_URL: ${{ steps.instance.outputs.api_url }}
          TK_FULLTEST_KEY: ${{ secrets.TK_FULLTEST_KEY }}
          TK_FULLTEST_TIMEOUT: "15"
        run: bash ops/observability/endpoint-compat-audit.sh --ssot-model-matrix --gate --deploy-canary --deploy-closeout

      - name: Assert live-host state (drift check)
        # ADVISORY ONLY — never blocks the deploy. Reads (read-only) the running
        # active app container image tag and warns if the live host drifted from
        # what this deploy intended.
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          GATEWAY_TAG: ${{ inputs.tag }}
        run: bash ops/stage0/assert-live-host-state.sh "$INSTANCE_ID" "$GATEWAY_TAG" "deploy-stage0 live-host assert env=prod"

      - name: Sync Feishu alert config
        # Inject the shared Feishu webhook/secret into prod's
        # ops_email_notification_config and enable alerting (idempotent). The
        # script verifies the write and exits non-zero if not applied, so a node
        # that cannot alert FAILS the deploy (gate for the us7 silent-mute gap).
        env:
          TK_FEISHU_WEBHOOK_URL: ${{ secrets.TK_FEISHU_WEBHOOK_URL }}
          TK_FEISHU_SIGNING_SECRET: ${{ secrets.TK_FEISHU_SIGNING_SECRET }}
        run: bash ops/stage0/sync-feishu-config.sh prod

      # Same deploy job: reuse the already-approved prod Environment + OIDC.
      # A second job with environment: prod would re-open Required reviewers
      # and start the +5min clock after that gate, not after cutover.
      - name: Plan checks from live→new PRs
        id: post_release_plan
        env:
          LIVE_TAG: ${{ steps.previous_runtime.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "${LIVE_TAG:-}" || { echo "::error::previous prod runtime tag is empty"; exit 1; }
          git fetch --tags --force origin
          git fetch --unshallow origin || true
          OUT_DIR="${RUNNER_TEMP}/post-release-check"
          mkdir -p "$OUT_DIR"
          python3 scripts/release_post_check.py plan --live "$LIVE_TAG" --new "$INPUT_TAG" > "$OUT_DIR/plan.json"
          COUNT="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("changes") or []))' "$OUT_DIR/plan.json")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "planned $COUNT product change(s) in ${LIVE_TAG}..${INPUT_TAG}"
          if [ "$COUNT" = "0" ]; then
            python3 -c 'import json,sys; json.dump({"verdict":"skip","reason":"no product commits","range":{"live":sys.argv[1],"new":sys.argv[2]},"changes":[],"checks":[]}, open(sys.argv[3],"w"), indent=2)' \
              "$LIVE_TAG" "$INPUT_TAG" "$OUT_DIR/evaluate.json"
          fi

      # Coverage planning is offline and advisory; paid execution is explicit.
      - name: Plan gateway capability checks
        env:
          CAPABILITY_PREVIOUS_TAG: ${{ steps.previous_runtime.outputs.tag }}
        continue-on-error: true  # preflight-allow: advisory offline capability report; no deployment gate
        run: |
          set -euo pipefail
          git -C qa-target-release fetch --no-tags --depth=1 origin "refs/tags/v${CAPABILITY_PREVIOUS_TAG}:refs/tags/v${CAPABILITY_PREVIOUS_TAG}"
          bash qa-target-release/scripts/stage0/check-gateway-capabilities.sh "${RUNNER_TEMP}/gateway-capabilities"
      - name: Upload gateway capability plan
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-capability-plan
          path: ${{ runner.temp }}/gateway-capabilities/*.json
          if-no-files-found: warn

      - name: Check PR hooks immediately
        if: steps.post_release_plan.outputs.count != '' && steps.post_release_plan.outputs.count != '0'
        id: post_release_immediate
        continue-on-error: true  # preflight-allow: swallow; final verdict gate runs after both phases
        env:
          LIVE_TAG: ${{ steps.previous_runtime.outputs.tag }}
          OUT_DIR: ${{ steps.post_release_plan.outputs.out_dir }}
          OBSERVATION_SINCE: ${{ steps.ssm.outputs.cutover_at }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/immediate"
          bash ops/observability/run-post-release-check.sh \
            --live "$LIVE_TAG" \
            --new "$INPUT_TAG" \
            --target prod \
            --phase immediate \
            --since "$OBSERVATION_SINCE" \
            --plan-file "$OUT_DIR/plan.json" \
            --out-dir "$OUT_DIR/immediate"

      - name: Wait until 5 minutes after cutover
        env:
          OBSERVATION_SINCE: ${{ steps.ssm.outputs.cutover_at }}
        run: |
          set -euo pipefail
          python3 scripts/release_post_check.py wait \
            --since "$OBSERVATION_SINCE" \
            --minimum-seconds 300

      - name: Check traffic and 5xx after 5 minutes
        if: steps.post_release_plan.outputs.count != '' && steps.post_release_plan.outputs.count != '0'
        id: post_release_check
        continue-on-error: true  # preflight-allow: swallow; final verdict gate runs after summary
        env:
          LIVE_TAG: ${{ steps.previous_runtime.outputs.tag }}
          OUT_DIR: ${{ steps.post_release_plan.outputs.out_dir }}
          OBSERVATION_SINCE: ${{ steps.ssm.outputs.cutover_at }}
        run: |
          set -euo pipefail
          bash ops/observability/run-post-release-check.sh \
            --live "$LIVE_TAG" \
            --new "$INPUT_TAG" \
            --target prod \
            --phase delayed \
            --since "$OBSERVATION_SINCE" \
            --plan-file "$OUT_DIR/plan.json" \
            --out-dir "$OUT_DIR"

      - name: Post-release check summary
        if: always() && steps.post_release_plan.outcome != 'skipped'
        env:
          LIVE_TAG: ${{ steps.previous_runtime.outputs.tag }}
          OUT_DIR: ${{ steps.post_release_plan.outputs.out_dir }}
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${OUT_DIR:-${RUNNER_TEMP}/missing-post-release-check}"
          python3 scripts/release_post_check.py summary \
            --immediate-evaluation-file "$EVIDENCE_DIR/immediate/evaluate.json" \
            --evaluation-file "$EVIDENCE_DIR/evaluate.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce post-release verdicts
        if: always() && steps.post_release_plan.outputs.count != '' && steps.post_release_plan.outputs.count != '0'
        env:
          OUT_DIR: ${{ steps.post_release_plan.outputs.out_dir }}
        run: |
          set -euo pipefail
          python3 scripts/release_post_check.py gate \
            --immediate-evaluation-file "$OUT_DIR/immediate/evaluate.json" \
            --evaluation-file "$OUT_DIR/evaluate.json"

      - name: Join gateway deployment and old request drain
        if: always() && steps.ssm.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          DEPLOY_COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          DEPLOY_TOKEN: ${{ steps.ssm.outputs.deploy_token }}
        run: |
          python3 ops/stage0/bluegreen_completion.py complete --instance-id "$INSTANCE_ID" \
            --command-id "$DEPLOY_COMMAND_ID" --token "$DEPLOY_TOKEN" --tag "$INPUT_TAG"

      - name: Notify Feishu (release rollout)
        # Best-effort 发版公告。只在 prod 换镜像 + external health + smoke +
        # immediate hooks +5min traffic post-release（green 或 skip）之后才跑 ——
        # 卡片 == 该版本已上线且烟测与 live→new PR 实测均通过（或无可测产品提交）。
        # 标 continue-on-error 让 webhook 抽风不把成功的 prod deploy 标红(对齐
        # release.yml 的 Telegram 步)。脚本本身也始终 exit 0(双保险),失败时
        # 打 ::warning::,绝不打印 webhook/secret。
        continue-on-error: true  # preflight-allow: swallow
        env:
          TK_FEISHU_WEBHOOK_URL: ${{ secrets.TK_FEISHU_WEBHOOK_URL }}
          TK_FEISHU_SIGNING_SECRET: ${{ secrets.TK_FEISHU_SIGNING_SECRET }}
          API_URL: ${{ steps.instance.outputs.api_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Feishu rollout notes describe what changed since the tag that was
          # actually serving before this deploy. collect-feishu-release-notes.sh
          # unshallows the fetch-depth:1 clone so git log A..B is walkable
          # (fetching only the two tag tips is not enough). Empty notes omit
          # 「本次更新」; do not inline git log here.
          PREVIOUS_TAG="${{ steps.previous_runtime.outputs.tag }}"
          NOTES="$(bash ops/stage0/collect-feishu-release-notes.sh "$PREVIOUS_TAG" "$INPUT_TAG")"
          bash ops/stage0/notify-feishu-release.sh "$INPUT_TAG" "$API_URL" \
            --previous-tag "$PREVIOUS_TAG" --run-url "$RUN_URL" --notes "$NOTES"

      - name: Job summary
        if: always()
        env:
          RELEASE_MODE: ${{ needs.release-contract.outputs.mode }}
          LEGACY_WORKER_OUTCOME: ${{ steps.legacy_worker.outcome }}
          LEGACY_PAUSE_OUTCOME: ${{ steps.legacy_pause.outcome }}
          LEGACY_BOUNDARY_OUTCOME: ${{ steps.legacy_boundary.outcome }}
          API_URL: ${{ steps.instance.outputs.api_url }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STACK_NAME: ${{ steps.stack.outputs.name }}
          CMD_ID: ${{ steps.ssm.outputs.command_id }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "## deploy-stage0"
            if [ "$RELEASE_MODE" = legacy_rollback ]; then
              printf -- '- legacy safety: Worker verification=%s; DROP pause=%s; Boundary disable=%s\n' "$LEGACY_WORKER_OUTCOME" "$LEGACY_PAUSE_OUTCOME" "$LEGACY_BOUNDARY_OUTCOME"
              echo '- Successful legacy rollback keeps QA degraded until compatible QA acceptance.'
            fi
            echo "- environment: \`prod\`"
            echo "- app image: \`ghcr.io/youxuanxue/sub2api:${INPUT_TAG}\`"
            echo "- stack: \`$STACK_NAME\`"
            echo "- instance: \`$INSTANCE_ID\`"
            echo "- api: $API_URL"
            echo "- ssm command id: \`${CMD_ID:-none}\`"
            echo
            echo "Rollback: re-dispatch with a previous tag."
            echo
            echo '```bash'
            echo "gh workflow run deploy-stage0.yml -f tag=<previous>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-only:
    if: inputs.operation == 'smoke-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
    env:
      INPUT_TAG: ${{ inputs.tag }}
      TOKENKEY_BASE_URL: ${{ vars.PROD_API_URL || 'https://api.tokenkey.dev' }}
      TK_FULLTEST_BASE_URL: ${{ vars.PROD_API_URL || 'https://api.tokenkey.dev' }}
      INPUT_SSOT_MODELS: ${{ inputs.ssot_models }}
      GATEWAY_SMOKE_SUITE: full
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate smoke audit tag
        run: bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"

      - name: Validate prod smoke secrets
        env:
          TK_SMOKE_API_KEY: ${{ secrets.TK_SMOKE_API_KEY }}
          TK_FULLTEST_KEY: ${{ secrets.TK_FULLTEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TK_SMOKE_API_KEY:-}" ]; then
            echo "::error::TK_SMOKE_API_KEY is not set in prod Environment."
            exit 1
          fi
          if [ -z "${TK_FULLTEST_KEY:-}" ]; then
            echo "::error::TK_FULLTEST_KEY is not set in prod Environment."
            exit 1
          fi

      - name: Prod gateway smoke (read-only acceptance)
        id: gateway_smoke
        env:
          TK_SMOKE_API_KEY: ${{ secrets.TK_SMOKE_API_KEY }}
          TK_SMOKE_ANTHROPIC_MODELS: ${{ vars.TK_SMOKE_ANTHROPIC_MODELS || 'claude-sonnet-4-6' }}
          TK_SMOKE_GEMINI_MODELS: ${{ vars.TK_SMOKE_GEMINI_MODELS || '' }}
          TK_SMOKE_OPENAI_OAUTH_MODELS: ${{ vars.TK_SMOKE_OPENAI_OAUTH_MODELS || 'gpt-5.4' }}
        run: |
          set -euo pipefail
          bash ops/stage0/post_deploy_smoke.sh

      - name: Prod SSOT display gate (read-only acceptance)
        id: ssot_gate
        env:
          TK_FULLTEST_KEY: ${{ secrets.TK_FULLTEST_KEY }}
          TK_FULLTEST_TIMEOUT: "15"
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SSOT_MODELS//[[:space:]]/}" ]]; then
            python3 scripts/checks/ssot-delta-gate.py focused --models "$INPUT_SSOT_MODELS"
          else
            bash ops/observability/endpoint-compat-audit.sh --ssot-model-matrix --gate --deploy-canary --deploy-closeout
          fi

      - name: Job summary
        if: always()
        env:
          GATEWAY_SMOKE_OUTCOME: ${{ steps.gateway_smoke.outcome }}
          SSOT_GATE_OUTCOME: ${{ steps.ssot_gate.outcome }}
        run: |
          {
            echo "## deploy-stage0"
            echo '- operation: `smoke-only`'
            echo '- environment: `prod`'
            echo "- audit tag: \`${INPUT_TAG}\`"
            echo "- api: ${TOKENKEY_BASE_URL}"
            echo "- gateway smoke: ${GATEWAY_SMOKE_OUTCOME:-not-run}"
            echo "- SSOT display gate: ${SSOT_GATE_OUTCOME:-not-run}"
            echo "- focused SSOT models: ${INPUT_SSOT_MODELS:-platform-canary}"
            echo "- safety: no image or host state was changed"
          } >> "$GITHUB_STEP_SUMMARY"
