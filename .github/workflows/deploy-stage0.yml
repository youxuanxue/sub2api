name: Stage0 Deploy

# Wraps the SSM SOP in deploy/aws/README.md § 生产升级 SOP so cloud agents
# can drive deploy end-to-end. Design + IAM + setup: see
# docs/approved/deploy-stage0-workflow.md.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "deploy changes prod; replay prepares inactive prod color and runs retained-traffic replay without cutover; smoke-only probes the API; qa-infra-check verifies QA OIDC/IAM readiness without mutation."
        required: true
        type: choice
        options:
          - deploy
          - replay
          - smoke-only
          - qa-infra-check
        default: deploy
      tag:
        description: "Released image tag without leading v (e.g. 1.6.0). In smoke-only and qa-infra-check modes this is an audit label; no image is changed."
        required: true
        type: string
      replay_receipt:
        description: "Only after human approval: green replay receipt SHA256 to promote the tested candidate and run the complete deploy checks."
        required: false
        type: string
        default: ""
      replace_receipt:
        description: "Replay only: SHA256 of the existing prepared candidate to replace without cutover."
        required: false
        type: string
        default: ""
      simple_release_override:
        description: "⚠️ Allow deploy of a single-arch (amd64-only) :latest manifest. Default false; flip ONLY if the prod Stage0 host is amd64. Today prod runs AWS Graviton t4g (arm64) — flipping this WILL crash with exec format error."
        required: false
        type: boolean
        default: false
      ssot_models:
        description: "Optional comma/space-separated model IDs. smoke-only runs the focused universal-key SSOT gate for exactly these models; empty keeps the platform canary."
        required: false
        type: string
        default: ""

# Default to read-only. Deploy/replay explicitly opt into AWS OIDC and package
# access; smoke-only cannot obtain either capability.
permissions:
  contents: read

# Queue concurrent prod deploy requests; do not cancel an in-flight run.
concurrency:
  group: deploy-stage0-prod
  cancel-in-progress: false

jobs:
  replay:
    if: inputs.operation == 'replay'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
      packages: read
    timeout-minutes: 120
    env:
      AWS_REGION: us-east-1
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Validate replay release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"
          bash ops/stage0/verify_ghcr_manifest.sh "$INPUT_TAG" false
          python3 scripts/checks/bluegreen-migration-safety.py --release-tag "$INPUT_TAG"
      - name: Configure prod replay credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prepare prod and replay retained requests without cutover
        env:
          REPLACE_RECEIPT: ${{ inputs.replace_receipt }}
        run: python3 scripts/stage0/replay-prod-release.py --target prod --tag "$INPUT_TAG" --replace-receipt "$REPLACE_RECEIPT" --out replay-output
      - name: Upload sanitized replay receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prod-replay-receipt
          path: replay-output/replay-receipt.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    # Bound well above a normal prod SSM upgrade (~5-10 min) but far below the
    # 6h GHA default, so a hung describe-stacks / health-poll can't hold the
    # cancel-in-progress:false prod concurrency lock for hours.
    timeout-minutes: 40
    # GitHub Environment binding for prod only:
    #   1. Adds environment:prod to the OIDC sub claim (IAM trust in cicd-oidc.yaml).
    #   2. Pauses for Required reviewers when configured on the prod Environment.
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      QA_INFRA_OIDC_ROLE_ARN: ${{ vars.QA_INFRA_OIDC_ROLE_ARN }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_OVERRIDE: ${{ inputs.simple_release_override }}
      # Single desired-state owner for the prod-only QA Bundle host config.
      # Infrastructure coordinates come only from the verified stack outputs.
      QA_BUNDLE_ENABLED: "true"
      QA_BUNDLE_STORAGE_DRIVER: "s3"
      QA_BUNDLE_STORAGE_PREFIX: "user-qa"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate tag + resolve stack name
        id: stack
        run: |
          set -euo pipefail
          # Tag-format gate: single source of truth shared with the two Edge
          # deploy workflows (prevents the regex/message drift that had already
          # crept into deploy-edge-lightsail-stage0.yml).
          bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"
          if [ -z "${OIDC_ROLE_ARN:-}" ]; then
            echo "::error::AWS_OIDC_ROLE_ARN repo variable not set; configure per docs/approved/deploy-stage0-workflow.md §5"
            exit 1
          fi
          if [ -z "${QA_INFRA_OIDC_ROLE_ARN:-}" ]; then
            echo "::error::QA_INFRA_OIDC_ROLE_ARN repo variable not set; QA Bundle infrastructure cannot be gated before prod mutation."
            exit 1
          fi
          NAME="${{ vars.PROD_STACK_NAME || 'tokenkey-prod-stage0' }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Validate prod smoke secrets (before touching prod)
        # Fail fast BEFORE the SSM image swap: a missing smoke secret is a config
        # error, not a deploy failure. Validating here (instead of inside the
        # post-deploy smoke step that runs AFTER the SSM image swap means a
        # missing secret never leaves a freshly-swapped image live behind a red
        # "smoke" run that actually means "secret not configured".
        env:
          TK_SMOKE_API_KEY: ${{ secrets.TK_SMOKE_API_KEY }}
          TK_FULLTEST_KEY: ${{ secrets.TK_FULLTEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TK_SMOKE_API_KEY:-}" ]; then
            echo "::error::TK_SMOKE_API_KEY is not set in prod Environment."
            echo "Add one all-capability TokenKey user API key (sk-...) that can see every smoke model list."
            echo "See deploy/aws/README.md (Smoke config) and docs/approved/deploy-stage0-workflow.md §5."
            exit 1
          fi
          if [ -z "${TK_FULLTEST_KEY:-}" ]; then
            echo "::error::TK_FULLTEST_KEY is not set in prod Environment."
            echo "Add the universal key used by SSOT display gate probes (ops/test/gateway_model_ssot_matrix.py gate)."
            exit 1
          fi

      - name: Verify GHCR multi-arch manifest
        # Shared with deploy-edge-lightsail-stage0.yml so prod and Edge never
        # grow divergent image-architecture gates.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/stage0/verify_ghcr_manifest.sh "$INPUT_TAG" "$INPUT_OVERRIDE"

      - name: Blue/green migration safety gate
        # The target app can apply migrations while the old app is still serving
        # existing requests on the same prod DB. Advisory locks serialize
        # migration execution, but they do not make destructive schema changes
        # compatible with old code, so fail closed before touching prod.
        run: python3 scripts/checks/bluegreen-migration-safety.py --release-tag "$INPUT_TAG"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve target instance + api domain
        id: instance
        env:
          STACK_NAME: ${{ steps.stack.outputs.name }}
          CICD_OIDC_STACK_NAME: ${{ vars.CICD_OIDC_STACK_NAME || 'tokenkey-cicd-oidc' }}
        run: |
          set -euo pipefail
          read -r ID API_URL < <(
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query 'Stacks[0].Outputs' --output json |
            python3 -c 'import json, sys; rows=json.load(sys.stdin); m={r.get("OutputKey"): r.get("OutputValue", "") for r in rows}; print(m.get("InstanceId", ""), m.get("ApiUrl", ""))'
          )
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "::error::could not resolve InstanceId from stack $STACK_NAME"
            exit 1
          fi
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "::error::could not resolve ApiUrl from stack $STACK_NAME"
            exit 1
          fi
          API_HOST="${API_URL#https://}"
          if [ "$API_HOST" = "$API_URL" ] || [ -z "$API_HOST" ]; then
            echo "::error::ApiUrl must be one HTTPS origin"
            exit 1
          fi
          browser_origin="$API_URL"
          if [[ "$API_HOST" == api.* ]]; then
            browser_origin="https://${API_HOST#api.}"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "browser_origin=$browser_origin" >> "$GITHUB_OUTPUT"
          resources="$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --output json)"
          physical_id() {
            jq -r --arg logical "$1" '.StackResources[] | select(.LogicalResourceId == $logical) | .PhysicalResourceId' <<<"$resources"
          }
          VPC_ID="$(physical_id VPC)"
          SUBNET_ID="$(physical_id PublicSubnet)"
          ROUTE_TABLE_ID="$(physical_id PublicRouteTable)"
          INSTANCE_ROLE_NAME="$(physical_id InstanceRole)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          SERVICE_ROLE_ARN="$(aws cloudformation describe-stacks --stack-name "$CICD_OIDC_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='QAInfraCloudFormationServiceRoleArn'].OutputValue | [0]" --output text)"
          for value in "$VPC_ID" "$SUBNET_ID" "$ROUTE_TABLE_ID" "$INSTANCE_ROLE_NAME" "$SERVICE_ROLE_ARN"; do
            if [ -z "$value" ] || [ "$value" = None ]; then
              echo "::error::QA infrastructure input could not be resolved before prod mutation"
              exit 1
            fi
          done
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"
          echo "route_table_id=$ROUTE_TABLE_ID" >> "$GITHUB_OUTPUT"
          echo "app_role_arn=arn:aws:iam::${ACCOUNT_ID}:role/${INSTANCE_ROLE_NAME}" >> "$GITHUB_OUTPUT"
          echo "qa_cfn_service_role_arn=$SERVICE_ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "deploying ${INPUT_TAG} to instance=$ID api=$API_URL (env=prod stack=$STACK_NAME)"

      - name: Resolve previous prod runtime tag
        id: previous_runtime
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(bash ops/stage0/resolve-prod-running-tag-via-ssm.sh --instance-id "$INSTANCE_ID")"
          test -n "$PREVIOUS_TAG"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "prod runtime baseline: $PREVIOUS_TAG"

      - name: Checkout target-tag QA contract and host artifacts
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.tag }}
          path: qa-target-release
          fetch-depth: 1

      - name: Read independently pinned prod component state
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: python3 ops/stage0/prod_release_state.py read --instance-id "$INSTANCE_ID" --output .prod-release-state.json

      - name: Verify target-tag QA release tree
        id: qa_target
        run: |
          set -euo pipefail
          test "$(git -C qa-target-release describe --tags --exact-match)" = "v${INPUT_TAG}"
          SHA="$(git -C qa-target-release rev-parse HEAD)"
          ROLLOUT=qa-target-release/ops/qa/deploy_rollout.yaml
          if [ ! -f "$ROLLOUT" ]; then
            ROLLOUT="$(mktemp)"
            printf 'prod:\n  user_export:\n    marker: legacy_release\n' > "$ROLLOUT"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "rollout=${ROLLOUT}" >> "$GITHUB_OUTPUT"

      - name: Configure QA infrastructure credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.QA_INFRA_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover existing QA Bundle Worker (read-only)
        id: qa_worker_discovery
        # Phase 3 bootstrap legitimately has no existing Bundle stack; legacy mode
        # still fails closed when the resolver receives no verified image.
        continue-on-error: true  # preflight-allow: swallow
        env:
          QA_RAW_ARCHIVE_STACK: ${{ vars.QA_RAW_ARCHIVE_STACK || 'tokenkey-prod-qa-raw-archive' }}
          QA_BUNDLE_VERIFY_MODE: discovery
          QA_BUNDLE_WORKER_DESIRED_COUNT: "1"
        run: bash ops/qa/verify_qa_bundle_infra.sh

      - name: Resolve QA infrastructure deploy inputs
        id: qa_infra
        env:
          QA_STACK_NAME: ${{ vars.QA_RAW_ARCHIVE_STACK || 'tokenkey-prod-qa-raw-archive' }}
          CONFIGURED_OPS_RECOVERY_PRINCIPAL_ARN: ${{ vars.QA_OPS_RECOVERY_PRINCIPAL_ARN }}
          VERIFIED_EXISTING_WORKER_IMAGE: ${{ steps.qa_worker_discovery.outputs.worker_image }}
          TARGET_ROLLOUT: ${{ steps.qa_target.outputs.rollout }}
          PREVIOUS_GATEWAY_TAG: ${{ steps.previous_runtime.outputs.tag }}
        run: |
          set -euo pipefail
          STACK_ERROR="$(mktemp)"
          trap 'rm -f "$STACK_ERROR"' EXIT
          if STACK_JSON="$(aws cloudformation describe-stacks --stack-name "$QA_STACK_NAME" --output json 2>"$STACK_ERROR")"; then
            EXISTING_WORKER_IMAGE="$(jq -r '.Stacks[0].Parameters[]? | select(.ParameterKey == "BundleWorkerImage") | .ParameterValue' <<<"$STACK_JSON")"
            if [ -n "$EXISTING_WORKER_IMAGE" ] && [ "$EXISTING_WORKER_IMAGE" != None ] && [ -z "$VERIFIED_EXISTING_WORKER_IMAGE" ]; then
              echo "::error::existing Bundle Worker discovery failed; refusing bootstrap fallback"
              exit 1
            fi
            OPS_RECOVERY_PRINCIPAL_ARN="$(jq -r '.Stacks[0].Parameters[]? | select(.ParameterKey == "OpsRecoveryPrincipalArn") | .ParameterValue' <<<"$STACK_JSON")"
            if [ -z "$OPS_RECOVERY_PRINCIPAL_ARN" ] || [ "$OPS_RECOVERY_PRINCIPAL_ARN" = None ]; then
              echo "::error::existing QA stack has no OpsRecoveryPrincipalArn parameter"
              exit 1
            fi
          else
            describe_rc=$?
            STACK_ERROR_TEXT="$(<"$STACK_ERROR")"
            if [[ "$STACK_ERROR_TEXT" == *"(ValidationError)"* && "$STACK_ERROR_TEXT" == *"does not exist"* ]]; then
              OPS_RECOVERY_PRINCIPAL_ARN="$CONFIGURED_OPS_RECOVERY_PRINCIPAL_ARN"
              if [ -z "$OPS_RECOVERY_PRINCIPAL_ARN" ]; then
                echo "::error::QA_OPS_RECOVERY_PRINCIPAL_ARN is required to create QA stack $QA_STACK_NAME"
                exit 1
              fi
            else
              cat "$STACK_ERROR" >&2
              echo "::error::could not inspect existing QA stack; refusing bootstrap fallback" >&2
              exit "$describe_rc"
            fi
          fi
          # prod_release_plan consumes qa_bundle_release_surface.py as the QA path owner.
          python3 ops/stage0/prod_release_plan.py --target "$INPUT_TAG" \
            --gateway "$PREVIOUS_GATEWAY_TAG" --worker "$VERIFIED_EXISTING_WORKER_IMAGE" \
            --state .prod-release-state.json --rollout "$TARGET_ROLLOUT" --output .prod-release-plan.json
          SURFACE_JSON="$(jq '{worker_surface_changed:.deploy_worker,publisher_surface_changed:.run_canary}' .prod-release-plan.json)"
          RESOLUTION="$(python3 ops/qa/resolve_qa_bundle_worker_image.py \
            --target-tag "$INPUT_TAG" --target-rollout "$TARGET_ROLLOUT" \
            --verified-existing-image "$VERIFIED_EXISTING_WORKER_IMAGE" \
            --surface-json "$SURFACE_JSON")"
          echo "qa bundle surface: independent baselines to=$INPUT_TAG $SURFACE_JSON"
          echo "qa bundle resolution: $RESOLUTION"
          echo "qa_stack_name=$QA_STACK_NAME" >> "$GITHUB_OUTPUT"
          echo "ops_recovery_principal_arn=$OPS_RECOVERY_PRINCIPAL_ARN" >> "$GITHUB_OUTPUT"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$RESOLUTION" >> "$GITHUB_OUTPUT"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' .prod-release-plan.json >> "$GITHUB_OUTPUT"

      - name: Verify target-tag Phase 3 host artifacts
        if: steps.qa_infra.outputs.mode == 'phase3'
        run: |
          set -euo pipefail
          test -f qa-target-release/deploy/aws/stage0/tokenkey-qa-maintenance.sh
          test -f qa-target-release/deploy/aws/stage0/tokenkey-qa-boundary.sh
          test -f qa-target-release/deploy/aws/stage0/qa-runtime.sh
          test -f qa-target-release/deploy/aws/stage0/qa-runtime-compose.yml

      - name: Configure Stage0 credentials for legacy host safety
        if: steps.qa_infra.outputs.mode == 'legacy_rollback'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pause pinned QA deletion before legacy app rollback
        if: steps.qa_infra.outputs.mode == 'legacy_rollback'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: python3 ops/stage0/prod_release_state.py pause --instance-id "$INSTANCE_ID"

      - name: Disable QA boundary before legacy app rollback
        if: steps.qa_infra.outputs.mode == 'legacy_rollback'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          QA_BOUNDARY_TIMER_STATE: disabled
          QA_HOST_ARTIFACT_SHA: ${{ github.sha }}
          STAGE0_SSM_OUTPUT_DIR: .qa-boundary-legacy-safety
        run: bash ops/stage0/sync-qa-boundary-timer-via-ssm.sh "$INSTANCE_ID" "deploy-stage0 legacy safety boundary"

      - name: Restore QA infrastructure credentials before mutation
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.QA_INFRA_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy QA Bundle infrastructure
        if: steps.qa_infra.outputs.deploy_worker == 'true'
        env:
          QA_RAW_ARCHIVE_STACK: ${{ steps.qa_infra.outputs.qa_stack_name }}
          APP_INSTANCE_ROLE_ARN: ${{ steps.instance.outputs.app_role_arn }}
          OPS_RECOVERY_PRINCIPAL_ARN: ${{ steps.qa_infra.outputs.ops_recovery_principal_arn }}
          QA_RAW_ARCHIVE_VPC_ID: ${{ steps.instance.outputs.vpc_id }}
          QA_RAW_ARCHIVE_ROUTE_TABLE_IDS: ${{ steps.instance.outputs.route_table_id }}
          QA_BUNDLE_WORKER_PUBLIC_SUBNET_IDS: ${{ steps.instance.outputs.subnet_id }}
          QA_BUNDLE_WORKER_IMAGE: ${{ steps.qa_infra.outputs.resolved_worker_image }}
          QA_BUNDLE_WORKER_DESIRED_COUNT: "1"
          QA_BUNDLE_BROWSER_ALLOWED_ORIGIN: ${{ steps.instance.outputs.browser_origin }}
          QA_CLOUDFORMATION_SERVICE_ROLE_ARN: ${{ steps.instance.outputs.qa_cfn_service_role_arn }}
          QA_RAW_ARCHIVE_CONFIRM: "yes"
        run: bash ops/qa/deploy_qa_raw_archive_cfn.sh

      - name: Verify QA Bundle infrastructure
        id: qa_bundle
        env:
          QA_RAW_ARCHIVE_STACK: ${{ steps.qa_infra.outputs.qa_stack_name }}
          QA_BUNDLE_WORKER_IMAGE: ${{ steps.qa_infra.outputs.resolved_worker_image }}
          QA_BUNDLE_WORKER_DESIRED_COUNT: "1"
          QA_BUNDLE_VERIFY_MODE: expected
        run: bash ops/qa/verify_qa_bundle_infra.sh

      - name: Restore Stage0 deployment credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate human-approved replay receipt
        if: inputs.replay_receipt != ''
        id: replay_gate
        env:
          APPROVED_REPLAY: ${{ inputs.replay_receipt }}
          DEPLOY_GATEWAY: ${{ steps.qa_infra.outputs.deploy_gateway }}
        run: |
          set -euo pipefail
          test "$DEPLOY_GATEWAY" = true || { echo "::error::replay continuation requires a gateway deployment plan"; exit 1; }
          python3 scripts/stage0/replay-prod-release.py --tag "$INPUT_TAG" --approved-replay "$APPROVED_REPLAY"

      - name: Deploy via SSM Run-Command
        if: steps.qa_infra.outputs.deploy_gateway == 'true'
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STAGE0_SSM_OUTPUT_DIR: .
          STAGE0_BLUEGREEN_WAIT_PHASE: cutover
          STAGE0_BLUEGREEN_STAGE: ${{ inputs.replay_receipt != '' && 'promote' || 'deploy' }}
          STAGE0_BLUEGREEN_APPROVED_RECEIPT: ${{ steps.replay_gate.outputs.prepared_receipt }}
          STAGE0_BLUEGREEN_APPROVED_REPLAY: ${{ inputs.replay_receipt }}
          QA_BUNDLE_ENABLED: ${{ env.QA_BUNDLE_ENABLED }}
          QA_BUNDLE_QUEUE_URL: ${{ steps.qa_bundle.outputs.queue_url }}
          QA_BUNDLE_STORAGE_DRIVER: ${{ env.QA_BUNDLE_STORAGE_DRIVER }}
          QA_BUNDLE_STORAGE_REGION: ${{ env.AWS_REGION }}
          QA_BUNDLE_STORAGE_BUCKET: ${{ steps.qa_bundle.outputs.bucket }}
          QA_BUNDLE_STORAGE_PREFIX: ${{ env.QA_BUNDLE_STORAGE_PREFIX }}
        run: bash ops/stage0/deploy_via_ssm_bluegreen.sh "$INPUT_TAG" "$INSTANCE_ID" "deploy-stage0 env=prod bluegreen"

      - name: External health check
        env:
          API_URL: ${{ steps.instance.outputs.api_url }}
        run: bash ops/stage0/external_health.sh "$API_URL"

      - name: Post-deploy gateway smoke (API + Claude paths)
        if: steps.qa_infra.outputs.deploy_gateway == 'true'
        env:
          TOKENKEY_BASE_URL: ${{ steps.instance.outputs.api_url }}
          TK_SMOKE_API_KEY: ${{ secrets.TK_SMOKE_API_KEY }}
          TK_SMOKE_ANTHROPIC_MODELS: ${{ vars.TK_SMOKE_ANTHROPIC_MODELS || 'claude-sonnet-4-6' }}
          TK_SMOKE_GEMINI_MODELS: ${{ vars.TK_SMOKE_GEMINI_MODELS || '' }}
          TK_SMOKE_OPENAI_OAUTH_MODELS: ${{ vars.TK_SMOKE_OPENAI_OAUTH_MODELS || 'gpt-5.4' }}
        run: bash ops/stage0/post_deploy_smoke.sh

      - name: Post-deploy global candidate contract
        if: steps.qa_infra.outputs.deploy_gateway == 'true'
        run: python3 ops/observability/probe-global-candidate.py --phase candidate

      - name: Post-deploy SSOT display gate (deploy canary)
        if: steps.qa_infra.outputs.deploy_gateway == 'true'
        env:
          TOKENKEY_BASE_URL: ${{ steps.instance.outputs.api_url }}
          TK_FULLTEST_KEY: ${{ secrets.TK_FULLTEST_KEY }}
          TK_FULLTEST_TIMEOUT: "15"
        run: bash ops/observability/endpoint-compat-audit.sh --ssot-model-matrix --gate --deploy-canary --deploy-closeout

      - name: Report legacy QA rollback degradation
        if: steps.qa_infra.outputs.mode == 'legacy_rollback'
        run: |
          echo "::warning::QA degraded: legacy gateway rollback preserved the Worker and independent maintenance pin, disabled boundary, and paused DROP until compatible component acceptance succeeds."

      - name: Assert live-host state (drift check)
        # ADVISORY ONLY — never blocks the deploy. Reads (read-only) the running
        # active app container image tag + the deploy_via_ssm-injected env (SERVER_FRONTEND_URL,
        # QA_BUNDLE_*) and warns if the live host drifted from what
        # this deploy intended (the running tag != the tag we just deployed, or a
        # sed-injection that wrote the wrong content — the 2026-06 "3× repeat" was
        # caught only by a human probing by hand; this makes it an automatic warning).
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          GATEWAY_TAG: ${{ steps.qa_infra.outputs.gateway_tag }}
          EXPECT_ENV: QA_BUNDLE_ENABLED=${{ env.QA_BUNDLE_ENABLED }},QA_BUNDLE_QUEUE_URL=${{ steps.qa_bundle.outputs.queue_url }},QA_BUNDLE_STORAGE_DRIVER=${{ env.QA_BUNDLE_STORAGE_DRIVER }},QA_BUNDLE_STORAGE_REGION=${{ env.AWS_REGION }},QA_BUNDLE_STORAGE_BUCKET=${{ steps.qa_bundle.outputs.bucket }},QA_BUNDLE_STORAGE_PREFIX=${{ env.QA_BUNDLE_STORAGE_PREFIX }}
        run: bash ops/stage0/assert-live-host-state.sh "$INSTANCE_ID" "$GATEWAY_TAG" "deploy-stage0 live-host assert env=prod"

      - name: Sync Feishu alert config
        if: steps.qa_infra.outputs.deploy_gateway == 'true'
        # Inject the shared Feishu webhook/secret into prod's
        # ops_email_notification_config and enable alerting (idempotent). The
        # script verifies the write and exits non-zero if not applied, so a node
        # that cannot alert FAILS the deploy (gate for the us7 silent-mute gap).
        env:
          TK_FEISHU_WEBHOOK_URL: ${{ secrets.TK_FEISHU_WEBHOOK_URL }}
          TK_FEISHU_SIGNING_SECRET: ${{ secrets.TK_FEISHU_SIGNING_SECRET }}
        run: bash ops/stage0/sync-feishu-config.sh prod

      # Same deploy job: reuse the already-approved prod Environment + OIDC.
      # A second job with environment: prod would re-open Required reviewers
      # and start the +5min clock after that gate, not after cutover.
      - name: Plan checks from live→new PRs
        if: steps.qa_infra.outputs.deploy_gateway == 'true'
        id: post_release_plan
        env:
          LIVE_TAG: ${{ steps.previous_runtime.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "${LIVE_TAG:-}" || { echo "::error::previous prod runtime tag is empty"; exit 1; }
          git fetch --tags --force origin
          git fetch --unshallow origin || true
          OUT_DIR="${RUNNER_TEMP}/post-release-check"
          mkdir -p "$OUT_DIR"
          python3 scripts/release_post_check.py plan --live "$LIVE_TAG" --new "$INPUT_TAG" > "$OUT_DIR/plan.json"
          COUNT="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("changes") or []))' "$OUT_DIR/plan.json")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "planned $COUNT product change(s) in ${LIVE_TAG}..${INPUT_TAG}"
          if [ "$COUNT" = "0" ]; then
            python3 -c 'import json,sys; json.dump({"verdict":"skip","reason":"no product commits","range":{"live":sys.argv[1],"new":sys.argv[2]},"changes":[],"checks":[]}, open(sys.argv[3],"w"), indent=2)' \
              "$LIVE_TAG" "$INPUT_TAG" "$OUT_DIR/evaluate.json"
          fi

      - name: Check PR hooks immediately
        if: steps.post_release_plan.outputs.count != '' && steps.post_release_plan.outputs.count != '0'
        id: post_release_immediate
        continue-on-error: true  # preflight-allow: swallow; final verdict gate runs after both phases
        env:
          LIVE_TAG: ${{ steps.previous_runtime.outputs.tag }}
          OUT_DIR: ${{ steps.post_release_plan.outputs.out_dir }}
          OBSERVATION_SINCE: ${{ steps.ssm.outputs.cutover_at }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/immediate"
          bash ops/observability/run-post-release-check.sh \
            --live "$LIVE_TAG" \
            --new "$INPUT_TAG" \
            --target prod \
            --phase immediate \
            --since "$OBSERVATION_SINCE" \
            --plan-file "$OUT_DIR/plan.json" \
            --out-dir "$OUT_DIR/immediate"

      - name: Wait until 5 minutes after cutover
        if: steps.qa_infra.outputs.deploy_gateway == 'true'
        env:
          OBSERVATION_SINCE: ${{ steps.ssm.outputs.cutover_at }}
        run: |
          set -euo pipefail
          python3 scripts/release_post_check.py wait \
            --since "$OBSERVATION_SINCE" \
            --minimum-seconds 300

      - name: Check traffic and 5xx after 5 minutes
        if: steps.post_release_plan.outputs.count != '' && steps.post_release_plan.outputs.count != '0'
        id: post_release_check
        continue-on-error: true  # preflight-allow: swallow; final verdict gate runs after summary
        env:
          LIVE_TAG: ${{ steps.previous_runtime.outputs.tag }}
          OUT_DIR: ${{ steps.post_release_plan.outputs.out_dir }}
          OBSERVATION_SINCE: ${{ steps.ssm.outputs.cutover_at }}
        run: |
          set -euo pipefail
          bash ops/observability/run-post-release-check.sh \
            --live "$LIVE_TAG" \
            --new "$INPUT_TAG" \
            --target prod \
            --phase delayed \
            --since "$OBSERVATION_SINCE" \
            --plan-file "$OUT_DIR/plan.json" \
            --out-dir "$OUT_DIR"

      - name: Post-release check summary
        if: always() && steps.post_release_plan.outcome != 'skipped'
        env:
          LIVE_TAG: ${{ steps.previous_runtime.outputs.tag }}
          OUT_DIR: ${{ steps.post_release_plan.outputs.out_dir }}
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${OUT_DIR:-${RUNNER_TEMP}/missing-post-release-check}"
          python3 scripts/release_post_check.py summary \
            --immediate-evaluation-file "$EVIDENCE_DIR/immediate/evaluate.json" \
            --evaluation-file "$EVIDENCE_DIR/evaluate.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce post-release verdicts
        if: always() && steps.post_release_plan.outputs.count != '' && steps.post_release_plan.outputs.count != '0'
        env:
          OUT_DIR: ${{ steps.post_release_plan.outputs.out_dir }}
        run: |
          set -euo pipefail
          python3 scripts/release_post_check.py gate \
            --immediate-evaluation-file "$OUT_DIR/immediate/evaluate.json" \
            --evaluation-file "$OUT_DIR/evaluate.json"

      - name: Join gateway deployment and old request drain
        if: always() && steps.ssm.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          DEPLOY_COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          DEPLOY_TOKEN: ${{ steps.ssm.outputs.deploy_token }}
        run: |
          python3 ops/stage0/bluegreen_completion.py complete --instance-id "$INSTANCE_ID" \
            --command-id "$DEPLOY_COMMAND_ID" --token "$DEPLOY_TOKEN" --tag "$INPUT_TAG"

      - name: Sync QA maintenance host runner
        if: steps.qa_infra.outputs.deploy_maintenance == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          QA_MAINTENANCE_TIMER_STATE: enabled
          QA_HOST_ARTIFACT_ROOT: qa-target-release
          QA_HOST_ARTIFACT_SHA: ${{ steps.qa_target.outputs.sha }}
          QA_MAINTENANCE_IMAGE: ghcr.io/youxuanxue/sub2api:${{ steps.qa_infra.outputs.maintenance_tag }}
          STAGE0_SSM_OUTPUT_DIR: .qa-maintenance-sync
        run: bash ops/stage0/sync-qa-maintenance-timer-via-ssm.sh "$INSTANCE_ID" "deploy-stage0 qa-maintenance host artifact"

      - name: Sync QA boundary host runner and restore durable owner
        if: steps.qa_infra.outputs.deploy_maintenance == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          QA_BOUNDARY_TIMER_STATE: auto
          QA_HOST_ARTIFACT_ROOT: qa-target-release
          QA_HOST_ARTIFACT_SHA: ${{ steps.qa_target.outputs.sha }}
          STAGE0_SSM_OUTPUT_DIR: .qa-boundary-sync
        run: bash ops/stage0/sync-qa-boundary-timer-via-ssm.sh "$INSTANCE_ID" "deploy-stage0 qa-boundary host artifact"

      - name: Bind selected QA runtime for acceptance
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: python3 ops/stage0/prod_release_state.py bind --instance-id "$INSTANCE_ID" --plan .prod-release-plan.json

      - name: Verify QA maintenance systemd execution
        if: steps.qa_infra.outputs.deploy_maintenance == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STAGE0_SSM_OUTPUT_DIR: .qa-maintenance-health-gate
          STAGE0_SSM_TIMEOUT_SECONDS: "2700"
        run: bash ops/stage0/run-qa-maintenance-health-gate-via-ssm.sh "$INSTANCE_ID" "deploy-stage0 qa-maintenance systemd health gate"

      - name: Post-deploy QA Bundle canary
        if: steps.qa_infra.outputs.run_canary == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          QA_CANARY_IMAGE: ghcr.io/youxuanxue/sub2api:${{ steps.qa_infra.outputs.canary_tag }}
          STAGE0_SSM_OUTPUT_DIR: .qa-bundle-canary
        run: bash ops/stage0/run-qa-bundle-canary-via-ssm.sh "$INSTANCE_ID" "deploy-stage0 qa-bundle canary"

      - name: Record verified component combination
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: python3 ops/stage0/prod_release_state.py record --instance-id "$INSTANCE_ID" --plan .prod-release-plan.json

      - name: Notify Feishu (release rollout)
        if: steps.qa_infra.outputs.deploy_gateway == 'true'
        # Best-effort 发版公告。只在 prod 换镜像 + external health + smoke +
        # immediate hooks +5min traffic post-release（green 或 skip）之后才跑 ——
        # 卡片 == 该版本已上线且烟测与 live→new PR 实测均通过（或无可测产品提交）。
        # 标 continue-on-error 让 webhook 抽风不把成功的 prod deploy 标红(对齐
        # release.yml 的 Telegram 步)。脚本本身也始终 exit 0(双保险),失败时
        # 打 ::warning::,绝不打印 webhook/secret。
        continue-on-error: true  # preflight-allow: swallow
        env:
          TK_FEISHU_WEBHOOK_URL: ${{ secrets.TK_FEISHU_WEBHOOK_URL }}
          TK_FEISHU_SIGNING_SECRET: ${{ secrets.TK_FEISHU_SIGNING_SECRET }}
          API_URL: ${{ steps.instance.outputs.api_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Feishu rollout notes describe what changed since the tag that was
          # actually serving before this deploy. collect-feishu-release-notes.sh
          # unshallows the fetch-depth:1 clone so git log A..B is walkable
          # (fetching only the two tag tips is not enough). Empty notes omit
          # 「本次更新」; do not inline git log here.
          PREVIOUS_TAG="${{ steps.previous_runtime.outputs.tag }}"
          NOTES="$(bash ops/stage0/collect-feishu-release-notes.sh "$PREVIOUS_TAG" "$INPUT_TAG")"
          bash ops/stage0/notify-feishu-release.sh "$INPUT_TAG" "$API_URL" \
            --previous-tag "$PREVIOUS_TAG" --run-url "$RUN_URL" --notes "$NOTES"

      - name: Job summary
        if: always()
        env:
          API_URL: ${{ steps.instance.outputs.api_url }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          STACK_NAME: ${{ steps.stack.outputs.name }}
          CMD_ID: ${{ steps.ssm.outputs.command_id }}
          INPUT_TAG: ${{ inputs.tag }}
          GATEWAY_TAG: ${{ steps.qa_infra.outputs.gateway_tag }}
          QA_MODE: ${{ steps.qa_infra.outputs.mode }}
          QA_WORKER_IMAGE: ${{ steps.qa_infra.outputs.resolved_worker_image }}
          QA_WORKER_SOURCE: ${{ steps.qa_infra.outputs.worker_source }}
          QA_HOST_RUNTIME_MODE: ${{ steps.qa_infra.outputs.host_runtime_mode }}
          QA_MAINTENANCE_TAG: ${{ steps.qa_infra.outputs.maintenance_tag }}
        run: |
          {
            echo "## deploy-stage0"
            echo "- environment: \`prod\`"
            echo "- app image: \`ghcr.io/youxuanxue/sub2api:${GATEWAY_TAG:-not-resolved}\`"
            echo "- QA mode: \`${QA_MODE:-not-resolved}\`"
            echo "- QA Bundle Worker image: \`${QA_WORKER_IMAGE:-not-resolved}\`"
            echo "- QA Bundle Worker source: \`${QA_WORKER_SOURCE:-not-resolved}\`"
            echo "- QA host runtime mode: \`${QA_HOST_RUNTIME_MODE:-not-resolved}\`"
            echo "- QA maintenance image: \`ghcr.io/youxuanxue/sub2api:${QA_MAINTENANCE_TAG:-not-resolved}\`"
            if [ -f .prod-release-plan.json ]; then
              echo '- Component selection:'
              echo '```json'
              jq '{deploy_gateway,deploy_worker,deploy_maintenance,run_canary,reason,plan_id}' .prod-release-plan.json
              echo '```'
            fi
            echo "- stack: \`$STACK_NAME\`"
            echo "- instance: \`$INSTANCE_ID\`"
            echo "- api: $API_URL"
            echo "- ssm command id: \`${CMD_ID:-none}\`"
            echo
            if [ "$QA_MODE" = legacy_rollback ]; then
              echo "**QA degraded:** legacy rollback preserved the Worker and independent maintenance pin, disabled boundary, skipped Bundle canary, and paused DROP."
              echo
            fi
            echo "Rollback: re-dispatch with a previous tag. Legacy mode requires a verified Worker and independent maintenance pin, and pauses DROP until compatible component acceptance succeeds."
            echo
            echo '```bash'
            echo "gh workflow run deploy-stage0.yml -f tag=<previous>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  qa-infra-check:
    if: inputs.operation == 'qa-infra-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      QA_INFRA_OIDC_ROLE_ARN: ${{ vars.QA_INFRA_OIDC_ROLE_ARN }}
      CICD_OIDC_STACK_NAME: ${{ vars.CICD_OIDC_STACK_NAME || 'tokenkey-cicd-oidc' }}
      QA_STACK_NAME: ${{ vars.QA_RAW_ARCHIVE_STACK || 'tokenkey-prod-qa-raw-archive' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate QA infrastructure check inputs
        run: |
          set -euo pipefail
          test -n "${OIDC_ROLE_ARN:-}" || { echo "::error::AWS_OIDC_ROLE_ARN is unset"; exit 1; }
          test -n "${QA_INFRA_OIDC_ROLE_ARN:-}" || { echo "::error::QA_INFRA_OIDC_ROLE_ARN is unset"; exit 1; }

      - name: Configure Stage0 read credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify QA role outputs and configured variable
        id: qa_roles
        run: |
          set -euo pipefail
          OUTPUTS="$(aws cloudformation describe-stacks --stack-name "$CICD_OIDC_STACK_NAME" --query 'Stacks[0].Outputs' --output json)"
          DEPLOYMENT_ROLE="$(jq -r '.[] | select(.OutputKey == "QAInfraDeploymentRoleArn") | .OutputValue' <<<"$OUTPUTS")"
          SERVICE_ROLE="$(jq -r '.[] | select(.OutputKey == "QAInfraCloudFormationServiceRoleArn") | .OutputValue' <<<"$OUTPUTS")"
          for value in "$DEPLOYMENT_ROLE" "$SERVICE_ROLE"; do
            test -n "$value" && test "$value" != None || { echo "::error::QA OIDC stack outputs are incomplete"; exit 1; }
          done
          test "$QA_INFRA_OIDC_ROLE_ARN" = "$DEPLOYMENT_ROLE" || {
            echo "::error::QA_INFRA_OIDC_ROLE_ARN does not match QAInfraDeploymentRoleArn"
            exit 1
          }
          echo "deployment_role=$DEPLOYMENT_ROLE" >> "$GITHUB_OUTPUT"
          echo "service_role=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Assume QA deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.qa_roles.outputs.deployment_role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify QA role access and stack service role
        id: qa_access
        env:
          EXPECTED_SERVICE_ROLE: ${{ steps.qa_roles.outputs.service_role }}
        run: |
          set -euo pipefail
          CALLER_ARN="$(aws sts get-caller-identity --query Arn --output text)"
          STACK="$(aws cloudformation describe-stacks --stack-name "$QA_STACK_NAME" --output json)"
          STATUS="$(jq -r '.Stacks[0].StackStatus' <<<"$STACK")"
          ROLE_ARN="$(jq -r '.Stacks[0].RoleARN // empty' <<<"$STACK")"
          BUNDLE_IMAGE="$(jq -r '.Stacks[0].Parameters[]? | select(.ParameterKey == "BundleWorkerImage") | .ParameterValue' <<<"$STACK")"
          OUTPUT_KEYS="$(jq -c '[.Stacks[0].Outputs[]?.OutputKey]' <<<"$STACK")"
          [[ "$STATUS" =~ _COMPLETE$ ]] || { echo "::error::QA stack is not complete: $STATUS"; exit 1; }
          LEGACY_REQUIRED_OUTPUTS='["QaRawArchiveBucketName","QaRawArchiveRecoveryRoleArn"]'
          if ! jq -e --argjson required "$LEGACY_REQUIRED_OUTPUTS" '($required - .) | length == 0' <<<"$OUTPUT_KEYS" >/dev/null; then
            echo "::error::QA stack does not match the recognized raw-archive contract"
            exit 1
          fi
          if [ -n "$BUNDLE_IMAGE" ] && [ "$BUNDLE_IMAGE" != None ]; then
            test "$ROLE_ARN" = "$EXPECTED_SERVICE_ROLE" || {
              echo "::error::Bundle-era QA stack is not bound to the expected CloudFormation service role"
              exit 1
            }
            READINESS=bundle_ready
          else
            test -z "$ROLE_ARN" || test "$ROLE_ARN" = "$EXPECTED_SERVICE_ROLE" || {
              echo "::error::legacy QA stack has an unexpected CloudFormation service role"
              exit 1
            }
            READINESS=legacy_bootstrap_ready
          fi
          echo "caller_arn=$CALLER_ARN" >> "$GITHUB_OUTPUT"
          echo "stack_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "readiness=$READINESS" >> "$GITHUB_OUTPUT"

      - name: Job summary
        env:
          CALLER_ARN: ${{ steps.qa_access.outputs.caller_arn }}
          STACK_STATUS: ${{ steps.qa_access.outputs.stack_status }}
          READINESS: ${{ steps.qa_access.outputs.readiness }}
        run: |
          {
            echo "## QA infrastructure OIDC check"
            echo "- deployment role: \`${{ steps.qa_roles.outputs.deployment_role }}\`"
            echo "- service role: \`${{ steps.qa_roles.outputs.service_role }}\`"
            echo "- assumed caller: \`${CALLER_ARN}\`"
            echo "- QA stack: \`${QA_STACK_NAME}\` (${STACK_STATUS})"
            echo "- readiness: \`${READINESS}\`"
            echo "- safety: read-only; no change set, SSM command, host sync, canary, or app mutation"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-only:
    if: inputs.operation == 'smoke-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
    env:
      INPUT_TAG: ${{ inputs.tag }}
      TOKENKEY_BASE_URL: ${{ vars.PROD_API_URL || 'https://api.tokenkey.dev' }}
      TK_FULLTEST_BASE_URL: ${{ vars.PROD_API_URL || 'https://api.tokenkey.dev' }}
      INPUT_SSOT_MODELS: ${{ inputs.ssot_models }}
      GATEWAY_SMOKE_SUITE: full
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate smoke audit tag
        run: bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"

      - name: Validate prod smoke secrets
        env:
          TK_SMOKE_API_KEY: ${{ secrets.TK_SMOKE_API_KEY }}
          TK_FULLTEST_KEY: ${{ secrets.TK_FULLTEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TK_SMOKE_API_KEY:-}" ]; then
            echo "::error::TK_SMOKE_API_KEY is not set in prod Environment."
            exit 1
          fi
          if [ -z "${TK_FULLTEST_KEY:-}" ]; then
            echo "::error::TK_FULLTEST_KEY is not set in prod Environment."
            exit 1
          fi

      - name: Prod gateway smoke (read-only acceptance)
        id: gateway_smoke
        env:
          TK_SMOKE_API_KEY: ${{ secrets.TK_SMOKE_API_KEY }}
          TK_SMOKE_ANTHROPIC_MODELS: ${{ vars.TK_SMOKE_ANTHROPIC_MODELS || 'claude-sonnet-4-6' }}
          TK_SMOKE_GEMINI_MODELS: ${{ vars.TK_SMOKE_GEMINI_MODELS || '' }}
          TK_SMOKE_OPENAI_OAUTH_MODELS: ${{ vars.TK_SMOKE_OPENAI_OAUTH_MODELS || 'gpt-5.4' }}
        run: |
          set -euo pipefail
          bash ops/stage0/post_deploy_smoke.sh

      - name: Prod SSOT display gate (read-only acceptance)
        id: ssot_gate
        env:
          TK_FULLTEST_KEY: ${{ secrets.TK_FULLTEST_KEY }}
          TK_FULLTEST_TIMEOUT: "15"
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SSOT_MODELS//[[:space:]]/}" ]]; then
            python3 scripts/checks/ssot-delta-gate.py focused --models "$INPUT_SSOT_MODELS"
          else
            bash ops/observability/endpoint-compat-audit.sh --ssot-model-matrix --gate --deploy-canary --deploy-closeout
          fi

      - name: Job summary
        if: always()
        env:
          GATEWAY_SMOKE_OUTCOME: ${{ steps.gateway_smoke.outcome }}
          SSOT_GATE_OUTCOME: ${{ steps.ssot_gate.outcome }}
        run: |
          {
            echo "## deploy-stage0"
            echo '- operation: `smoke-only`'
            echo '- environment: `prod`'
            echo "- audit tag: \`${INPUT_TAG}\`"
            echo "- api: ${TOKENKEY_BASE_URL}"
            echo "- gateway smoke: ${GATEWAY_SMOKE_OUTCOME:-not-run}"
            echo "- SSOT display gate: ${SSOT_GATE_OUTCOME:-not-run}"
            echo "- focused SSOT models: ${INPUT_SSOT_MODELS:-platform-canary}"
            echo "- safety: no image or host state was changed"
          } >> "$GITHUB_STEP_SUMMARY"
