name: Warm Release Cache

# Default-branch writer for the five managed Go cache families. Required CI
# stays correct on a miss. This workflow is acceleration, not a required gate.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**/*.go'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/.golangci.yml'
      - '.new-api-ref'
      - '.goreleaser.yaml'
      - '.github/workflows/warm-release-cache-main.yml'
      - '.github/actions/go-rolling-cache/action.yml'
      - 'scripts/ci/go_cache_prune.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: warm-release-cache-main
  cancel-in-progress: true

jobs:
  warm-release-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cache-and-checkout-new-api
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Resolve exact Go version
        id: go_version
        run: |
          version="$(awk '/^go /{print $2; exit}' backend/go.mod)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          go version | grep -Fq "go${version}"

      - name: Restore Go module cache
        id: gomod_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}
          restore-keys: |
            ${{ runner.os }}-gomod-v1-${{ steps.go_version.outputs.version }}-
            ${{ runner.os }}-gomod-
      - name: Download modules
        if: steps.gomod_cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: go mod download
      - name: Save Go module cache
        if: steps.gomod_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}

      - name: Restore test build cache
        id: test_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-test-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}-${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml', '.goreleaser.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-test-v1-${{ steps.go_version.outputs.version }}-
            ${{ runner.os }}-gobuild-test-
            ${{ runner.os }}-gobuild-unit-nodwarf-v3-
      - name: Warm test build cache
        if: steps.test_cache.outputs.cache-hit != 'true'
        working-directory: backend
        env:
          GOFLAGS: -trimpath -gcflags=all=-dwarf=false
        run: |
          go test -tags=unit -run=^$ ./...
          # Match unit_test_runner's service -c so a warm exact hit does not
          # still spend ~100s linking ./internal/service.test.
          go test -c -tags=unit -o "${RUNNER_TEMP}/service.test" ./internal/service
      - name: Save test build cache
        if: steps.test_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-test-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}-${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml', '.goreleaser.yaml') }}
      - name: Isolate default GOCACHE before the next family
        run: rm -rf ~/.cache/go-build

      - name: Restore integration build cache
        id: integration_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache/go-build-integration
          key: ${{ runner.os }}-gobuild-integration-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}-${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml', '.goreleaser.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-integration-v1-${{ steps.go_version.outputs.version }}-
            ${{ runner.os }}-gobuild-integration-
            ${{ runner.os }}-gobuild-integration-nodwarf-v2-
      - name: Warm integration build cache
        if: steps.integration_cache.outputs.cache-hit != 'true'
        working-directory: backend
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build-integration
          GOFLAGS: -trimpath -gcflags=all=-dwarf=false
        run: |
          set -euo pipefail
          integration_packages=()
          while IFS= read -r package; do
            integration_packages+=("$package")
          done < <(python3 ../scripts/ci/integration-packages.py --root .)
          mkdir -p "${RUNNER_TEMP}/integration-cache"
          go test -c -tags=integration \
            -o "${RUNNER_TEMP}/integration-cache/" \
            "${integration_packages[@]}"
      - name: Save integration build cache
        if: steps.integration_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache/go-build-integration
          key: ${{ runner.os }}-gobuild-integration-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}-${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml', '.goreleaser.yaml') }}

      - name: Restore analysis build cache
        id: analysis_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-gobuild-analysis-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}-${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml', '.goreleaser.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-analysis-v1-${{ steps.go_version.outputs.version }}-
            ${{ runner.os }}-gobuild-analysis-
            ${{ runner.os }}-gobuild-lint-nodwarf-v1-
      # Skip warm/save when this family would be overflow-dropped under the 6 GiB
      # budget — otherwise we thrash: upload then --heal deletes the same entry.
      - name: Budget gate for analysis warm
        id: analysis_budget
        if: steps.analysis_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/ci/go_cache_prune.py --fits analysis; then
            echo "fits=true" >> "$GITHUB_OUTPUT"
          else
            echo "fits=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skip analysis warm/save; family would be overflow-dropped under 6 GiB budget"
          fi
      - name: Warm analysis build cache
        if: steps.analysis_cache.outputs.cache-hit != 'true' && steps.analysis_budget.outputs.fits == 'true'
        working-directory: backend
        env:
          GOFLAGS: -trimpath -gcflags=all=-dwarf=false
        run: go test -run=^$ ./...
      - name: Warm golangci-lint cache
        if: steps.analysis_cache.outputs.cache-hit != 'true' && steps.analysis_budget.outputs.fits == 'true'
        uses: golangci/golangci-lint-action@v9
        env:
          GOFLAGS: -trimpath -gcflags=all=-dwarf=false
        with:
          version: v2.9
          args: --concurrency=4 --timeout=30m
          working-directory: backend
          only-new-issues: false
          skip-cache: "true"
      - name: Budget gate for analysis save
        id: analysis_save_budget
        if: steps.analysis_cache.outputs.cache-hit != 'true' && steps.analysis_budget.outputs.fits == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          size="$(du -sb "$HOME/.cache/go-build" "$HOME/.cache/golangci-lint" 2>/dev/null | awk '{s+=$1} END {print s+0}')"
          if python3 scripts/ci/go_cache_prune.py --fits analysis --size "$size"; then
            echo "fits=true" >> "$GITHUB_OUTPUT"
          else
            echo "fits=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skip analysis cache save (size=${size}); would be overflow-dropped under 6 GiB budget"
          fi
      - name: Save analysis build cache
        if: steps.analysis_cache.outputs.cache-hit != 'true' && steps.analysis_save_budget.outputs.fits == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-gobuild-analysis-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}-${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml', '.goreleaser.yaml') }}
      - name: Isolate default GOCACHE before the release family
        run: rm -rf ~/.cache/go-build

      - name: Restore release build cache
        id: release_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-release-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}-${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml', '.goreleaser.yaml') }}
          restore-keys: |
            ${{ runner.os }}-go-release-v1-${{ steps.go_version.outputs.version }}-
            ${{ runner.os }}-go-release-
      - name: Budget gate for release warm
        id: release_budget
        if: steps.release_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/ci/go_cache_prune.py --fits release; then
            echo "fits=true" >> "$GITHUB_OUTPUT"
          else
            echo "fits=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skip release warm/save; family would be overflow-dropped under 6 GiB budget"
          fi
      - name: Warm cross-arch Go build cache
        if: steps.release_cache.outputs.cache-hit != 'true' && steps.release_budget.outputs.fits == 'true'
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOFLAGS: -trimpath
        run: |
          for arch in amd64 arm64; do
            echo "::group::go build release linux/${arch}"
            GOARCH="${arch}" go build -tags=embed -o /dev/null ./cmd/server
            GOARCH="${arch}" go build -o /dev/null ./cmd/qa-archive
            echo "::endgroup::"
          done
      - name: Budget gate for release save
        id: release_save_budget
        if: steps.release_cache.outputs.cache-hit != 'true' && steps.release_budget.outputs.fits == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          size="$(du -sb "$HOME/.cache/go-build" 2>/dev/null | awk '{print $1+0}')"
          if python3 scripts/ci/go_cache_prune.py --fits release --size "$size"; then
            echo "fits=true" >> "$GITHUB_OUTPUT"
          else
            echo "fits=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skip release cache save (size=${size}); would be overflow-dropped under 6 GiB budget"
          fi
      - name: Save release build cache
        if: steps.release_cache.outputs.cache-hit != 'true' && steps.release_save_budget.outputs.fits == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-release-v1-${{ steps.go_version.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', '.new-api-ref') }}-${{ hashFiles('backend/**/*.go', 'backend/.golangci.yml', '.goreleaser.yaml') }}

      # Budget is hard at 6 GiB of latest generations. When latest alone overflows,
      # --heal drops lowest-priority family latest (analysis → release → …) and
      # applies the prune plan so required CI stays correct on a miss. Warm/save
      # gates above skip families that would only thrash under that policy.
      - name: Heal managed Go cache budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/go_cache_prune.py --heal
