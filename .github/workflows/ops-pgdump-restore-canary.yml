name: Legacy pg_dump Restore Canary (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: read
      id-token: write
    env:
      OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      PROD_SSM_TARGET: ${{ vars.PROD_SSM_TARGET || 'auto' }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Run isolated pg_dump restore canary
        id: canary
        run: |
          set -euo pipefail
          bash ops/observability/run-probe.sh \
            --target prod \
            --script ops/stage0/pgdump_restore_canary_remote.sh \
            --with ops/stage0/pgdump_restore_canary.py \
            --with ops/stage0/pgdump_restore_canary_contract.py \
            --with ops/stage0/pgdump_usage_evidence.py \
            --with ops/stage0/pgdump_storage.py \
            --compressed-output \
            --timeout-seconds 10800 \
            --comment "legacy manual pgdump restore canary target=prod" \
            --env CANARY_TARGET=prod | tee restore-canary.json
          jq -e '.mode == "pgdump_restore_canary" and .target == "prod" and .source_mutated == false and .deletion_authorized == false' restore-canary.json >/dev/null
