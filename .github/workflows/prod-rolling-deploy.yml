name: prod rolling deploy
# Contract: docs/approved/design-prod-entry-multi-app.md §5 + cn-prod rolling §4/§5.
# Rolls the prewarmed image across prod app nodes (app-cand first, then app-old).
# Requires layout.kind=single-container on the matrix; Stage0 bluegreen hosts refuse.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag X.Y.Z (already prewarmed on every app node)
        required: true
        type: string
      revision:
        description: Full 40-hex commit sha of the release
        required: true
        type: string
      confirm:
        description: Type rolling-prod-<tag> to deploy
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: prod-deploy
  cancel-in-progress: false
jobs:
  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # prod owns required reviewers and the AWS OIDC subject used below.
    environment: prod
    env:
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_REVISION: ${{ inputs.revision }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
      AWS_REGION: eu-west-2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate inputs
        run: |
          set -euo pipefail
          bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"
          if [[ ! "$INPUT_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be the full 40-hex commit sha" >&2
            exit 1
          fi
          if [[ "$INPUT_CONFIRM" != "rolling-prod-${INPUT_TAG}" ]]; then
            echo "::error::confirm must be rolling-prod-${INPUT_TAG}" >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure AWS (SSM fallback path)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Plan (prepares remote helpers)
        run: |
          set -euo pipefail
          python3 deploy/domestic/rolling.py plan \
            --manifest deploy/tencent/candidate-usw-20261022.json \
            --via ssm \
            --tag "$INPUT_TAG" --revision "$INPUT_REVISION" \
            --receipt-out prod-rolling-plan.json 2>&1 | tee prod-rolling-plan.log
      - name: Deploy
        run: |
          set -euo pipefail
          python3 deploy/domestic/rolling.py deploy \
            --manifest deploy/tencent/candidate-usw-20261022.json \
            --via ssm \
            --tag "$INPUT_TAG" --revision "$INPUT_REVISION" \
            --confirm "$INPUT_CONFIRM" \
            --receipt-out prod-rolling-receipt.json 2>&1 | tee prod-rolling-deploy.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prod-rolling-deploy-receipts
          path: |
            prod-rolling-*.json
            prod-rolling-*.log
          if-no-files-found: warn
          retention-days: 30
