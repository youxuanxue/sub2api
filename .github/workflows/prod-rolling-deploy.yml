name: prod rolling deploy
# Contract: docs/approved/design-prod-entry-multi-app.md §5 + cn-prod rolling §4/§5.
# Rolls the prewarmed image across prod app nodes (app-cand first, then app-old).
# Requires layout.kind=single-container on the matrix; Stage0 bluegreen hosts refuse.
# Default remote channel is TAT (tencent-ops), mirroring cn-prod-rolling-deploy.yml.
# SSM remains an emergency path outside this workflow (see deploy/hetzner/README.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag X.Y.Z (already prewarmed on every app node)
        required: true
        type: string
      revision:
        description: Full 40-hex commit sha of the release
        required: true
        type: string
      confirm:
        description: Type rolling-prod-<tag> to deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prod-deploy
  cancel-in-progress: false
jobs:
  approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod
    steps:
      - name: Release approval gate
        run: echo "prod rolling deploy approved by the prod Environment reviewer"
  rolling:
    needs: approval
    runs-on: ubuntu-latest
    # 2 nodes x (10 min drain + up/smoke/traffic) plus rollback headroom.
    timeout-minutes: 75
    environment: tencent-ops
    env:
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_REVISION: ${{ inputs.revision }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
    steps:
      # Trusted default-branch code only; tencent-ops is limited to main.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate inputs
        run: |
          set -euo pipefail
          bash ops/stage0/validate-deploy-tag.sh "$INPUT_TAG"
          if [[ ! "$INPUT_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be the full 40-hex commit sha" >&2
            exit 1
          fi
          if [[ "$INPUT_CONFIRM" != "rolling-prod-${INPUT_TAG}" ]]; then
            echo "::error::confirm must be rolling-prod-${INPUT_TAG}" >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tccli
        run: python3 -m pip install 'tccli==3.1.198.1'
      - name: Plan (read-only)
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 deploy/domestic/rolling.py plan \
            --manifest deploy/tencent/candidate-usw-20261022.json \
            --via tat \
            --tag "$INPUT_TAG" --revision "$INPUT_REVISION" \
            --receipt-out prod-rolling-plan.json 2>&1 | tee prod-rolling-plan.log
      - name: Deploy
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 deploy/domestic/rolling.py deploy \
            --manifest deploy/tencent/candidate-usw-20261022.json \
            --via tat \
            --tag "$INPUT_TAG" --revision "$INPUT_REVISION" \
            --confirm "$INPUT_CONFIRM" \
            --receipt-out prod-rolling-receipt.json 2>&1 | tee prod-rolling-deploy.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prod-rolling-deploy-receipts
          path: |
            prod-rolling-*.json
            prod-rolling-*.log
          if-no-files-found: warn
          retention-days: 30
