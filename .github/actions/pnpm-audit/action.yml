name: Frontend production audit
description: Query OSV for the installed pnpm production tree and validate exceptions

runs:
  using: composite
  steps:
    - name: Query production advisories
      shell: bash
      working-directory: frontend
      run: |
        python3 ../tools/run_pnpm_audit.py \
          --output audit.json \
          --attempts 3 \
          --timeout-seconds 30

    - name: Check audit exceptions
      shell: bash
      run: |
        python3 tools/check_pnpm_audit_exceptions.py \
          --audit frontend/audit.json \
          --exceptions .github/audit-exceptions.yml
